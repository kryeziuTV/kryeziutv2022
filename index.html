<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TV App UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

<style>
  body {
    background:#3f4451;
    font-family:'Rubik',sans-serif;
    color:#fff;
    margin:0;
    padding:40px;
    overflow:hidden;
  }

  .categories {
    display:flex;
    gap:20px;
    margin-bottom:40px;
  }

  .cat-btn {
    background:#6246B8;
    color:#fff;
    padding:15px 28px;
    border-radius:12px;
    font-weight:500;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.45);
    transition:.2s;
  }
  .cat-btn:hover,
  .cat-btn:focus {
    box-shadow:0 12px 40px rgba(0,0,0,.5);
    transform:translateY(-2px);
    outline:none;
  }

  .grid {
    display:grid;
    grid-template-columns:repeat(7,120px);
    gap:20px;
  }

  .channel {
    width:120px;
    height:120px;
    background:#fff;
    border-radius:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:.2s;
  }
  .channel:hover,
  .channel:focus {
    transform:translateY(-2px);
    box-shadow:0 12px 40px rgba(0,0,0,.55);
    outline:none;
  }

  .channel img {
    width:80%;
    height:80%;
    object-fit:contain;
  }

  /* FULLSCREEN PLAYER */
  #playerContainer {
    position:fixed;
    inset:0;
    background:black;
    display:none;
    z-index:999999;
    align-items:center;
    justify-content:center;
  }

  #playerContainer video {
    position:absolute;
    top:50%;
    left:50%;
    width:110vw;     /* Zmadhuar pak që të mos dalin shirita në TV */
    height:110vh;    /* Po zmadhuar pak */
    transform:translate(-50%, -50%);
    object-fit:cover;
    background:black;
}
</style>
</head>
<body>

<div class="categories" id="categories"></div>
<div class="grid" id="grid"></div>

<div id="playerContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
// detect mobile
function isMobile(){
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
}

// force landscape on mobile only
if (isMobile()) {
  screen.orientation?.lock("landscape").catch(()=>{});
}

// --- data ---
const categories = ["LIVE TV","FILMA","SPORT","FEMIJE","DOKU"];
const channelsByCategory = {
  "LIVE TV": [
    { name:"TOP CHANNEL", logo:"https://vimg.ipko.tv/logo/color/topchanel.png", url:"https://cf.business-cdn.me/live/FrancescoFili/e76dc66304/1221574.m3u8" },
    { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png", url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
    { name:"RTK 3", logo:"http://vimg.ipko.tv/logo/color/rtk3.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },
    { name:"KTV", logo:"http://vimg.ipko.tv/logo/color/ktv.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/lj9-pxm-o53-rp0/tracks-v4a1/mono.ts.m3u8" }
  ],

  "FILMA": [
    { name:"Cinema 1", logo:"https://via.placeholder.com/120x120?text=C1", url:"" },
    { name:"Cinema 2", logo:"https://via.placeholder.com/120x120?text=C2", url:"" },
    { name:"Cinema 3", logo:"https://via.placeholder.com/120x120?text=C3", url:"" }
  ],

  "SPORT": [
    { name:"Sport+", logo:"https://via.placeholder.com/120x120?text=S+", url:"" },
    { name:"Arena", logo:"https://via.placeholder.com/120x120?text=A", url:"" }
  ],

  "FEMIJE": [
    { name:"Kids 1", logo:"https://via.placeholder.com/120x120?text=K1", url:"" },
    { name:"Kids 2", logo:"https://via.placeholder.com/120x120?text=K2", url:"" }
  ],

  "DOKU": [
    { name:"Doku 1", logo:"https://via.placeholder.com/120x120?text=D1", url:"" },
    { name:"Doku 2", logo:"https://via.placeholder.com/120x120?text=D2", url:"" }
  ]
};

// DOM
const catWrap = document.getElementById("categories");
const grid = document.getElementById("grid");
const playerContainer = document.getElementById("playerContainer");
let hls = null;
let currentCategory = "LIVE TV";

// build categories
categories.forEach((cat,ci)=>{
  const btn = document.createElement("button");
  btn.className = "cat-btn";
  btn.textContent = cat;
  btn.onclick = ()=> loadCategory(cat);
  catWrap.appendChild(btn);
});

function loadCategory(cat){
  currentCategory = cat;
  grid.innerHTML = "";
  const list = channelsByCategory[cat] || [];

  list.forEach(ch=>{
    const box = document.createElement("button");
    box.className = "channel";
    box.innerHTML = `<img src="${ch.logo}" alt="${ch.name}"/>`;
    box.onclick = ()=> openPlayer(ch);
    grid.appendChild(box);
  });
}

function openPlayer(ch){
  if(!ch.url) return;

  catWrap.style.display = "none";
  grid.style.display = "none";
  playerContainer.style.display = "flex";

  playerContainer.innerHTML = "";
  if(hls){ hls.destroy(); hls = null; }

  const video = document.createElement("video");
  video.autoplay = true;
  video.controls = false;
  video.setAttribute("playsinline","");
  playerContainer.appendChild(video);

  if(Hls.isSupported()){
    hls = new Hls({ maxBufferLength: 30 });
    hls.loadSource(ch.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, ()=> video.play());
  } else {
    video.src = ch.url;
    video.play();
  }

  // mobile always landscape
  if(isMobile()){
    screen.orientation?.lock("landscape").catch(()=>{});
  }

  // go fullscreen
  const req = video.requestFullscreen || video.webkitRequestFullscreen;
  req?.call(video).catch(()=>{});
}

function closePlayer(){
  if(hls){ hls.destroy(); hls = null; }
  playerContainer.style.display = "none";
  playerContainer.innerHTML = "";

  catWrap.style.display = "flex";
  grid.style.display = "grid";
}

window.addEventListener("keydown",e=>{
  if(e.key==="Escape" || e.key==="Backspace"){
    if(playerContainer.style.display==="flex"){
      closePlayer();
    }
  }
});

loadCategory(currentCategory);
</script>

</body>
</html>
