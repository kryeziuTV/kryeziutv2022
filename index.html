<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TV App UI</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
  body {
    background:#3f4451;
    font-family:'Rubik',sans-serif;
    color:#fff;
    margin:0;
    padding:40px;
    overflow:hidden;
  }

  /* when video is open: UI hidden, padding removed */
  body.player-active {
    padding:0 !important;
    overflow:hidden !important;
  }

  /* CATEGORIES */
  .categories { display:flex; gap:20px; margin-bottom:40px; }
  .cat-btn {
    background:#6246B8; padding:15px 28px;
    border-radius:12px; color:white; cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.45);
    transition:.15s; font-weight:500;
  }
  .cat-btn:hover, .cat-btn:focus {
    box-shadow:0 12px 30px rgba(0,0,0,.5);
    transform:translateY(-3px);
    outline:none;
  }

  /* CHANNEL GRID */
  .grid {
    display:grid;
    grid-template-columns:repeat(7,120px);
    gap:20px;
  }
  .channel {
    width:120px; height:120px; background:white;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.45);
    cursor:pointer;
  }
  .channel:hover, .channel:focus {
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(0,0,0,.55);
    outline:none;
  }
  .channel img { width:80%; height:80%; object-fit:contain; }

  /* FULLSCREEN VIDEO PLAYER */
  #playerContainer {
    position:fixed;
    inset:0;
    display:none;
    background:black;
    z-index:999999;
    align-items:center;
    justify-content:center;
  }

  /* forced 16:9 landscape fullscreen */
  #playerContainer video {
    width:100vw; 
    height:100vh;
    object-fit:cover;      /* Fills screen like TV */
    background:black;
  }

  /* channel info overlay */
  #channelInfo {
    position:fixed;
    top:30px;
    left:30px;
    z-index:1000000;
    color:white;
    font-size:28px;
    background:rgba(0,0,0,0.45);
    padding:12px 20px;
    border-radius:12px;
    display:none;
  }
</style>
</head>

<body>

<div class="categories" id="categories"></div>
<div class="grid" id="grid"></div>

<!-- FULLSCREEN PLAYER -->
<div id="playerContainer"></div>

<!-- CHANNEL NAME OVERLAY -->
<div id="channelInfo"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
/* ------------------------------
   DATA
------------------------------ */
const categories = ["LIVE TV","FILMA","SPORT","FEMIJE","DOKU"];

const channelsByCategory = {
  "LIVE TV": [
    { name:"TOP CHANNEL", logo:"https://vimg.ipko.tv/logo/color/topchanel.png", url:"https://cf.business-cdn.me/live/FrancescoFili/e76dc66304/1221574.m3u8" },
    { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png", url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
    { name:"RTK 3", logo:"http://vimg.ipko.tv/logo/color/rtk3.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },
    { name:"KTV", logo:"http://vimg.ipko.tv/logo/color/ktv.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/lj9-pxm-o53-rp0/tracks-v4a1/mono.ts.m3u8" }
  ],
  "FILMA": [
    { name:"Cinema 1", logo:"https://via.placeholder.com/120x120?text=C1", url:"" },
    { name:"Cinema 2", logo:"https://via.placeholder.com/120x120?text=C2", url:"" }
  ],
  "SPORT": [
    { name:"Sport+", logo:"https://via.placeholder.com/120x120?text=S+", url:"" }
  ],
  "FEMIJE": [
    { name:"Kids 1", logo:"https://via.placeholder.com/120x120?text=K1", url:"" }
  ],
  "DOKU": [
    { name:"Doku 1", logo:"https://via.placeholder.com/120x120?text=D1", url:"" }
  ]
};

/* ------------------------------
   DOM ELEMENTS
------------------------------ */
const categoriesEl = document.getElementById("categories");
const gridEl = document.getElementById("grid");
const playerContainer = document.getElementById("playerContainer");
const channelInfo = document.getElementById("channelInfo");

let hls = null;
let currentCategory = "LIVE TV";
let currentIndex = 0; // index inside category list
let video = null;

/* ------------------------------
   RENDER UI
------------------------------ */
categories.forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "cat-btn";
  btn.textContent = cat;
  btn.onclick = () => loadCategory(cat);
  categoriesEl.appendChild(btn);
});

function loadCategory(cat) {
  currentCategory = cat;
  currentIndex = 0;

  gridEl.innerHTML = "";
  channelsByCategory[cat].forEach((ch,idx)=>{
    const div = document.createElement("button");
    div.className = "channel";
    div.innerHTML = `<img src="${ch.logo}" alt="${ch.name}"/>`;
    div.onclick = () => openPlayer(idx);
    gridEl.appendChild(div);
  });
}

loadCategory(currentCategory);

/* ------------------------------
   PLAYER FUNCTIONS
------------------------------ */
function openPlayer(index){
  const channel = channelsByCategory[currentCategory][index];
  if(!channel) return;

  currentIndex = index;
  document.body.classList.add("player-active");

  playerContainer.style.display = "flex";
  channelInfo.style.display = "block";
  channelInfo.textContent = channel.name;

  playerContainer.innerHTML = "";
  video = document.createElement("video");
  video.autoplay = true;
  video.controls = false;
  video.setAttribute("playsinline","");
  playerContainer.appendChild(video);

  // HLS HANDLING
  if(Hls.isSupported()){
    hls = new Hls();
    hls.loadSource(channel.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, ()=> video.play());
  } else {
    video.src = channel.url;
    video.play();
  }

  // Enter fullscreen (Failsafe)
  try {
    const fs = playerContainer.requestFullscreen || playerContainer.webkitRequestFullscreen;
    if(fs) fs.call(playerContainer);
  } catch(e){}

  // Orientation lock
  try { screen.orientation.lock("landscape"); } catch(e){}
}

function closePlayer(){
  document.body.classList.remove("player-active");

  channelInfo.style.display="none";
  playerContainer.style.display="none";
  playerContainer.innerHTML="";

  if(hls){ hls.destroy(); hls = null; }

  // leave fullscreen
  if(document.fullscreenElement){
    try{ document.exitFullscreen(); }catch(e){}
  }
}

/* ------------------------------
   CHANGE CHANNELS WHILE PLAYING
------------------------------ */
function playNext(){
  const list = channelsByCategory[currentCategory];
  currentIndex = (currentIndex + 1) % list.length;
  openPlayer(currentIndex);
}
function playPrev(){
  const list = channelsByCategory[currentCategory];
  currentIndex = (currentIndex - 1 + list.length) % list.length;
  openPlayer(currentIndex);
}

/* ------------------------------
   KEY EVENTS
------------------------------ */
document.addEventListener("keydown", (e)=>{

  if(playerContainer.style.display==="flex"){
    if(e.key === "ArrowUp"){ playPrev(); }
    if(e.key === "ArrowDown"){ playNext(); }
    if(e.key === "Escape" || e.key === "Backspace"){ closePlayer(); }
  }

});
</script>
</body>
</html>
