<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TV App UI</title>
<style>
  body {
    background:#3f4451;
    font-family:'Rubik',sans-serif;
    color:#fff;
    margin:0;
    padding:40px;
  }
  .categories {
    display:flex;
    gap:20px;
    margin-bottom:40px;
  }
  .cat-btn {
    background:#6246B8;
    color:#fff;
    padding:15px 40px;
    border-radius:12px;
    font-weight:500;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.45);
    transition:.2s cubic-bezier(0,-0.5,0,3);
  }
  .cat-btn:hover {
    box-shadow:0 12px 40px rgba(0,0,0,.5);
    transform:translateY(-2px);
  }
  .cat-btn:active {
    transform:translateY(2px);
  }
  .grid {
    display:grid;
    grid-template-columns:repeat(7,120px);
    gap:20px;
  }
  .channel {
    width:120px;
    height:120px;
    background:#fff;
    border-radius:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    transition:.2s cubic-bezier(0,-0.5,0,3);
  }
  .channel:focus {
    outline:4px solid #6246B8;
  }
  .channel img {
    width:80%; height:80%; object-fit:contain;
  }
</style>
</head>
<body>
  <div class="categories" id="categories"></div>
  <div class="grid" id="grid"></div>

<script>
// Categories
const categories = [
  "LIVE TV", "FILMA", "SPORT", "FEMIJE", "DOKU"
];

// Channels
const channels = [
  { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png", url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
  { name:"RTK 3", logo:"http://vimg.ipko.tv/logo/color/rtk3.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },
  { name:"KTV", logo:"http://vimg.ipko.tv/logo/color/ktv.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/lj9-pxm-o53-rp0/tracks-v4a1/mono.ts.m3u8" }
];

// Render categories
const catWrap = document.getElementById("categories");
categories.forEach(c => {
  const btn = document.createElement("div");
  btn.className = "cat-btn";
  btn.textContent = c;
  catWrap.appendChild(btn);
});

// Render channels
theGrid = document.getElementById("grid");
channels.forEach((c,i)=>{
  const box=document.createElement("div");
  box.className="channel";
  box.tabIndex=0;
  box.innerHTML=`<img src="${c.logo}" />`;
  box.onclick=()=>{
    // open video stream
    window.location.href = c.url;
  };
  theGrid.appendChild(box);
});

// Remote navigation
let focusIndex = 0;
function focusItem(idx){
  const items = document.querySelectorAll('.channel');
  if(idx<0||idx>=items.length) return;
  items[focusIndex]?.blur();
  focusIndex = idx;
  items[focusIndex].focus();
}
focusItem(0);

document.addEventListener("keydown", e=>{
  const cols = 7;
  if(e.key === "ArrowRight") focusItem(focusIndex+1);
  if(e.key === "ArrowLeft") focusItem(focusIndex-1);
  if(e.key === "ArrowDown") focusItem(focusIndex+cols);
  if(e.key === "ArrowUp") focusItem(focusIndex-cols);
  if(e.key === "Enter") document.querySelectorAll('.channel')[focusIndex].click();
});
</script>
</body>
</html>
