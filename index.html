<meta name="apple-mobile-web-app-capable" content="yes">

<title>Live TV Player with Channel Navigation (Hls.js) - Optimized UX</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  /* --- Tema: Purple Accent Color --- */
  :root {
      --purple-accent: #A020F0; 
      --selection-bg: rgba(160, 32, 240, 0.3); 
      --solid-black: #000000;
      --white-accent: #FFFFFF; /* Ngjyra e re e kategorise */
  }
  
  /* --- Stilet Baze --- */
  html, body {
    margin: 0; padding: 0; 
    width: 100%; height: 100%; 
    background: var(--solid-black); 
    overflow: hidden;
    font-family: 'Poppins', Arial, sans-serif; 
  }
  #tvplayer {
    position: absolute; top: 0; left: 0;
    width: 100% !important; height: 100% !important;
  }
  #tvplayer video {
    width: 100% !important; height: 100% !important;
    background: var(--solid-black);
    object-fit: cover !important; 
  }
  
  /* --- Loading Overlay Stilet --- */
  #loadingOverlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--solid-black); 
    display: none; 
    flex-direction: column; justify-content: center; align-items: center;
    color: white; font-size: 1.2em; z-index: 50; 
  }
  #loadingOverlay.show { display: flex; }
  
  /* --- Loader/Spinner --- */
.loader {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: inline-block;
  border-top: 3px solid #A020F0;
  border-right: 3px solid transparent;
  box-sizing: border-box;
  animation: rotation 1s linear infinite;
}

@keyframes rotation {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
} 

@keyframes rotation {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}

  @keyframes rotation {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
  /* --- Fundi i ZEVENDESIMIT --- */


  /* --- Channel Info Overlay --- */
  #channelOverlay {
    position: absolute; bottom: 20px; left: 20px; top: auto; 
    display: flex; align-items: center; gap: 15px;
    background: rgba(0,0,0,0.7);
    border-radius: 8px; padding: 10px 15px;
    opacity: 0; transition: opacity 0.5s ease;
    pointer-events: none; max-width: 400px; z-index: 10;
  }
  #channelOverlay.show { opacity: 1; }
  #channelLogo { width: 55px; height: 55px; object-fit: contain; border-radius: 6px; }
  #channelName { color: white; font-size: 1.4em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* --- Channel Number Input Display --- */
  #channelInputDisplay {
    position: absolute; bottom: 20px; left: 20px; top: auto;
    color: var(--white-accent); font-size: 4em; font-weight: 500;
    background: rgba(0,0,0,0.3);
    padding: 10px 25px; border-radius: 10px;
    opacity: 0.4; transition: opacity 0.2s ease;
    pointer-events: none; z-index: 20;
  }
  #channelInputDisplay.show { opacity: 1; }
  
  /* --- Side Menu Styles (Optimizuar) --- */
  #sideMenu {
    position: absolute; top: 0; left: 0;
    height: 100%; width: 350px;
    background: rgba(0, 0, 0, 0.95);
    transform: translateX(-100%);
    transition: transform 0.2s ease-out; 
    z-index: 60; 
    padding-top: 10px; 
    overflow-y: auto;
    box-shadow: 4px 0 15px rgba(0, 0, 0, 0.7);
    display: flex; flex-direction: column;
  }
  #sideMenu.open { 
    transform: translateX(0); 
  }
  
  /* Stili i kategorive (NDRYSHUAR: Vija dhe teksti i bardhe) */
  .category-title {
      color: var(--white-accent); /* NGJYRA E RE: Bardhe */
      font-size: 1.1em;
      font-weight: 700;
      padding: 5px 20px 5px; 
      margin-top: 10px; 
      text-transform: uppercase;
      border-bottom: 2px solid var(--white-accent); /* NGJYRA E RE: Bardhe */
  }

  .menu-item {
    display: flex; align-items: center;
    padding: 8px 20px; 
    cursor: pointer;
    border-left: 6px solid transparent;
    transition: none; 
    color: #ccc;
    min-height: 55px; 
    font-weight: 400;
  }
  
  .menu-item.selected {
    background: var(--selection-bg); 
    color: white;
    border-left-color: var(--purple-accent); 
  }
  
  .menu-item:hover {
    background: rgba(255, 255, 255, 0.1); 
    color: white;
    border-left-color: var(--purple-accent); 
  }
  
  /* Stili i logos se menuse */
  .menu-logo {
    width: 38px; height: 38px; 
    object-fit: contain; margin-right: 15px;
    border-radius: 5px; 
    background: rgba(255, 255, 255, 0.1); 
  }

  /* Stili i numrit te kanalit */
  .menu-number {
    font-size: 1.1em; 
    color: var(--purple-accent); 
    margin-right: 15px;
    width: 35px; text-align: right;
    font-weight: 600;
  }
  .menu-item.selected .menu-number {
    color: white; 
  }
  .menu-name {
    font-size: 1.1em; 
    font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>

  const categoryStartIndices = {};
  let tempIndex = 0;
  for (const category in categorizedChannels) {
      categoryStartIndices[category] = tempIndex;
      tempIndex += categorizedChannels[category].length;
  }

  // --- Funksioni per Gjetjen e Kategorise nga Indeksi ---
  function findCategoryAndCategoryIndex(globalIndex) {
      let startIndex = 0;
      let prevCategory = null;
      for (const category in categorizedChannels) {
          const categoryLength = categorizedChannels[category].length;
          if (globalIndex >= startIndex && globalIndex < startIndex + categoryLength) {
              const categoryIndex = Object.keys(categorizedChannels).indexOf(category);
              return { 
                  categoryName: category,
                  categoryIndex: categoryIndex,
                  startIndex: startIndex 
              };
          }
          startIndex += categoryLength;
          prevCategory = category;
      }
      return { categoryName: null, categoryIndex: -1, startIndex: -1 };
  }

  // --- Funksionet Kryesore ---

  function showLoading(channelName) {
      loadingText.textContent = ` ${channelName}`;
      loadingOverlay.classList.add('show');
  }

  function hideLoading() {
      loadingOverlay.classList.remove('show');
  }

  function initializePlayer(url, channelName) {
    hideLoading(); 
    showLoading(channelName);
    
    if (hls) {
        hls.destroy(); 
    }

    if (Hls.isSupported()) {
      hls = new Hls();
      hls.attachMedia(videoPlayer);
      hls.on(Hls.Events.MEDIA_ATTACHED, function () {
        hls.loadSource(url);
      });
      
      hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
          videoPlayer.muted = false; 
          videoPlayer.play().then(() => {
              hideLoading(); 
          }).catch(error => {
              console.warn("Autoplay was prevented. Waiting for user interaction.", error);
              hideLoading();
              showOverlay({ name: "Shtyp OK per te vazhduar", logo: channels[currentChannelIndex].logo }); 
          });
      });

      hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
              hideLoading();
              console.error(`HLS Fatal Error: ${data.type} - ${data.details}`);
              loadingText.textContent = `Gabim: Nuk u ngarkua ${channelName}.`;
              loadingOverlay.classList.add('show');
              setTimeout(hideLoading, 5000);
          }
      });
      
    } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
      videoPlayer.src = url;
      videoPlayer.muted = false;
      videoPlayer.addEventListener('loadedmetadata', function() {
        videoPlayer.play().then(hideLoading).catch(e => {
            console.warn("Autoplay was prevented on native player. User must interact.", e);
            hideLoading();
            showOverlay({ name: "Shtyp OK per te vazhduar", logo: channels[currentChannelIndex].logo });
        });
      });
    } else {
        console.error("HLS is not supported in this browser.");
        hideLoading();
    }
  }

  function toggleMenu(force) {
    isMenuOpen = force !== undefined ? force : !isMenuOpen;
    sideMenu.classList.toggle('open', isMenuOpen);
    
    if (isMenuOpen) {
      menuSelectedIndex = currentChannelIndex;
      updateMenuSelection();
    } else {
      clearTimeout(channelNumberTimeout);
      channelNumberString = '';
      numberDisplay.classList.remove('show');
    }
  }

  function updateMenuSelection() {
    const items = sideMenu.querySelectorAll('.menu-item');
    items.forEach((item, index) => {
      item.classList.toggle('selected', index === menuSelectedIndex);
    });
    
    if (items[menuSelectedIndex]) {
      // NAVIGIM I SHPEJTE
      items[menuSelectedIndex].scrollIntoView({ block: 'center', behavior: 'auto' });
    }
  }

  function loadChannel(index) {
    if (index < 0) index = channels.length - 1;
    if (index >= channels.length) index = 0;
    
    // NUK RINGARKOHET KANALI I NJEJTE
    if (index === currentChannelIndex) {
        if (isMenuOpen || channelNumberString !== '') {
            toggleMenu(false); 
        }
        showOverlay(channels[currentChannelIndex]);
        return;
    }
    
    currentChannelIndex = index;
    localStorage.setItem(LAST_CHANNEL_KEY, currentChannelIndex.toString()); 

    initializePlayer(channels[currentChannelIndex].url, channels[currentChannelIndex].name);
    
    showOverlay(channels[currentChannelIndex]);

    menuSelectedIndex = currentChannelIndex;
    if (isMenuOpen) {
        updateMenuSelection();
    }
  }
  
  function showOverlay(channel) {
    // Kur kerkohet per te fshehur, fshijme gjithashtu numrin e kanalit
    if (channel === null) {
      overlay.classList.remove('show');
      numberDisplay.classList.remove('show');
      clearTimeout(overlay._timeout);
      return;
    }
    
    overlayLogo.src = channel.logo;
    overlayName.textContent = channel.name;
    overlay.classList.add('show');
    clearTimeout(overlay._timeout);
    overlay._timeout = setTimeout(() => {
      overlay.classList.remove('show');
    }, 3000);
  }

function handleNumberKey(digit) {
    // Fshihet menjeherë çdo shfaqje e vjetër
    clearTimeout(channelNumberTimeout);
    numberDisplay.classList.remove("show");

    // Fillojmë nga fillimi
    channelNumberString = digit;
    numberDisplay.textContent = channelNumberString;
    numberDisplay.classList.add("show");

    // Fshijmë overlay të kanalit kur shfaqet numri
    showOverlay(null);

    // Pas 1 sekonde ekzekutohet ndërrimi i kanalit
    channelNumberTimeout = setTimeout(() => {
        let channelNumber = parseInt(channelNumberString, 10);
        const targetIndex = channelNumber - 1;

        if (targetIndex >= 0 && targetIndex < channels.length) {
            loadChannel(targetIndex);
        } else {
            numberDisplay.textContent = ``;
        }

        // Fshihet menjëherë pas nisjes së ndërrimit
        numberDisplay.classList.remove("show");
        channelNumberString = '';

    }, CHANNEL_INPUT_DELAY);
}

  // --- Inicializimi i Menuse dhe Logices ---

  function initializeMenu() {
    sideMenu.innerHTML = ''; 

    let globalChannelIndex = 0; 

    for (const category in categorizedChannels) {
      const title = document.createElement('div');
      title.classList.add('category-title');
      title.textContent = category;
      sideMenu.appendChild(title);

      categorizedChannels[category].forEach((channel) => {
        const item = document.createElement('div');
        item.classList.add('menu-item');
        item.setAttribute('data-index', globalChannelIndex);
        
        item.innerHTML = `
          <span class="menu-number">${globalChannelIndex + 1}</span>
          <img class="menu-logo" src="${channel.logo}" alt="${channel.name} Logo" onerror="this.style.opacity='0.5';"/>
          <span class="menu-name">${channel.name}</span>
        `;
        
        item.addEventListener('click', () => {
          const clickedIndex = parseInt(item.getAttribute('data-index'), 10);
          loadChannel(clickedIndex); 
          toggleMenu(false); 
        });
        
        sideMenu.appendChild(item);
        globalChannelIndex++;
      });
    }
  }
  
  function getStartingChannelIndex() {
      const storedIndex = localStorage.getItem(LAST_CHANNEL_KEY);
      const index = parseInt(storedIndex, 10);
      
      if (!isNaN(index) && index >= 0 && index < channels.length) {
          return index;
      }
      return 0; 
  }
  
  function enterFullscreen() {
    const el = document.documentElement; 
    
    if (el.requestFullscreen) {
      el.requestFullscreen();
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    } else if (el.msRequestFullscreen) {
      el.msRequestFullscreen();
    }
    
    if (document.body.requestFullscreen) {
         document.body.requestFullscreen({ navigationUI: "hide" }).catch(err => console.log("Fullscreen request failed:", err));
    }
  }


  // --- Event Listeners dhe Inicializimi ---
  let fullscreenAttempted = false;

  currentChannelIndex = getStartingChannelIndex();
  initializeMenu();

  // LOGJIKA E RE E NGARKIMIT: Shfaq vetem overlay-n dhe prit nderveprimin
  if (currentChannelIndex >= 0) {
      // Shfaq overlay-n e kanalit te fundit
      showOverlay(channels[currentChannelIndex]); 
      
      // Inicializo player-in, por vetem per te pare nese Autoplay deshton
      currentChannelIndex = getStartingChannelIndex();
      initializePlayer(channels[currentChannelIndex].url, channels[currentChannelIndex].name);

      // Shto event listener per te luajtur videon pas nderveprimit
      document.body.addEventListener('click', attemptPlayAndFullscreen);
      window.addEventListener('keydown', attemptPlayAndFullscreen);
      document.body.addEventListener('touchstart', attemptPlayAndFullscreen);

  } 
  
  function attemptPlayAndFullscreen() {
      // Heqim listeners
      document.body.removeEventListener('click', attemptPlayAndFullscreen);
      window.removeEventListener('keydown', attemptPlayAndFullscreen);
      document.body.removeEventListener('touchstart', attemptPlayAndFullscreen);

      // Kjo kerkohet si nderveprimi i pare.
      videoPlayer.play().then(() => {
        showOverlay(channels[currentChannelIndex]); // Fshijme ndoshta overlay-n "Shtyp OK per te vazhduar"
      }).catch(e => {
        console.warn("Play failed even after user interaction (might be a specific browser policy).");
      });

      if (!fullscreenAttempted) {
          enterFullscreen();
          fullscreenAttempted = true;
      }
  }

  // Event listeners for Fullscreen (nese nderveprimi i pare nuk ishte klik/play)
  document.body.addEventListener('touchstart', attemptFullscreen);
  window.addEventListener('keydown', attemptFullscreen);

  function attemptFullscreen() {
    if (!fullscreenAttempted) {
        enterFullscreen();
        fullscreenAttempted = true;
        document.body.removeEventListener('touchstart', attemptFullscreen);
        window.removeEventListener('keydown', attemptFullscreen);
    }
  }

  window.addEventListener('keydown', (e) => {
    
    if (e.repeat) return;
    
    const isNavigationKey = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' ', 'Ok', 'Escape'].includes(e.key);

    if (isNavigationKey || (e.key >= '0' && e.key <= '9')) {
        e.preventDefault(); 
    }

    if (isMenuOpen) {
        // Navigimi me Menu
        if (e.key === 'ArrowUp') {
          menuSelectedIndex = (menuSelectedIndex - 1 + channels.length) % channels.length;
          updateMenuSelection();
        } else if (e.key === 'ArrowDown') {
          menuSelectedIndex = (menuSelectedIndex + 1) % channels.length;
          updateMenuSelection();
        } 
        else if (e.key === 'ArrowLeft') {
            // NDRYSHIMI KRYESOR 1: Shko tek kategoria paraprake
            const currentInfo = findCategoryAndCategoryIndex(menuSelectedIndex);
            const categoryKeys = Object.keys(categorizedChannels);
            
            if (currentInfo.categoryIndex > 0) {
                const prevCategoryKey = categoryKeys[currentInfo.categoryIndex - 1];
                menuSelectedIndex = categoryStartIndices[prevCategoryKey];
            } else {
                // Nese jemi te kategoria e pare, shko tek kategoria e fundit
                const lastCategoryKey = categoryKeys[categoryKeys.length - 1];
                menuSelectedIndex = categoryStartIndices[lastCategoryKey];
            }
            updateMenuSelection();
        }
        else if (e.key === 'ArrowRight') {
            // NDRYSHIMI KRYESOR 2: Shko tek kategoria pasardhese
            const currentInfo = findCategoryAndCategoryIndex(menuSelectedIndex);
            const categoryKeys = Object.keys(categorizedChannels);

            if (currentInfo.categoryIndex < categoryKeys.length - 1) {
                const nextCategoryKey = categoryKeys[currentInfo.categoryIndex + 1];
                menuSelectedIndex = categoryStartIndices[nextCategoryKey];
            } else {
                // Nese jemi te kategoria e fundit, shko tek kategoria e pare
                const firstCategoryKey = categoryKeys[0];
                menuSelectedIndex = categoryStartIndices[firstCategoryKey];
            }
            updateMenuSelection();
        }
        else if (e.key === 'Enter' || e.key === ' ' || e.key === 'Ok') {
            loadChannel(menuSelectedIndex); 
            toggleMenu(false); 
        } else if (e.key === 'Escape') {
            toggleMenu(false);
        }

    } else {
        // Navigimi me Player
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Ok') {
          toggleMenu(true);
        }
        else if (e.key === 'ArrowUp') {
          loadChannel(currentChannelIndex - 1);
        } else if (e.key === 'ArrowDown') {
          loadChannel(currentChannelIndex + 1);
        }
        else if (e.key >= '0' && e.key <= '9') {
          handleNumberKey(e.key);
        }
    }
  });

  // --- Swipe Gesture Detection ---
  let touchstartX = 0;
  let touchendX = 0;
  
  function checkDirection() {
    const swipeDistance = touchendX - touchstartX;
    
    if (Math.abs(swipeDistance) < 50) return;

    if (swipeDistance > 0 && touchstartX < 50 && !isMenuOpen) {
      toggleMenu(true);
    } else if (swipeDistance < 0 && isMenuOpen) {
      toggleMenu(false);
    }
  }
  
  window.addEventListener('touchstart', e => {
    touchstartX = e.changedTouches[0].screenX;
  });
  
  window.addEventListener('touchend', e => {
    touchendX = e.changedTouches[0].screenX;
    checkDirection();
  });

</script>
