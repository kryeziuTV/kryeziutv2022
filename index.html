<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TV App UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    background:#3f4451;
    font-family:'Rubik', sans-serif;
    color:#fff;
    margin:0;
    padding:40px;
  }

  .categories {
    display:flex;
    gap:20px;
    margin-bottom:40px;
  }

  .cat-btn {
    background:#6246B8;
    color:#fff;
    padding:15px 28px;
    border-radius:12px;
    font-weight:500;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.45);
    transition:.2s cubic-bezier(0,-0.5,0,3);
  }

  .cat-btn:hover,
  .cat-btn:focus {
    transform:translateY(-2px);
    box-shadow:0 12px 40px rgba(0,0,0,.5);
    outline:none;
  }

  .grid {
    display:grid;
    grid-template-columns:repeat(7,120px);
    gap:20px;
  }

  .channel {
    width:120px;
    height:120px;
    background:#fff;
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
    transition:.2s cubic-bezier(0,-0.5,0,3);
  }

  .channel:hover,
  .channel:focus {
    transform:translateY(-2px);
    box-shadow:0 12px 40px rgba(0,0,0,.55);
    outline:none;
  }

  .channel img {
    width:80%;
    height:80%;
    object-fit:contain;
  }

  /* ------------------------- */
  /* FULLSCREEN VIDEO PLAYER   */
  /* ------------------------- */
  #playerContainer {
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    background:black;
    display:none;
    z-index:999999;
    align-items:center;
    justify-content:center;
  }

  #playerContainer video {
    width:100vw;
    height:100vh;
    object-fit:fill; /* FULL screen NO black bars */
    background:black;
  }
</style>
</head>

<body>
  <div class="categories" id="categories"></div>
  <div class="grid" id="grid"></div>

  <div id="playerContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>

// Categories + channel list
const categories = ["LIVE TV","FILMA","SPORT","FEMIJE","DOKU"];
const channelsByCategory = {
  "LIVE TV": [
    { name:"RTK 1*", logo:"https://vimg.ipko.tv/logo/color/rtk1.png", 
      url:"https://viamotionhsi.netplus.ch/live/eds/rtk1/browser-HLS8/rtk1.m3u8" },

    { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png",
      url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },

    { name:"RTK 3", logo:"http://vimg.ipko.tv/logo/color/rtk3.png",
      url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },

    { name:"KTV", logo:"http://vimg.ipko.tv/logo/color/ktv.png",
      url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/lj9-pxm-o53-rp0/tracks-v4a1/mono.ts.m3u8" }
  ],

  "FILMA": [
    { name:"Cinema 1", logo:"https://via.placeholder.com/120x120?text=C1", url:"" },
    { name:"Cinema 2", logo:"https://via.placeholder.com/120x120?text=C2", url:"" },
    { name:"Cinema 3", logo:"https://via.placeholder.com/120x120?text=C3", url:"" }
  ],

  "SPORT": [
    { name:"Sport+", logo:"https://via.placeholder.com/120x120?text=S+", url:"" },
    { name:"Arena", logo:"https://via.placeholder.com/120x120?text=A", url:"" }
  ],

  "FEMIJE": [
    { name:"Kids 1", logo:"https://via.placeholder.com/120x120?text=K1", url:"" },
    { name:"Kids 2", logo:"https://via.placeholder.com/120x120?text=K2", url:"" }
  ],

  "DOKU": [
    { name:"Doku 1", logo:"https://via.placeholder.com/120x120?text=D1", url:"" },
    { name:"Doku 2", logo:"https://via.placeholder.com/120x120?text=D2", url:"" }
  ]
};

const categoriesWrap = document.getElementById("categories");
const grid = document.getElementById("grid");
const playerContainer = document.getElementById("playerContainer");
let currentCategory = "LIVE TV";
let hls = null;

/* --------------------
   RENDER CATEGORIES
-------------------- */
categories.forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "cat-btn";
  btn.textContent = cat;
  btn.onclick = () => loadCategory(cat);
  categoriesWrap.appendChild(btn);
});

/* --------------------
   LOAD CHANNEL GRID
-------------------- */
function loadCategory(cat) {
  currentCategory = cat;
  grid.innerHTML = "";

  channelsByCategory[cat].forEach(ch => {
    const box = document.createElement("button");
    box.className = "channel";
    box.innerHTML = `<img src="${ch.logo}" alt="${ch.name}" />`;
    box.onclick = () => openPlayerForChannel(ch);
    grid.appendChild(box);
  });
}

loadCategory(currentCategory);

/* -------------------------
   OPEN FULLSCREEN PLAYER
-------------------------- */
function openPlayerForChannel(ch) {
  const url = ch.url;
  if (!url) return;

  // hide UI
  playerContainer.style.display = "flex";
  playerContainer.innerHTML = "";

  // cleanup previous stream
  if (hls) {
    try { hls.destroy(); } catch(e){}
    hls = null;
  }

  // create video element
  const video = document.createElement("video");
  video.autoplay = true;
  video.controls = false;
  video.muted = false;
  video.setAttribute("playsinline", "");

  playerContainer.appendChild(video);

  // hls support
  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
  } else {
    video.src = url;
    video.play().catch(()=>{});
  }

  // FULLSCREEN THE ENTIRE PLAYER CONTAINER
  const fs = playerContainer.requestFullscreen
           || playerContainer.webkitRequestFullscreen
           || playerContainer.msRequestFullscreen;

  if (fs) fs.call(playerContainer);
}

/* ------------------------------
   EXIT PLAYER (Back / Escape)
------------------------------ */
window.addEventListener("keydown", e => {
  if ((e.key === "Escape" || e.key === "Backspace") &&
      playerContainer.style.display === "flex") {
    closePlayer();
  }
});

window.addEventListener("popstate", () => {
  if (playerContainer.style.display === "flex") {
    closePlayer();
  }
});

function closePlayer() {
  if (hls) {
    try { hls.destroy(); } catch(e){}
    hls = null;
  }
  playerContainer.style.display = "none";
  playerContainer.innerHTML = "";
}

</script>
</body>
</html>
