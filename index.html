<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TV App UI - Përditësuar</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  /* STILIMET KRYESORE */
  body { 
    background:#3f4451; 
    font-family:'Rubik',sans-serif; 
    color:#fff; 
    margin:0; 
  }

  /* KONTEJNERI KRYESOR PËR QENDRËZIM */
  #mainContent {
    display: flex;
    flex-direction: column;
    align-items: center; /* Qendërzon kategoritë dhe grid-in horizontalisht */
    padding: 40px; 
  }

  /* 2. POZICIONIMI I KATEGORIVE (Qendër-Lart) */
  .categories { 
    display:flex; 
    gap:20px; 
    margin-bottom:40px; 
    justify-content: center; /* Qendërzon butonat brenda rreshtit */
    width: 100%; 
  }

  /* STILI I FOKUSIT (GLOW/BORDER) PËR KATEGORITË */
  .cat-btn { 
    background:#6246B8; 
    color:#fff; 
    padding:15px 28px; 
    border-radius:12px; 
    font-weight:500; 
    cursor:pointer; 
    box-shadow:0 6px 20px rgba(0,0,0,.45); 
    transition:.2s cubic-bezier(0,-0.5,0,3); 
    border: 3px solid transparent; 
  }
  .cat-btn:focus, .cat-btn.focused { 
    box-shadow:0 0 10px 5px rgba(255, 255, 255, 0.8), 0 12px 40px rgba(0,0,0,.5); /* Glow i bardhë */
    transform:scale(1.05); 
    outline:none; 
    border: 3px solid white; 
  }
  .cat-btn:active { transform:scale(0.98); } 

  /* 3. POZICIONIMI I KANALEVE (Qendër) */
  .grid { 
    display:grid; 
    grid-template-columns:repeat(7,120px); 
    gap:20px; 
  }

  /* STILI I FOKUSIT (GLOW/BORDER) PËR KANALET */
  .channel { 
    width:120px; 
    height:120px; 
    background:#fff; 
    border-radius:14px; 
    box-shadow:0 6px 20px rgba(0,0,0,.5); 
    display:flex; 
    justify-content:center; 
    align-items:center; 
    cursor:pointer; 
    transition:.2s cubic-bezier(0,-0.5,0,3); 
    border: 3px solid transparent; 
  }
  .channel:focus, .channel.focused { 
    transform:scale(1.05); 
    box-shadow:0 0 10px 5px rgba(255, 255, 255, 0.8), 0 12px 40px rgba(0,0,0,.55); /* Glow i bardhë */
    outline:none; 
    border: 3px solid white; 
  }
  .channel:active { transform:scale(0.98); }

  /* PLAYER CONTAINER */
  #playerContainer { 
    position:fixed; 
    inset:0; 
    background:#000; 
    display:none; 
    z-index:99999; 
    align-items:center; 
    justify-content:center; 
  }
  #playerContainer video { 
    width:100vw; 
    height:100vh; 
    object-fit:contain; 
    outline:none; 
    border:0; 
    pointer-events:none; 
  } 

  /* MENUJA ANËSORE (Glassmorphism) */
  #channelMenu {
    position: absolute;
    top: 0;
    left: 0;
    height: 100vh;
    width: 250px; 
    padding: 20px 0;
    background: rgba(173, 216, 230, 0.1); 
    backdrop-filter: blur(10px); 
    border-right: 1px solid rgba(255, 255, 255, 0.1); 
    overflow-y: auto;
    display: none; 
    z-index: 100000;
  } 

  .menu-channel-item {
    padding: 15px 20px;
    color: #fff; /* NDRYSHIM: U kthye në të bardhë për lexim më të mirë në menunë transparente */
    font-size: 1.1em; /* Për ta bërë tekstin më të madh */
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.1s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  } 

  .menu-channel-item.focused {
    background-color: rgba(65, 105, 225, 0.7); 
    color: #fff;
    transform: scale(1.03);
  } 

  .menu-channel-item:focus {
    outline: none; 
  }
</style>
</head>
<body>
  <div id="mainContent">
    <div class="categories" id="categories" role="toolbar" aria-label="Categories"></div>
    <div class="grid" id="grid" role="grid"></div> 
  </div>

  <div id="playerContainer">
    </div> 

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
// --- data ---
const categories = ["LIVE TV","FILMA","SPORT","FEMIJE","DOKU"];
const channelsByCategory = {

    { name:"VIZION PLUS", logo:"https://vimg.ipko.tv/logo/color/vizionplus.png", url:"http://tringliveviz.akamaized.net/delta/105/out/u/qwaszxerdfcvrtryuy.m3u8" },
    { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png", url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
    { name:"RTK 3", logo:"http://vimg.ipko.tv/logo/color/rtk3.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },
    { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png", url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
    { name:"RTK 3", logo:"http://vimg.ipko.tv/logo/color/rtk3.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },
    { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png", url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
    { name:"RTK 3", logo:"http://vimg.ipko.tv/logo/color/rtk3.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },
    { name:"KTV", logo:"http://vimg.ipko.tv/logo/color/ktv.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/lj9-pxm-o53-rp0/tracks-v4a1/mono.ts.m3u8" }
  ],
  "FILMA": [

    { name:"Cinema 2", logo:"https://via.placeholder.com/120x120?text=C2", url:"" },
    { name:"Cinema 3", logo:"https://via.placeholder.com/120x120?text=C2", url:"" },
    { name:"Cinema 4", logo:"https://via.placeholder.com/120x120?text=C3", url:"" } 
],
  "SPORT": [ 
    { name:"Sport 1", logo:"https://via.placeholder.com/120x120?text=S+", url:"" },
    { name:"Sport 2", logo:"https://via.placeholder.com/120x120?text=S+", url:"" },
    { name:"Sport 3", logo:"https://via.placeholder.com/120x120?text=S+", url:"" },
    { name:"Sport 4", logo:"https://via.placeholder.com/120x120?text=A", url:"" } 
],
  "FEMIJE": [ 
    { name:"DISNEY JUNIOR", logo:"https://via.placeholder.com/120x120?text=K1", url:"https://fl1.moveonjoy.com/DISNEY_JR/index.m3u8" }, 
    { name:"AVATAR", logo:"https://via.placeholder.com/120x120?text=K1", url:"http://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/60b4c17a81e29300071d3a39/master.m3u8?appName=web&appVersion=unknown&clientTime=0&deviceDNT=0&deviceId=8e05edb7-1f2c-11ef-86d8-5d587df108c6&deviceMake=Chrome&deviceModel=web&deviceType=web&deviceVersion=unknown&includeExtendedEvents=false&serverSideAds=false&sid=640a4092-5016-4d01-bcbf-d66e4f7aa21d" }, 
    { name:"ONE PIECE", logo:"https://via.placeholder.com/120x120?text=K1", url:"http://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/6380c94947c72b0007ee9a13/master.m3u8?appName=web&appVersion=unknown&clientTime=0&deviceDNT=0&deviceId=8e06d815-1f2c-11ef-86d8-5d587df108c6&deviceMake=Chrome&deviceModel=web&deviceType=web&deviceVersion=unknown&includeExtendedEvents=false&serverSideAds=false&sid=011422f0-e50a-4334-9bb5-b01fe7684ef5" }, 
    { name:"NARUTO", logo:"https://via.placeholder.com/120x120?text=K2", url:"http://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/65d5fc39a25d5e00082895c4/master.m3u8?appName=web&appVersion=unknown&clientTime=0&deviceDNT=0&deviceId=1b1f1164-4b81-11ef-a8ac-e146e4e7be02&deviceMake=Chrome&deviceModel=web&deviceType=web&deviceVersion=unknown&includeExtendedEvents=false&serverSideAds=false&sid=91b30c33-90e6-47e3-95e6-a297bd00e5df" } 
],
  "DOKU": [ 
    { name:"NAT GEO", logo:"https://via.placeholder.com/120x120?text=D1", url:"https://fl1.moveonjoy.com/National_Geographic/index.m3u8" }, 
    { name:"NAT GEO WILD", logo:"https://via.placeholder.com/120x120?text=D1", url:"https://fl1.moveonjoy.com/Nat_Geo_Wild/index.m3u8" }, 
    { name:"HISTORY", logo:"https://via.placeholder.com/120x120?text=D1", url:"https://fl1.moveonjoy.com/history_channel/index.m3u8" }, 
    { name:"CARS TV", logo:"https://via.placeholder.com/120x120?text=D2", url:"http://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/5c12ba66eae03059cbdc77f2/master.m3u8?appName=web&appVersion=unknown&clientTime=0&deviceDNT=0&deviceId=6c2ac636-30d3-11ef-9cf5-e9ddff8ff496&deviceMake=Chrome&deviceModel=web&deviceType=web&deviceVersion=unknown&includeExtendedEvents=false&serverSideAds=false&sid=2f9bce8e-d9f8-4cf4-8b83-367dc559496a" } ]
}; 

// --- DOM refs ---
const catWrap = document.getElementById('categories');
const grid = document.getElementById('grid');
const playerContainer = document.getElementById('playerContainer');
let hls = null;
let currentCategory = 'LIVE TV'; 

// --- focus/navigation state ---
let focusedArea = 'cats'; // 'cats' or 'grid'
let catFocus = 0;
let gridFocus = 0;
const GRID_COLS = 7; 

// NDIHMËS PËR MENY & NAVIGIM
let isMenuVisible = false;
let menuFocusIndex = 0;
let currentChannelIndex = 0; // NDRYSHIM: Ruajmë indeksin e kanalit aktual
const allChannelsList = channelsByCategory["LIVE TV"]; 

// --- render UI ---
categories.forEach((cat,ci)=>{
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.textContent = cat;
  btn.setAttribute('data-cat',cat);
  btn.tabIndex = 0;
  btn.onclick = ()=> loadCategory(cat);
  btn.onfocus = ()=> { focusedArea = 'cats'; catFocus = ci; } // fokusimi ruhet për saktësi
  catWrap.appendChild(btn);
}); 

// render channels for a category
function loadCategory(cat){
  currentCategory = cat;
  grid.innerHTML = '';
  const list = channelsByCategory[cat] || [];
  list.forEach((ch,idx)=>{
    const box = document.createElement('button');
    box.className = 'channel';
    box.tabIndex = 0;
    box.setAttribute('data-idx', idx);
    box.innerHTML = `<img src="${ch.logo}" alt="${ch.name}" />`;
    box.onclick = ()=> openPlayerForChannel(ch);
    box.onfocus = ()=> { focusedArea = 'grid'; gridFocus = idx; } // fokusimi ruhet për saktësi
    grid.appendChild(box);
  });
  
  catFocus = categories.indexOf(cat) >= 0 ? categories.indexOf(cat) : 0;
  gridFocus = 0;
  focusedArea = 'cats';
  focusCurrent();
} 

function focusCurrent(){
  // Heq fokusin e vjetër (klasën 'focused' për efekt vizual)
  catWrap.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('focused'));
  grid.querySelectorAll('.channel').forEach(item => item.classList.remove('focused'));
  
  if(focusedArea === 'cats'){
    const cats = catWrap.querySelectorAll('.cat-btn');
    if (cats[catFocus]) {
        cats[catFocus].classList.add('focused');
        cats[catFocus].focus(); // Për saktësi keyboard-i
    }
  } else {
    const items = grid.querySelectorAll('.channel');
    if (items[gridFocus]) {
        items[gridFocus].classList.add('focused');
        items[gridFocus].focus(); // Për saktësi keyboard-i
    }
  }
} 

// --- player menu logic ---
function toggleChannelMenu(){
    const channelMenu = document.getElementById('channelMenu');
    if (!channelMenu) return; 

    isMenuVisible = !isMenuVisible;
    channelMenu.style.display = isMenuVisible ? 'block' : 'none';
    
    if (isMenuVisible) {
        const items = channelMenu.querySelectorAll('.menu-channel-item');
        if(items.length > 0) {
            items.forEach(i => i.classList.remove('focused')); 
            menuFocusIndex = Math.min(Math.max(0, menuFocusIndex), items.length - 1);
            items[menuFocusIndex].classList.add('focused');
            items[menuFocusIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }
} 

function switchChannel(ch){
    if(!ch.url) return;
    
    // 1. Mbyll menynë
    if (isMenuVisible) {
        toggleChannelMenu(); 
    }
    
    // 2. Ndërro kanalin
    openPlayerForChannel(ch, true);
}


// handle remote arrows / enter
document.addEventListener('keydown', (e)=>{
  
  if(playerContainer.style.display === 'flex'){
    const channelMenu = document.getElementById('channelMenu');
    // Duhet të kontrolloni për ekzistencën e menysë, pasi ajo rindërtohet
    const menuItems = channelMenu ? channelMenu.querySelectorAll('.menu-channel-item') : [];
    const maxIndex = allChannelsList.length - 1; 

    // KONTROLLA E MENYSË (Kur menuja është hapur)
    if(isMenuVisible){
        if(e.key === 'ArrowUp'){
            menuItems[menuFocusIndex]?.classList.remove('focused');
            menuFocusIndex = Math.max(0, menuFocusIndex - 1);
            menuItems[menuFocusIndex]?.classList.add('focused');
            menuItems[menuFocusIndex]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else if(e.key === 'ArrowDown'){
            menuItems[menuFocusIndex]?.classList.remove('focused');
            menuFocusIndex = Math.min(maxIndex, menuFocusIndex + 1);
            menuItems[menuFocusIndex]?.classList.add('focused');
            menuItems[menuFocusIndex]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else if(e.key === 'Enter'){
            const channel = allChannelsList[menuFocusIndex];
            switchChannel(channel);
        }
        return; 
    }

    // NAVIGIMI I SHPEJTË ME UP/DOWN (Kur menuja është mbyllur)
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        let newIndex = currentChannelIndex;
        
        if (e.key === 'ArrowUp') {
            newIndex = currentChannelIndex > 0 ? currentChannelIndex - 1 : maxIndex;
        } else if (e.key === 'ArrowDown') {
            newIndex = currentChannelIndex < maxIndex ? currentChannelIndex + 1 : 0;
        }
        
        const nextChannel = allChannelsList[newIndex];
        currentChannelIndex = newIndex; 
        openPlayerForChannel(nextChannel, true); 
        return;
    }


    // OK/ENTER: HAP MENUNË E KANALIT
    if(e.key === 'Enter'){
        toggleChannelMenu();
    } 

    // BACKSPACE/ESCAPE: Mbyll player-in
    if(e.key === 'Backspace' || e.key === 'Escape'){ 
        closePlayer(); 
        history.back(); 
    }
    
    return; 
  } 

  // KONTROLLAT E NAVIGIMIT TË UI-SË (mbeten të njëjta)
  if(e.key === 'ArrowRight'){
    if(focusedArea === 'cats') { catFocus = Math.min(catFocus + 1, categories.length - 1); }
    else { gridFocus = gridFocus + 1; }
  }
  if(e.key === 'ArrowLeft'){
    if(focusedArea === 'cats') { catFocus = Math.max(catFocus - 1, 0); }
    else { gridFocus = Math.max(gridFocus - 1, 0); }
  }
  if(e.key === 'ArrowDown'){
    if(focusedArea === 'cats'){
      focusedArea = 'grid';
      gridFocus = catFocus; 
    } else {
      gridFocus = gridFocus + GRID_COLS;
    }
  }
  if(e.key === 'ArrowUp'){
    if(focusedArea === 'grid'){
      if(gridFocus < GRID_COLS){ 
        focusedArea = 'cats';
        catFocus = Math.min(gridFocus, categories.length - 1);
      } else {
        gridFocus = gridFocus - GRID_COLS;
      }
    }
  } 

  const gridItems = grid.querySelectorAll('.channel');
  if(gridFocus >= gridItems.length) gridFocus = gridItems.length - 1;
  if(gridFocus < 0) gridFocus = 0; 

  if(e.key === 'Enter'){
    if(focusedArea === 'cats'){ loadCategory(categories[catFocus]); }
    else { grid.querySelectorAll('.channel')[gridFocus]?.click(); }
  } 

  focusCurrent();
}); 

// --- player helpers (hls.js fallback) ---
function openPlayerForChannel(ch, isSwitching = false){
  const url = ch.url;
  if(!url) return;
  
  // Gjej indeksin e kanalit aktual
  const newIndex = allChannelsList.findIndex(channel => channel.url === url);
  if (newIndex !== -1) {
      currentChannelIndex = newIndex;
      menuFocusIndex = newIndex; 
  }

  if (!isSwitching) {
      document.body.style.padding = '0';
      document.body.style.overflow = 'hidden';
      // Fsheh Konteinerin Kryesor
      document.getElementById('mainContent').style.display = 'none'; 
      history.pushState({player:true}, 'player');
      playerContainer.style.display = 'flex';
  }
  
  // clear previous hls
  if(hls){ try{ hls.destroy(); }catch(e){} hls = null; } 

  let video = document.getElementById('tvplayer');
  // Duhet të rindërtojmë playerin dhe menunë, pasi `playerContainer.innerHTML = ''` fshin gjithçka
  if (!video || isSwitching) {
      playerContainer.innerHTML = ''; 
      const menu = document.createElement('div');
      menu.id = 'channelMenu';
      playerContainer.appendChild(menu);
      
      video = document.createElement('video');
      video.id = 'tvplayer';
      video.autoplay = true;
      video.controls = false; 
      video.muted = false;
      video.setAttribute('playsinline','');
      video.style.pointerEvents = 'none';
      playerContainer.appendChild(video);
      
      if (!isSwitching) updateOrientationClass(); 
  }
  
  // POPULLO DHE FSHEH MENYNË ANËSORE
  const channelMenu = document.getElementById('channelMenu');
  channelMenu.innerHTML = ''; 
  allChannelsList.forEach((channelData, index) => {
    const item = document.createElement('div');
    item.className = 'menu-channel-item';
    item.textContent = channelData.name;
    item.setAttribute('data-url', channelData.url);
    item.setAttribute('data-index', index);
    item.tabIndex = 0; 
    
    if (channelData.url === url) {
        item.classList.add('focused');
    }
    
    item.onclick = () => switchChannel(channelData); 
    channelMenu.appendChild(item);
  });
  isMenuVisible = false;
  channelMenu.style.display = 'none';


  // Luaj me hls.js
  if(Hls && Hls.isSupported()){
    hls = new Hls({ maxBufferLength: 30 });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ video.play().catch(()=>{}); });
  } else {
    video.src = url;
    video.play().catch(()=>{});
  } 

  // try to lock orientation to landscape on supported devices
  try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape'); }catch(e){} 

  // request fullscreen where available
  const req = video.requestFullscreen || video.webkitRequestFullscreen || video.msRequestFullscreen;
  try{ req && req.call(video).catch(()=>{}); }catch(e){}
} 

function closePlayer(){
  // Rishfaq elementet kryesore të UI
  document.body.style.padding = '40px';
  document.body.style.overflow = 'auto'; 
  document.getElementById('mainContent').style.display = 'flex'; // Shfaq Konteinerin Kryesor
  isMenuVisible = false; 

  // stop hls and remove video
  if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
  playerContainer.style.display = 'none';
  playerContainer.innerHTML = '';
  // unlock orientation if possible
  try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
  
  focusCurrent();
} 

// handle history/back
window.addEventListener('popstate', (e)=>{
  if(playerContainer.style.display === 'flex'){
    closePlayer();
  }
}); 

// also map Escape/Backspace to close
window.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' || e.key === 'Backspace'){
    if(playerContainer.style.display === 'flex' && !isMenuVisible){
      history.back(); // triggers popstate -> closePlayer
    }
  }
}); 

// auto-orientation helper for phones
function updateOrientationClass(){
  const w = window.innerWidth, h = window.innerHeight;
  if(w>h) { playerContainer.classList.add('video-landscape'); playerContainer.classList.remove('video-portrait'); }
  else { playerContainer.classList.add('video-portrait'); playerContainer.classList.remove('video-landscape'); }
}
window.addEventListener('resize', updateOrientationClass);
window.addEventListener('orientationchange', updateOrientationClass); 

// initial load
loadCategory(currentCategory); 

</script>
</body>
</html>
