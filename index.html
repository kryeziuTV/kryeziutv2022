<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TV App UI</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body { background:#3f4451; font-family:'Rubik',sans-serif; color:#fff; margin:0; padding:40px; }
  .categories { display:flex; gap:20px; margin-bottom:40px; }
  .cat-btn { background:#6246B8; color:#fff; padding:15px 28px; border-radius:12px; font-weight:500; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.45); transition:.2s cubic-bezier(0,-0.5,0,3); }
  .cat-btn:focus, .cat-btn:hover { box-shadow:0 12px 40px rgba(0,0,0,.5); transform:translateY(-2px); outline:none; }
  .cat-btn:active { transform:translateY(2px); }

  .grid { display:grid; grid-template-columns:repeat(7,120px); gap:20px; }
  .channel { width:120px; height:120px; background:#fff; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,.5); display:flex; justify-content:center; align-items:center; cursor:pointer; transition:.2s cubic-bezier(0,-0.5,0,3); }
  .channel:focus, .channel:hover { transform:translateY(-2px); box-shadow:0 12px 40px rgba(0,0,0,.55); outline:none; }
  .channel:active { transform:translateY(2px); }
  .channel img { width:80%; height:80%; object-fit:contain; }

  /* Player container (default landscape) */
  #playerContainer { 
    position:fixed; inset:0; background:#000; 
    display:none; z-index:99999; 
    align-items:center; justify-content:center;
  }

  /* Forced Landscape Mode for phones */
  .force-landscape {
    position: fixed;
    top: 0; left: 0;
    width: 100vh;
    height: 100vw;
    transform: rotate(90deg);
    transform-origin: center center;
    background: black;
    z-index: 999999;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .force-landscape video {
    height: 100vw;
    width: auto;
  }

  /* default video styling */
  #playerContainer video { outline:none; border:0; width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>
  <div class="categories" id="categories" role="toolbar" aria-label="Categories"></div>
  <div class="grid" id="grid" role="grid"></div>

  <!-- fullscreen player container -->
  <div id="playerContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
// --- data ---
const categories = ["LIVE TV","FILMA","SPORT","FEMIJE","DOKU"];
const channelsByCategory = {
  "LIVE TV": [
    { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png", url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
    { name:"RTK 3", logo:"http://vimg.ipko.tv/logo/color/rtk3.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },
    { name:"KTV",  logo:"http://vimg.ipko.tv/logo/color/ktv.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/lj9-pxm-o53-rp0/tracks-v4a1/mono.ts.m3u8" }
  ],
  "FILMA": [ 
    { name:"BBVIPKS 1", logo:"https://yt3.googleusercontent.com/E8ouN8KVA9yOeBt_d4rTdP1nYsHng5uYLyPOxCvOiJbomhpKg0VOkksJncsTFqD9DeR2U1RU=s900-c-k-c0x00ffffff-no-rj", url:"https://cdn-1.bbvipal4.xyz/memfs/a4d30f2c-7f6d-4956-80c0-6870cba4489d.m3u8" },
    { name:"BBVIPKS 2", logo:"https://yt3.googleusercontent.com/E8ouN8KVA9yOeBt_d4rTdP1nYsHng5uYLyPOxCvOiJbomhpKg0VOkksJncsTFqD9DeR2U1RU=s900-c-k-c0x00ffffff-no-rj", url:"https://cdn-1.bbvipal4.xyz/memfs/ae40b0f2-de0d-4483-9fb5-9697cbff13b6.m3u8" },
    { name:"Cinema 3", logo:"https://via.placeholder.com/120x120?text=C3", url:"" }
  ],
  "SPORT": [
    { name:"Sport+", logo:"https://via.placeholder.com/120x120?text=S+", url:"" },
    { name:"Arena",  logo:"https://via.placeholder.com/120x120?text=A",  url:"" }
  ],
  "FEMIJE": [
    { name:"Kids 1", logo:"https://via.placeholder.com/120x120?text=K1", url:"" },
    { name:"Kids 2", logo:"https://via.placeholder.com/120x120?text=K2", url:"" }
  ],
  "DOKU": [
    { name:"Doku 1", logo:"https://via.placeholder.com/120x120?text=D1", url:"" },
    { name:"Doku 2", logo:"https://via.placeholder.com/120x120?text=D2", url:"" }
  ]
};

// --- DOM refs ---
const catWrap = document.getElementById('categories');
const grid = document.getElementById('grid');
const playerContainer = document.getElementById('playerContainer');
let hls = null;
let currentCategory = 'LIVE TV';

// --- render UI ---
categories.forEach((cat,ci)=>{
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.textContent = cat;
  btn.onclick = ()=> loadCategory(cat);
  catWrap.appendChild(btn);
});

function loadCategory(cat){
  currentCategory = cat;
  grid.innerHTML = '';
  channelsByCategory[cat].forEach(ch=>{
    const box = document.createElement('button');
    box.className = 'channel';
    box.innerHTML = `<img src="${ch.logo}" alt="${ch.name}" />`;
    box.onclick = ()=> openPlayerForChannel(ch);
    grid.appendChild(box);
  });
}

// --- FORCE LANDSCAPE video player ---
function openPlayerForChannel(ch){
  if(!ch.url) return;

  history.pushState({player:true}, 'player');

  playerContainer.style.display = 'flex';
  playerContainer.innerHTML = '';

  if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }

  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  video.controls = false;
  video.style.pointerEvents = "none";
  playerContainer.appendChild(video);

  // HLS or native
  if(Hls.isSupported()){
    hls = new Hls();
    hls.loadSource(ch.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, ()=> video.play());
  } else {
    video.src = ch.url;
    video.play();
  }

  // ---- FORCE LANDSCAPE IF PHONE IS PORTRAIT ----
  const isPortrait = window.innerHeight > window.innerWidth;
  if(isPortrait){
    playerContainer.classList.add("force-landscape");
  } else {
    playerContainer.classList.remove("force-landscape");
  }
}

// --- Close Player ---
function closePlayer(){
  if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
  playerContainer.style.display = 'none';
  playerContainer.innerHTML = '';
  playerContainer.classList.remove("force-landscape");
}

window.addEventListener('popstate', ()=>{
  if(playerContainer.style.display === 'flex'){
    closePlayer();
  }
});

window.addEventListener('keydown', (e)=>{
  if((e.key === "Escape" || e.key === "Backspace") &&
     playerContainer.style.display === 'flex'){
    history.back();
  }
});

// Load first category
loadCategory(currentCategory);
</script>
</body>
</html>
