<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TV App UI</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<style>
  body { background:#3f4451; font-family:'Rubik',sans-serif; color:#fff; margin:0; padding:40px; }
  .categories { display:flex; gap:20px; margin-bottom:40px; }
  .cat-btn { background:#6246B8; color:#fff; padding:15px 28px; border-radius:12px; font-weight:500; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.45); transition:.2s cubic-bezier(0,-0.5,0,3); }
  .cat-btn:focus, .cat-btn:hover { box-shadow:0 12px 40px rgba(0,0,0,.5); transform:translateY(-2px); outline:none; }
  .cat-btn:active { transform:translateY(2px); }

  .grid { display:grid; grid-template-columns:repeat(7,120px); gap:20px; }
  .channel { width:120px; height:120px; background:#fff; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,.5); display:flex; justify-content:center; align-items:center; cursor:pointer; transition:.2s cubic-bezier(0,-0.5,0,3); }
  .channel:focus, .channel:hover { transform:translateY(-2px); box-shadow:0 12px 40px rgba(0,0,0,.55); outline:none; }
  .channel:active { transform:translateY(2px); }
  .channel img { width:80%; height:80%; object-fit:contain; }

  /* player container that becomes fullscreen */
  #playerContainer { position:fixed; inset:0; background:#000; display:none; z-index:99999; align-items:center; justify-content:center; }
  #playerContainer.video-landscape video { width:100vw; height:100vh; object-fit:cover; }
  #playerContainer.video-portrait video { width:100%; height:100%; object-fit:contain; }

  /* ensure no default controls are visible */
  #playerContainer video { outline:none; border:0; touch-action:none; -ms-touch-action:none; }

  /* prevent pinch/zoom on the page */
  html, body { touch-action: manipulation; -ms-touch-action: manipulation; }

  /* small responsive tweak for phones */
  @media (max-width: 600px) {
    body { padding: 12px; }
    .grid { grid-template-columns: repeat(4, 80px); gap:12px; }
    .channel { width:80px; height:80px; border-radius:10px; }
    .cat-btn { padding:10px 18px; font-size:14px; }
  }
</style>
</head>
<body>
  <div class="categories" id="categories" role="toolbar" aria-label="Categories"></div>
  <div class="grid" id="grid" role="grid"></div>

  <!-- fullscreen player container (custom) -->
  <div id="playerContainer"></div>

<!-- hls.js for m3u8 playback when needed -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
// --- data ---
const categories = ["LIVE TV","FILMA","SPORT","FEMIJE","DOKU"];
const channelsByCategory = {
  "LIVE TV": [
    { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png", url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
    { name:"RTK 3", logo:"http://vimg.ipko.tv/logo/color/rtk3.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },
    { name:"KTV", logo:"http://vimg.ipko.tv/logo/color/ktv.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/lj9-pxm-o53-rp0/tracks-v4a1/mono.ts.m3u8" }
  ],
  "FILMA": [
    { name:"BB VIP Kosova 1", logo:"https://yt3.googleusercontent.com/E8ouN8KVA9yOeBt_d4rTdP1nYsHng5uYLyPOxCvOiJbomhpKg0VOkksJncsTFqD9DeR2U1RU=s900-c-k-c0x00ffffff-no-rj", url:"https://cdn-1.bbvipal4.xyz/memfs/a4d30f2c-7f6d-4956-80c0-6870cba4489d.m3u8" },
    { name:"BB VIP Kosova 2", logo:"https://yt3.googleusercontent.com/E8ouN8KVA9yOeBt_d4rTdP1nYsHng5uYLyPOxCvOiJbomhpKg0VOkksJncsTFqD9DeR2U1RU=s900-c-k-c0x00ffffff-no-rj", url:"https://cdn-1.bbvipal4.xyz/memfs/ae40b0f2-de0d-4483-9fb5-9697cbff13b6.m3u8" },
    { name:"Cinema 1", logo:"https://via.placeholder.com/120x120?text=C1", url:"" },
    { name:"Cinema 2", logo:"https://via.placeholder.com/120x120?text=C2", url:"" },
    { name:"Cinema 3", logo:"https://via.placeholder.com/120x120?text=C3", url:"" }
  ],
  "SPORT": [ { name:"Sport+", logo:"https://via.placeholder.com/120x120?text=S+", url:"" }, { name:"Arena", logo:"https://via.placeholder.com/120x120?text=A", url:"" } ],
  "FEMIJE": [ { name:"Kids 1", logo:"https://via.placeholder.com/120x120?text=K1", url:"" }, { name:"Kids 2", logo:"https://via.placeholder.com/120x120?text=K2", url:"" } ],
  "DOKU": [ { name:"Doku 1", logo:"https://via.placeholder.com/120x120?text=D1", url:"" }, { name:"Doku 2", logo:"https://via.placeholder.com/120x120?text=D2", url:"" } ]
};

// --- DOM refs ---
const catWrap = document.getElementById('categories');
const grid = document.getElementById('grid');
const playerContainer = document.getElementById('playerContainer');
let hls = null;
let currentCategory = 'LIVE TV';
let currentChannelIndex = 0;

// --- render UI ---
categories.forEach((cat,ci)=>{
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.textContent = cat;
  btn.setAttribute('data-cat',cat);
  btn.tabIndex = 0;
  btn.onclick = ()=> loadCategory(cat);
  btn.onfocus = ()=> { focusedArea = 'cats'; catFocus = ci; }
  catWrap.appendChild(btn);
});

// render channels for a category
function loadCategory(cat){
  currentCategory = cat;
  grid.innerHTML = '';
  const list = channelsByCategory[cat] || [];
  list.forEach((ch,idx)=>{
    const box = document.createElement('button');
    box.className = 'channel';
    box.tabIndex = 0;
    box.setAttribute('data-idx', idx);
    box.innerHTML = `<img src="${ch.logo}" alt="${ch.name}" />`;
    box.onclick = ()=> openPlayerForChannel(ch, idx);
    box.onfocus = ()=> { focusedArea = 'grid'; gridFocus = idx; }
    grid.appendChild(box);
  });
  // reset focus indices
  catFocus = categories.indexOf(cat) >= 0 ? categories.indexOf(cat) : 0;
  gridFocus = 0;
  focusedArea = 'cats';
  focusCurrent();
}

// --- focus/navigation state ---
let focusedArea = 'cats'; // 'cats' or 'grid'
let catFocus = 0;
let gridFocus = 0;
const GRID_COLS = 7;

function focusCurrent(){
  if(focusedArea === 'cats'){
    const cats = catWrap.querySelectorAll('.cat-btn');
    cats[catFocus]?.focus();
  } else {
    const items = grid.querySelectorAll('.channel');
    items[gridFocus]?.focus();
  }
}

// handle remote arrows / enter
document.addEventListener('keydown', (e)=>{
  // if player open, handle only player-specific keys
  if(playerContainer.style.display === 'flex'){
    // channel switching while watching
    if(e.key === 'ArrowUp'){ channelPrev(); e.preventDefault(); return; }
    if(e.key === 'ArrowDown'){ channelNext(); e.preventDefault(); return; }
    // Back should close player (history.back triggers popstate)
    if(e.key === 'Backspace' || e.key === 'Escape'){ history.back(); e.preventDefault(); return; }
    return;
  }

  if(e.key === 'ArrowRight'){
    if(focusedArea === 'cats') { catFocus = Math.min(catFocus + 1, categories.length - 1); }
    else { gridFocus = gridFocus + 1; }
  }
  if(e.key === 'ArrowLeft'){
    if(focusedArea === 'cats') { catFocus = Math.max(catFocus - 1, 0); }
    else { gridFocus = Math.max(gridFocus - 1, 0); }
  }
  if(e.key === 'ArrowDown'){
    if(focusedArea === 'cats'){
      // move from categories to grid column matching catFocus
      focusedArea = 'grid';
      gridFocus = catFocus; // same column
    } else {
      gridFocus = gridFocus + GRID_COLS;
    }
  }
  if(e.key === 'ArrowUp'){
    if(focusedArea === 'grid'){
      if(gridFocus < GRID_COLS){ // go to categories row
        focusedArea = 'cats';
        catFocus = Math.min(gridFocus, categories.length - 1);
      } else {
        gridFocus = gridFocus - GRID_COLS;
      }
    }
  }

  // clamp gridFocus to available items
  const gridItems = grid.querySelectorAll('.channel');
  if(gridFocus >= gridItems.length) gridFocus = gridItems.length - 1;
  if(gridFocus < 0) gridFocus = 0;

  // Enter to activate
  if(e.key === 'Enter'){
    if(focusedArea === 'cats'){ loadCategory(categories[catFocus]); }
    else { grid.querySelectorAll('.channel')[gridFocus]?.click(); }
  }

  focusCurrent();
});

// --- player helpers (HLS.js only, auto-rotate) ---
function openPlayerForChannel(ch, idx){
  const url = ch.url;
  if(!url) return;

  currentChannelIndex = idx;

  // push history so back button can return to UI
  history.pushState({player:true}, 'player');

  // prepare container
  playerContainer.style.display = 'flex';
  playerContainer.setAttribute('aria-hidden', 'false');

  // choose landscape vs portrait depending on device
  updateOrientationClass();

  // clear previous content / hls
  playerContainer.innerHTML = '';
  if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }

  const video = document.createElement('video');
  video.id = 'tvplayer';
  video.autoplay = true;
  video.controls = false; // no controls visible
  video.muted = false;
  video.setAttribute('playsinline','');
  // prevent touch controls interfering; remote will use keys
  video.style.pointerEvents = 'none';

  playerContainer.appendChild(video);

  // ---- HLS.js playback ----
  if(window.Hls && Hls.isSupported()){
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 30
    });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ video.play().catch(()=>{}); });
    // optional: handle errors (can extend)
    hls.on(Hls.Events.ERROR, function(event, data){
      // if fatal, try to recover or show message
      if(data && data.fatal){
        try{ hls.destroy(); }catch(e){} hls = null;
      }
    });
  } else {
    // native playback (iOS, some Android WebViews)
    video.src = url;
    video.play().catch(()=>{});
  }

  // Attempt to lock orientation to landscape on supported devices
  try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape'); }catch(e){}

  // Request fullscreen where available (on the video element)
  const req = video.requestFullscreen || video.webkitRequestFullscreen || video.msRequestFullscreen;
  try{ req && req.call(video).catch(()=>{}); }catch(e){}
}

function closePlayer(){
  // stop hls and remove video
  if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
  playerContainer.style.display = 'none';
  playerContainer.innerHTML = '';
  playerContainer.setAttribute('aria-hidden', 'true');
  // unlock orientation if possible
  try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
}

// channel up/down while watching
function channelNext(){
  const list = channelsByCategory[currentCategory] || [];
  if(list.length === 0) return;
  currentChannelIndex = (currentChannelIndex + 1) % list.length;
  openPlayerForChannel(list[currentChannelIndex], currentChannelIndex);
}
function channelPrev(){
  const list = channelsByCategory[currentCategory] || [];
  if(list.length === 0) return;
  currentChannelIndex = (currentChannelIndex - 1 + list.length) % list.length;
  openPlayerForChannel(list[currentChannelIndex], currentChannelIndex);
}

// handle history/back
window.addEventListener('popstate', (e)=>{
  // if player open, close it and prevent app exit
  if(playerContainer.style.display === 'flex'){
    closePlayer();
    // do not push additional history here
  }
});

// also map Escape/Backspace to close
window.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' || e.key === 'Backspace'){
    if(playerContainer.style.display === 'flex'){
      history.back(); // triggers popstate -> closePlayer
    }
  }
});

// auto-orientation helper for phones
function updateOrientationClass(){
  const w = window.innerWidth, h = window.innerHeight;
  if(w>h) {
    playerContainer.classList.add('video-landscape');
    playerContainer.classList.remove('video-portrait');
  } else {
    playerContainer.classList.add('video-portrait');
    playerContainer.classList.remove('video-landscape');
  }
}
window.addEventListener('resize', updateOrientationClass);
window.addEventListener('orientationchange', updateOrientationClass);

// initial load
loadCategory(currentCategory);
</script>
</body>
</html>
