<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TV App UI</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body { background:#3f4451; font-family:'Rubik',sans-serif; color:#fff; margin:0; padding:40px; }
  .categories { display:flex; gap:20px; margin-bottom:40px; }
  .cat-btn { background:#6246B8; color:#fff; padding:15px 28px; border-radius:12px; font-weight:500; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.45); transition:.2s cubic-bezier(0,-0.5,0,3); }
  .cat-btn:focus, .cat-btn:hover { box-shadow:0 12px 40px rgba(0,0,0,.5); transform:translateY(-2px); outline:none; }
  .cat-btn:active { transform:translateY(2px); }

  .grid { display:grid; grid-template-columns:repeat(7,120px); gap:20px; }
  .channel { width:120px; height:120px; background:#fff; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,.5); display:flex; justify-content:center; align-items:center; cursor:pointer; transition:.2s cubic-bezier(0,-0.5,0,3); }
  .channel:focus, .channel:hover { transform:translateY(-2px); box-shadow:0 12px 40px rgba(0,0,0,.55); outline:none; }
  .channel:active { transform:translateY(2px); }
  .channel img { width:80%; height:80%; object-fit:contain; }

  #playerContainer {
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    z-index:99999;
    align-items:center;
    justify-content:center;
  }
</style>
</head>
<body>

  <div class="categories" id="categories"></div>
  <div class="grid" id="grid"></div>

  <!-- fullscreen player -->
  <div id="playerContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>

// --- categories and channels ---
const categories = ["LIVE TV","FILMA","SPORT","FEMIJE","DOKU"];
const channelsByCategory = {
  "LIVE TV": [
    { name:"TOP CHANNEL", logo:"https://vimg.ipko.tv/logo/color/topchanel.png", url:"https://cf.business-cdn.me/live/FrancescoFili/e76dc66304/1221574.m3u8" },
    { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png", url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
    { name:"RTK 3", logo:"http://vimg.ipko.tv/logo/color/rtk3.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" }
  ],
  FILMA: [
    { name:"Cinema 1", logo:"https://via.placeholder.com/120x120?text=C1", url:"" },
    { name:"Cinema 2", logo:"https://via.placeholder.com/120x120?text=C2", url:"" }
  ],
  SPORT: [
    { name:"Sport 1", logo:"https://via.placeholder.com/120x120?text=S1", url:"" }
  ],
  FEMIJE: [
    { name:"DISNEY JR", logo:"https://via.placeholder.com/120x120?text=K1", url:"https://fl1.moveonjoy.com/DISNEY_JR/index.m3u8" }
  ],
  DOKU: [
    { name:"NAT GEO", logo:"https://via.placeholder.com/120x120?text=D1", url:"https://fl1.moveonjoy.com/National_Geographic/index.m3u8" }
  ]
};

// DOM
const catWrap = document.getElementById("categories");
const grid = document.getElementById("grid");
const playerContainer = document.getElementById("playerContainer");

let currentCategory = "LIVE TV";
let hls = null;

// render categories
categories.forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "cat-btn";
  btn.textContent = cat;
  btn.onclick = () => loadCategory(cat);
  catWrap.appendChild(btn);
});

// load channels
function loadCategory(cat){
  currentCategory = cat;
  grid.innerHTML = "";
  channelsByCategory[cat].forEach(ch => {
    const box = document.createElement("button");
    box.className = "channel";
    box.innerHTML = `<img src="${ch.logo}" />`;
    box.onclick = () => openPlayerForChannel(ch);
    grid.appendChild(box);
  });
}
loadCategory(currentCategory);


// ========== FIXED FULLSCREEN VIDEO PLAYER ==========
function openPlayerForChannel(ch) {
  const url = ch.url;
  if (!url) return;

  history.pushState({ player: true }, "player");

  // prepare UI
  playerContainer.style.display = "flex";
  playerContainer.innerHTML = "";

  if (hls) { hls.destroy(); hls = null; }

  const video = document.createElement("video");
  video.autoplay = true;
  video.controls = false;
  video.playsInline = true;

  // 🔥 THIS FIXES YOUR HALF-SCREEN PROBLEM
  video.style.width = "100vw";
  video.style.height = "100vh";
  video.style.objectFit = "cover";
  video.style.background = "black";

  playerContainer.appendChild(video);

  // Use HLS.js
  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
  } else {
    video.src = url;
  }

  // 🔥 Fullscreen the CONTAINER (not the video)
  const req = playerContainer.requestFullscreen ||
              playerContainer.webkitRequestFullscreen ||
              playerContainer.msRequestFullscreen;
  if (req) req.call(playerContainer);
}

// close player on back
window.addEventListener("popstate", () => {
  playerContainer.style.display = "none";
  playerContainer.innerHTML = "";
  if (hls) { hls.destroy(); hls = null; }
});

</script>

</body>
</html>
