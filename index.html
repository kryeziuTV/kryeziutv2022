<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IPTV Player with Blue Sidebar and Fullscreen</title>
<style>
  /* Reset */
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: #000;
    font-family: 'Rubik', sans-serif;
    color: #fff;
    overflow: hidden;
    user-select: none;
  }

  /* Container */
  #app {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  /* Sidebar: blue glass overlay */
  #sidebar {
    width: 240px;
    background: rgba(10, 30, 60, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 2px 0 12px rgba(0, 0, 0, 0.8);
    padding: 20px 10px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    transition: opacity 0.35s ease, visibility 0.35s ease;
    z-index: 10;
  }
  #sidebar.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    width: 0;
    padding: 20px 0;
  }
  #sidebar h2 {
    margin: 0 0 15px;
    font-weight: 600;
    font-size: 1.5rem;
    color: #80b9ff;
    text-align: center;
  }
  .channel-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 15px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(255 255 255 / 0.05);
    border: none;
    cursor: pointer;
    transition: background-color 0.25s ease, box-shadow 0.25s ease;
    color: #cde4ff;
    font-weight: 500;
    outline-offset: 2px;
  }
  .channel-btn img {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    object-fit: contain;
    flex-shrink: 0;
  }
  .channel-btn span {
    flex-grow: 1;
    font-size: 1rem;
  }
  .channel-btn:focus,
  .channel-btn:hover {
    background: rgba(20, 60, 120, 0.8);
    box-shadow: 0 0 15px #5ea3ffaa;
    color: #fff;
    outline: none;
  }
  /* Scrollbar */
  #sidebar::-webkit-scrollbar {
    width: 6px;
  }
  #sidebar::-webkit-scrollbar-track {
    background: transparent;
  }
  #sidebar::-webkit-scrollbar-thumb {
    background: rgba(94, 163, 255, 0.4);
    border-radius: 3px;
  }

  /* Player area */
  #playerArea {
    flex-grow: 1;
    background: #000;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }

  /* Channel logo overlay top-right */
  #logoOverlay {
    position: absolute;
    top: 16px;
    right: 16px;
    max-width: 120px;
    max-height: 60px;
    opacity: 0.8;
    pointer-events: none;
  }
  #logoOverlay img {
    width: 100%;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 2px #000);
  }

  /* Info text */
  #infoText {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.1rem;
    color: #80b9ffbb;
    font-weight: 500;
    user-select: none;
  }

  /* Instructions overlay */
  #instructions {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: #80b9ffcc;
    font-size: 0.9rem;
    font-weight: 400;
    user-select: none;
    pointer-events: none;
    text-align: center;
    max-width: 300px;
  }

</style>
</head>
<body>

<div id="app" role="application" aria-label="IPTV Player Application">

  <nav id="sidebar" aria-label="Channel list" tabindex="0">
    <h2>Channels</h2>
    <!-- Channel buttons inserted here -->
  </nav>

  <main id="playerArea">
    <video id="videoPlayer" playsinline webkit-playsinline muted></video>
    <div id="logoOverlay" aria-hidden="true"></div>
    <div id="infoText" aria-live="polite"></div>
    <div id="instructions" aria-hidden="true">
      Use ↑↓ to change channels<br>
      Press Enter to play<br>
      Press F to toggle fullscreen<br>
      Press Tab to toggle channels list<br>
      Press Back to exit or close fullscreen
    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  // --- Channels data ---
  const channels = [
    { name: "TOP CHANNEL", logo: "https://vimg.ipko.tv/logo/color/topchanel.png", url: "https://cf.business-cdn.me/live/FrancescoFili/e76dc66304/1221574.m3u8" },
    { name: "RTK 1", logo: "http://vimg.ipko.tv/logo/color/rtk1.png", url: "http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
    { name: "RTK 3", logo: "http://vimg.ipko.tv/logo/color/rtk3.png", url: "http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },
    { name: "KTV", logo: "http://vimg.ipko.tv/logo/color/ktv.png", url: "http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/lj9-pxm-o53-rp0/tracks-v4a1/mono.ts.m3u8" }
  ];

  // --- DOM references ---
  const sidebar = document.getElementById('sidebar');
  const video = document.getElementById('videoPlayer');
  const logoOverlay = document.getElementById('logoOverlay');
  const infoText = document.getElementById('infoText');

  let hls;
  let currentChannelIndex = 0;
  let sidebarVisible = true;

  // --- Initialize channel list ---
  function createChannelButtons() {
    channels.forEach((ch, idx) => {
      const btn = document.createElement('button');
      btn.className = 'channel-btn';
      btn.setAttribute('data-idx', idx);
      btn.setAttribute('aria-label', `Play ${ch.name}`);
      btn.innerHTML = `<img src="${ch.logo}" alt="${ch.name} logo" /><span>${ch.name}</span>`;
      btn.addEventListener('click', () => {
        playChannel(idx);
        focusChannelButton(idx);
        hideSidebar();
      });
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          playChannel(idx);
          focusChannelButton(idx);
          hideSidebar();
          e.preventDefault();
        }
      });
      sidebar.appendChild(btn);
    });
  }

  // --- Focus channel button by index ---
  function focusChannelButton(idx) {
    const buttons = sidebar.querySelectorAll('.channel-btn');
    buttons.forEach(b => b.classList.remove('focused'));
    const btn = buttons[idx];
    if (btn) {
      btn.focus();
    }
  }

  // --- Play channel by index ---
  function playChannel(idx) {
    if (idx < 0 || idx >= channels.length) return;
    currentChannelIndex = idx;
    const ch = channels[idx];
    infoText.textContent = `Playing: ${ch.name}`;

    // Show logo overlay
    logoOverlay.innerHTML = `<img src="${ch.logo}" alt="" />`;

    if (hls) {
      hls.destroy();
      hls = null;
    }

    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(ch.url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {});
      });
      hls.on(Hls.Events.ERROR, function(event, data) {
        console.error("HLS error:", data);
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = ch.url;
      video.play().catch(() => {});
    } else {
      alert('Your browser does not support HLS playback.');
    }
  }

  // --- Show/hide sidebar ---
  function hideSidebar() {
    sidebar.classList.add('hidden');
    sidebarVisible = false;
  }
  function showSidebar() {
    sidebar.classList.remove('hidden');
    sidebarVisible = true;
  }
  function toggleSidebar() {
    sidebarVisible ? hideSidebar() : showSidebar();
  }

  // --- Fullscreen toggle ---
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  // --- Keyboard navigation ---
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      let next = currentChannelIndex + 1;
      if (next >= channels.length) next = 0;
      focusChannelButton(next);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      let prev = currentChannelIndex - 1;
      if (prev < 0) prev = channels.length - 1;
      focusChannelButton(prev);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      // Play focused channel (or current channel if no focus change)
      const focused = document.activeElement;
      if (focused && focused.classList.contains('channel-btn')) {
        const idx = parseInt(focused.getAttribute('data-idx'), 10);
        if (!isNaN(idx)) {
          playChannel(idx);
          hideSidebar();
        }
      } else {
        playChannel(currentChannelIndex);
        hideSidebar();
      }
    } else if (e.key === 'Backspace' || e.key === 'Escape') {
      e.preventDefault();
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
        showSidebar();
      } else if (!sidebarVisible) {
        showSidebar();
      } else {
        if (confirm('Exit IPTV player?')) {
          window.close(); // May not work on all devices, placeholder
        }
      }
    } else if (e.key.toLowerCase() === 'f') {
      e.preventDefault();
      toggleFullscreen();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      toggleSidebar();
    }
  });

  // --- On fullscreen change ---
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      showSidebar();
    }
  });

  // --- On load ---
  createChannelButtons();
  playChannel(0);
  focusChannelButton(0);

</script>

</body>
</html>
