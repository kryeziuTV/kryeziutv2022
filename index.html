<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV App</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link rel="stylesheet" href="styles.css" />
</head>

<body>

<!-- TOP BAR -->
<div id="top-bar">
  <div id="datetime"></div>
  <div id="weather">⛅ 12°C</div>
</div>

<!-- HOME CATEGORIES -->
<div id="categories" class="centered">
  <div class="cat-btn" tabindex="0" data-cat="live">Live TV</div>
  <div class="cat-btn" tabindex="0" data-cat="movies">Movies</div>
  <div class="cat-btn" tabindex="0" data-cat="sports">Sports</div>
  <div class="cat-btn" tabindex="0" data-cat="kids">Kids</div>
</div>

<!-- CHANNEL LIST -->
<div id="channels" class="hidden"></div>

<!-- PLAYER -->
<div id="player-container" class="hidden">
  <button id="backBtn">⟵ Back</button>
  <video id="videoPlayer"></video>
</div>

<script src="app.js"></script>
</body>
</html>
