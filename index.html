<!DOCTYPE html><html>
<head>
<meta charset="UTF-8" />
<title>TV App UI</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body { background:#3f4451; font-family:'Rubik',sans-serif; color:#fff; margin:0; padding:40px; display:flex; flex-direction:column; align-items:center; }.categories { display:flex; gap:20px; margin-bottom:40px; justify-content:center; width:100%; } .cat-btn { background:#6246B8; color:#fff; padding:15px 28px; border-radius:12px; font-weight:500; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.45); transition:.2s cubic-bezier(0,-0.5,0,3); } .cat-btn:focus, .cat-btn:hover { box-shadow:0 0 15px #b08eff,0 12px 40px rgba(0,0,0,.5); transform:translateY(-2px); outline:none; } .cat-btn:active { transform:translateY(2px); }

.grid { display:grid; grid-template-columns:repeat(7,120px); gap:20px; justify-content:center; width:100%; } .channel { width:120px; height:120px; background:#fff; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,.5); display:flex; justify-content:center; align-items:center; cursor:pointer; transition:.2s cubic-bezier(0,-0.5,0,3); } .channel:focus, .channel:hover { transform:translateY(-2px); box-shadow:0 0 20px #9c78ff,0 12px 40px rgba(0,0,0,.55); outline:none; } .channel:active { transform:translateY(2px); } .channel img { width:80%; height:80%; object-fit:contain; }

#playerContainer { position:fixed; inset:0; background:#000; display:none; z-index:99999; align-items:center; justify-content:center; } #playerContainer video { width:100vw; height:100vh; object-fit:cover; } </style>

</head>
<body>
  <div class="categories" id="categories" role="toolbar"></div>
  <div class="grid" id="grid" role="grid"></div>  <div id="playerContainer"></div><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><script>
const categories = ["LIVE TV","FILMA","SPORT","FEMIJE","DOKU"];
const channelsByCategory = {
  "LIVE TV": [
    { name:"TOP CHANNEL", logo:"https://vimg.ipko.tv/logo/color/topchanel.png", url:"https://cf.business-cdn.me/live/FrancescoFili/e76dc66304/1221574.m3u8" },
    { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png", url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
    { name:"RTK 3", logo:"http://vimg.ipko.tv/logo/color/rtk3.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },
    { name:"KTV", logo:"http://vimg.ipko.tv/logo/color/ktv.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/lj9-pxm-o53-rp0/tracks-v4a1/mono.ts.m3u8" }
  ],
  "FILMA": [ { name:"Cinema 1", logo:"https://via.placeholder.com/120x120?text=C1", url:"" } ],
  "SPORT": [ { name:"Sport+", logo:"https://via.placeholder.com/120x120?text=S+", url:"" } ],
  "FEMIJE": [ { name:"Kids 1", logo:"https://via.placeholder.com/120x120?text=K1", url:"" } ],
  "DOKU": [ { name:"Doku 1", logo:"https://via.placeholder.com/120x120?text=D1", url:"" } ]
};

const catWrap = document.getElementById('categories');
const grid = document.getElementById('grid');
const playerContainer = document.getElementById('playerContainer');
let hls = null;
let focusedArea = 'cats';
let catFocus = 0;
let gridFocus = 0;
let currentCategory = 'LIVE TV';
let playingIndex = 0;

categories.forEach((cat,ci)=>{
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.textContent = cat;
  btn.onclick = ()=> loadCategory(cat);
  btn.onfocus = ()=> { focusedArea = 'cats'; catFocus = ci; };
  catWrap.appendChild(btn);
});

function loadCategory(cat){
  currentCategory = cat;
  grid.innerHTML = '';
  const list = channelsByCategory[cat] || [];
  list.forEach((ch,idx)=>{
    const box = document.createElement('button');
    box.className = 'channel';
    box.innerHTML = `<img src="${ch.logo}">`;
    box.onclick = ()=> openPlayer(idx);
    box.onfocus = ()=> { focusedArea='grid'; gridFocus=idx; };
    grid.appendChild(box);
  });
  catFocus = categories.indexOf(cat);
  gridFocus = 0;
  focusCurrent();
}

function focusCurrent(){
  if(focusedArea==='cats') catWrap.children[catFocus]?.focus();
  else grid.children[gridFocus]?.focus();
}

document.addEventListener('keydown', (e)=>{
  if(playerContainer.style.display==='flex'){
    if(e.key==='ArrowDown'){ changeChannel(1); }
    if(e.key==='ArrowUp'){ changeChannel(-1); }
    if(e.key==='Escape' || e.key==='Backspace'){ closePlayer(); }
    return;
  }

  if(e.key==='ArrowRight') catFocus=Math.min(catFocus+1,categories.length-1);
  if(e.key==='ArrowLeft') catFocus=Math.max(catFocus-1,0);
  if(e.key==='ArrowDown'){ focusedArea='grid'; }
  if(e.key==='Enter'){ loadCategory(categories[catFocus]); }
  focusCurrent();
});

function openPlayer(index){
  const channel = channelsByCategory[currentCategory][index];
  if(!channel.url) return;
  playingIndex = index;
  playerContainer.style.display='flex';
  playerContainer.innerHTML='';

  const video = document.createElement('video');
  video.autoplay = true;
  video.controls = false;
  video.muted = false;
  video.setAttribute('playsinline','');
  playerContainer.appendChild(video);

  if(Hls.isSupported()){
    hls = new Hls();
    hls.loadSource(channel.url);
    hls.attachMedia(video);
  } else video.src = channel.url;

  const fs = video.requestFullscreen || video.webkitRequestFullscreen;
  fs && fs.call(video);
}

function changeChannel(step){
  const list = channelsByCategory[currentCategory];
  playingIndex = (playingIndex + step + list.length) % list.length;
  openPlayer(playingIndex);
}

function closePlayer(){
  if(hls) hls.destroy();
  hls=null;
  playerContainer.style.display='none';
  playerContainer.innerHTML='';
}

loadCategory(currentCategory);
</script></body>
</html>
