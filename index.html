<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TV App UI - Versioni Statik (Pa EPG, Më Shpejtë) - V13</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet"> 

<style>
    /* --- STILIMET KRYESORE --- */
    body { 
        background: #1e1e1e; 
        font-family:'Rubik',sans-serif; 
        color:#fff; 
        margin:0; 
    } 
    
    /* SFONDI STATIK I IMZHIT */
    #background-image {
        position: fixed;
        right: 0;
        bottom: 0;
        min-width: 100%; 
        min-height: 100%;
        width: auto;
        height: auto;
        z-index: -2; 
        object-fit: cover;
        background-image: url("https://img.freepik.com/premium-photo/dark-black-gray-blurred-gradient-leaf-shadow-background-has-little-abstract-light_532332-1850.jpg");
        background-size: cover;
        background-position: center;
        filter: brightness(0.7) blur(2px); 
    }

    /* SHTRESA BLUR-UAR */
    #blur-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6); 
        backdrop-filter: blur(15px); 
        -webkit-backdrop-filter: blur(15px);
        z-index: -1; 
    } 

    /* --- WIDGET I ORËS DHE MOTIT (POSHTË NË TË DJATHTË) --- */
    #headerWidget {
        position: fixed;
        bottom: 20px; 
        right: 20px; 
        left: auto; 
        transform: none; 
        color: #fff;
        text-align: center; 
        z-index: 10;
        display: flex; 
        flex-direction: column; 
        align-items: flex-end; 
        gap: 15px; 
        pointer-events: none; 
    } 

    /* ORA DHE DATA */
    #timeDate {
        display: flex;
        flex-direction: column;
        align-items: center; 
        background: rgba(0, 0, 0, 0.5); 
        padding: 8px 15px; 
        border-radius: 10px;
        min-width: 150px; 
    }
    #currentTime {
        font-size: 2em; 
        font-weight: 700;
        line-height: 1;
    }
    #currentDate {
        font-size: 1.2em; 
        font-weight: 400; 
    } 

    /* MOTI */
    #weatherInfo {
        background: rgba(0, 0, 0, 0.5); 
        padding: 15px 20px; 
        border-radius: 10px;
        opacity: 1; 
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 400px; 
    }
    #weatherSummary {
        display: block;
        font-size: 1.2em; 
        font-weight: 500;
        margin-bottom: 8px;
    }
    .forecast-grid {
        display: grid;
        grid-template-columns: repeat(7, auto); 
        gap: 15px; 
        padding-top: 5px;
    }
    .day-forecast {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 0.8em; 
        opacity: 0.9;
    }
    .day-forecast .day-name {
        font-weight: 500;
        margin-bottom: 3px;
    }
    .day-forecast .day-icon {
        font-size: 1.8em; 
        margin: 4px 0 6px 0;
    }
    .day-forecast .day-temp {
        font-weight: 700;
    }
    /* --- FUNDI I STILIMIT TË WIDGET-IT --- */


    /* KONTEJNERI KRYESOR PËR QENDRËZIM */
    #mainContent {
        display: flex;
        flex-direction: column;
        align-items: center; 
        padding: 40px; 
        background: none; 
        margin-top: 20px; 
    } 

    /* KATEGORITË & GRIDI I KANALEVE */
    .categories { 
        display:flex; 
        gap:20px; 
        margin-bottom:40px; 
        justify-content: center; 
        width: 100%; 
    } 
    .cat-btn { 
        /* Ngjyra e Kategorisë (Dark Purple me transparencë) */
        background: rgba(98, 70, 184, 0.4); 
        color:#fff; 
        padding:15px 28px; 
        border-radius:12px; 
        font-size: 1.2em; 
        font-weight: 600; 
        cursor:pointer; 
        box-shadow:0 6px 20px rgba(0,0,0,.45); 
        transition:.2s cubic-bezier(0,-0.5,0,3); 
        border: 3px solid transparent; 
    }
    .cat-btn:focus, .cat-btn.focused { 
        background: #6246B8; 
        transform: scale(1.05) perspective(1000px) rotateX(3deg); 
        box-shadow: 
            0 0 15px 8px rgba(255, 255, 255, 0.4), 
            0 12px 40px rgba(0,0,0,.6); 
        outline:none; 
        border: 3px solid #fff; 
    }
    .cat-btn:active { transform:scale(0.98); } 

    .grid { 
        display:grid; 
        grid-template-columns:repeat(7,120px); 
        gap:20px; 
    } 

    /* --- STILIMI I KANALIT (I PËRDITËSUAR ME LIGHT PURPLE DHE EFEKT TË HOLLË) --- */
    .channel { 
        width:120px; 
        height:120px; 
        /* Ngjyra e Kanaleve (Light Purple me transparencë) */
        background: rgba(180, 160, 255, 0.2); 
        border-radius:14px; 
        box-shadow:0 6px 20px rgba(0,0,0,.5); 
        display:flex; 
        flex-direction: column; 
        justify-content:center; 
        align-items:center; 
        cursor:pointer; 
        transition:.15s cubic-bezier(0, -0.5, 0, 3); 
        border: 3px solid transparent; 
        overflow: hidden; 
        padding: 10px; 
        box-sizing: border-box;
        position: relative; 
    }
    
    .channel:focus, .channel.focused { 
        /* EFEKTI I RI: Vetëm Ngritje (Pop-up) dhe Border i Hollë Vjollcë */
        transform: scale(1.05); /* Vetëm zmadhim (ngritje) */
        
        box-shadow: 
            0 0 0 3px #6246B8, /* Border i hollë i jashtëm Vjollcë (ngjyra e butonave të kategorive) */
            0 8px 25px rgba(0, 0, 0, 0.5); /* Hija e jashtme e lehtë për thellësi */
        
        outline:none; 
        border: 3px solid transparent; 
    }
    .channel:active { transform:scale(0.98); } 

    .channel img { 
        max-width: 90%; 
        max-height: 90%; 
        object-fit: contain; 
        filter: saturate(1); 
        transition: filter 0.15s, transform 0.15s; 
    } 
    
    .channel:focus img, .channel.focused img { 
        filter: saturate(1.2); 
        transform: none; /* Logo nuk zhvendoset lart, vetëm zmadhohet */
    }
    
    /* --- FUNDI I STILIMIT TË KANALIT --- */
    
    /* PLAYER CONTAINER */
    #playerContainer { 
        position:fixed; 
        inset:0; 
        background:#000; 
        display:none; 
        z-index:99999; 
        align-items:center; 
        justify-content:center; 
    }
    #playerContainer video { 
        width:100vw; 
        height:100vh; 
        object-fit:contain; 
        outline:none; 
        border:0; 
        pointer-events:none; 
    } 

    /* Info Bar */
    #infoBar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 60px; 
        background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0)); 
        padding: 10px 40px 10px 40px; 
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        opacity: 0;
        pointer-events: none;
        transform: translateY(100%); 
        transition: opacity 0.5s, transform 0.5s ease-out; 
        z-index: 99999;
        justify-content: center; 
    } 

    #infoBar.visible {
        opacity: 1;
        transform: translateY(0%);
    } 

    .channel-title {
        font-size: 2.2em;
        font-weight: 700;
        color: #fff;
        line-height: 1;
    } 

    /* Loading/Error Overlay */
    #loadingOverlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none; 
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100000; 
    } 
    #loadingOverlay .message {
        font-size: 1.5em;
        font-weight: 500;
        color: #fff;
        margin-top: 20px;
    } 
    .spinner {
        border: 5px solid rgba(255, 255, 255, 0.3);
        border-top: 5px solid #6246B8;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
    } 
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    } 
    .error-text {
        color: #ff4d4f; 
        font-weight: bold;
    } 

    /* --- MENYJA ANËSORE (E Shpejtë) --- */
    #channelMenu {
        position: absolute;
        top: 0;
        left: 0;
        height: 100vh; 
        width: 350px; 
        padding: 20px 0;
        background: rgba(0, 0, 0, 0.95); 
        border-right: 1px solid rgba(255, 255, 255, 0.1); 
        overflow-y: auto; 
        overflow-x: hidden;
        display: none; 
        z-index: 100001; 
        scroll-behavior: auto; 
        transform: translateX(-100%); 
    } 

    #channelMenu.active {
        transform: translateX(0);
    }

    .menu-channel-item {
        padding: 20px 25px; 
        color: #fff; 
        font-size: 1.3em; 
        font-weight: 500;
        cursor:pointer;
        transition: background-color 0.05s, transform 0.05s, box-shadow 0.05s;

        overflow: hidden;
        text-overflow: ellipsis;

    .menu-channel-number {
        font-weight: 700; 
        color: #6246B8;

        width: 45px; 
        text-align: right;
    } 

    .menu-channel-item.focused {
        background-color: rgba(65, 105, 225, 0.3);

        color: #fff;
        transform: scale(1.03);
        box-shadow: 
            0 0 10px rgba(65, 105, 225, 0.3),
            5px 0 15px rgba(0, 0, 0, 0.5); 
        border-top-right-radius: 8px;
        border-bottom-right-radius: 8px;
    } 

    .menu-channel-item:focus {
        outline: none; 
    }
    /* --- FUNDI I STILIMIT TË MENUSË ANËSORE --- */
</style>
</head>

function loadCategory(cat){
    currentCategory = cat;
    grid.innerHTML = '';
    const list = channelsByCategory[cat] || [];
    list.forEach((ch,idx)=>{

        box.className = 'channel';
        box.tabIndex = 0;
        box.setAttribute('data-idx', idx);

        grid.appendChild(box);
    });
    
    catFocus = categories.indexOf(cat) >= 0 ? categories.indexOf(cat) : 0;
    gridFocus = 0;
    focusedArea = 'cats';
    focusCurrent();
} 

function focusCurrent(){
    catWrap.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('focused'));
    grid.querySelectorAll('.channel').forEach(item => item.classList.remove('focused'));
    
    if(focusedArea === 'cats'){
        const cats = catWrap.querySelectorAll('.cat-btn');
        if (cats[catFocus]) {
            cats[catFocus].classList.add('focused');
            cats[catFocus].focus(); 
        }
    } else {
        const items = grid.querySelectorAll('.channel');
        if (items[gridFocus]) {
            items[gridFocus].classList.add('focused');
            items[gridFocus].focus(); 
        }
    }
} 

// --- WIDGET LOGIC (Ora dhe Moti) --- 

function getWeatherDescription(code) {
    if (code === 0) return { description: "Diell i pastër", emoji: "☀️" };
    if (code === 1) return { description: "Kryesisht diell", emoji: "🌤️" };
    if (code === 2) return { description: "Pjesërisht i vranët", emoji: "⛅️" };
    if (code === 3) return { description: "Moti i vranët", emoji: "☁️" };
    if (code === 45 || code === 48) return { description: "Mjegull", emoji: "🌫️" };
    if (code >= 51 && code <= 55) return { description: "Shi i lehtë", emoji: "🌦️" };
    if (code >= 61 && code <= 65) return { description: "Shi i fortë", emoji: "🌧️" };
    
    // Përditësimi për borë: përfshin të gjitha kodet e borës (71-77, 85-86) dhe shi/borë të përzier (66-67)
    if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86) || code === 66 || code === 67) {
        return { description: "Borë", emoji: "❄️" };
    }
    
    if (code >= 80 && code <= 82) return { description: "Stuhi me shi", emoji: "⛈️" };
    if (code >= 95 && code <= 99) return { description: "Stuhi", emoji: "🌩️" };
    
    if (code >= 50 && code <= 89) {
        return { description: "I Lagësht/Shi", emoji: "💧" }; 
    }
    
    return { description: "Moti i Panjohur", emoji: "❓" }; 
} 

function updateClock() {
    const now = new Date();
    // Përdor 'h23' për formatin 24-orësh
    const timeString = now.toLocaleTimeString('sq-AL', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    const dateString = now.toLocaleDateString('sq-AL', { weekday: 'long', day: 'numeric', month: 'long' });
    
    document.getElementById('currentTime').textContent = timeString;
    document.getElementById('currentDate').textContent = dateString;
} 

// 1. Funksioni i Motit Tani Merr Koordinatat Statike
async function fetchWeather(lat, lon, cityName) {
    const weatherInfo = document.getElementById('weatherInfo');
    const weatherSummary = document.getElementById('weatherSummary');
    const forecastGrid = document.getElementById('forecast7Day');
    
    weatherInfo.style.opacity = 0.5; 

    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`; 

    try {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`Gabim HTTP: ${response.status}`);
        }
        const data = await response.json(); 

        const currentTemp = Math.round(data.current.temperature_2m);
        const currentCode = data.current.weather_code;
        const currentWeatherDesc = getWeatherDescription(currentCode);
        
        const dailyData = data.daily;
        if (dailyData.weather_code && dailyData.weather_code.length > 0) {
            dailyData.weather_code[0] = currentCode; 
            if (currentTemp > dailyData.temperature_2m_max[0]) dailyData.temperature_2m_max[0] = currentTemp;
            if (currentTemp < dailyData.temperature_2m_min[0]) dailyData.temperature_2m_min[0] = currentTemp;
        } 

        // Shfaq emrin e qytetit statik (Suhareke)
        weatherSummary.textContent = `${cityName}: ${currentTemp}°C, ${currentWeatherDesc.emoji} (${currentWeatherDesc.description})`; 

        // PARASHIKIMI 7-DITOR
        forecastGrid.innerHTML = ''; 
        for (let i = 0; i < dailyData.time.length && i < 7; i++) {
            const date = new Date(dailyData.time[i]);
            
            const dayName = i === 0 ? "Sot" : date.toLocaleDateString('sq-AL', { weekday: 'short' }); 
            
            const maxTemp = Math.round(dailyData.temperature_2m_max[i]);
            const minTemp = Math.round(dailyData.temperature_2m_min[i]);
            const code = dailyData.weather_code[i];
            const desc = getWeatherDescription(code); 

            const dayDiv = document.createElement('div');
            dayDiv.className = 'day-forecast';
            dayDiv.innerHTML = `
                <span class="day-name">${dayName}</span>
                <span class="day-icon">${desc.emoji}</span>
                <span class="day-temp">${maxTemp}°/${minTemp}°</span>
            `;
            forecastGrid.appendChild(dayDiv);
        }
        
        weatherInfo.style.opacity = 1; 

    } catch (error) {
        console.error("Gabim në marrjen e motit:", error);
        weatherSummary.textContent = `${cityName}: Dështoi ngarkimi i motit.`;
        forecastGrid.innerHTML = '';
        weatherInfo.style.opacity = 1;
    }
} 

// 2. Funksioni Kryesor PËR MOTIN STATIK (SUHAREKE)
function loadSuharekeWeather() {
    // Koordinatat e Suharekës (përafërsisht)
    const suharekeLat = 42.36; 
    const suharekeLon = 20.84; 
    const suharekeCity = "Suhareke"; 

    // Thërrasim funksionin e motit me koordinata statike
    fetchWeather(suharekeLat, suharekeLon, suharekeCity);
}


// --- INFO BAR, PLAYER, NAVIGATION ---
function showInfoBar(ch) {
    const infoBar = document.getElementById('infoBar');
    const title = infoBar.querySelector('.channel-title');

    if (!infoBar || !title) return; 

    title.textContent = `${ch.number || currentChannelIndex + 1} | ${ch.name}`;
    infoBar.classList.add('visible'); 
    
    if (infoBarTimer) clearTimeout(infoBarTimer); 

    infoBarTimer = setTimeout(() => {
        infoBar.classList.remove('visible');
    }, 5000);
} 

function updateLoadingState(state, channelName = null) {
    const overlay = document.getElementById('loadingOverlay');
    const spinner = overlay.querySelector('.spinner');
    const message = overlay.querySelector('.message'); 

    if (!overlay) return; 

    if (state === 'loading') {
        spinner.style.display = 'block';
        message.classList.remove('error-text');
        message.textContent = 'Po ngarkohet...';
        overlay.style.display = 'flex';
    } else if (state === 'error') {
        spinner.style.display = 'none';
        message.classList.add('error-text');
        message.textContent = `Kanali nuk punon: ${channelName || 'Pritet lidhja'}`;
        overlay.style.display = 'flex';
    } else if (state === 'hidden') {
        overlay.style.display = 'none';
    }
} 

function centerMenuFocus(menuItems, index) {
    const channelMenu = document.getElementById('channelMenu');
    const focusedItem = menuItems[index]; 

    if (!focusedItem || !channelMenu) return; 

    const itemHeight = focusedItem.offsetHeight; 
    const menuHeight = channelMenu.clientHeight; 
    const targetScrollTop = focusedItem.offsetTop - (menuHeight / 2) + (itemHeight / 2); 

    // Përdorim 'auto' për scroll të menjëhershëm
    channelMenu.scrollTo({ 
        top: targetScrollTop, 
        behavior: 'auto' 
    });
} 

function toggleChannelMenu(){
    const channelMenu = document.getElementById('channelMenu');
    if (!channelMenu) return; 

    isMenuVisible = !isMenuVisible;
    
    // Shfaqja/Fshehja e menjëhershme pa tranzicion
    if(isMenuVisible) {
        channelMenu.classList.add('active'); 
        channelMenu.style.display = 'block';
    } else {
        channelMenu.classList.remove('active');
        channelMenu.style.display = 'none';
    }
    
    if (isMenuVisible) {
        const items = channelMenu.querySelectorAll('.menu-channel-item');
        if(items.length > 0) {
            items.forEach(i => i.classList.remove('focused')); 
            menuFocusIndex = Math.min(Math.max(0, currentChannelIndex), items.length - 1); 
            items[menuFocusIndex].classList.add('focused');
            centerMenuFocus(items, menuFocusIndex); 
        }
    }
} 

function switchChannel(ch){
    if(!ch.url) return;
    
    if (ch.fullIndex === currentChannelIndex && isMenuVisible) {
        toggleChannelMenu(); 
        return; 
    }
    
    if (isMenuVisible) {
        toggleChannelMenu(); 
    }
    
    currentChannelIndex = ch.fullIndex; 
    menuFocusIndex = ch.fullIndex; 

    openPlayerForChannel(ch, true);
}


// handle remote arrows / enter / digits
document.addEventListener('keydown', (e)=>{
    
    if(playerContainer.style.display === 'flex'){
        const channelMenu = document.getElementById('channelMenu');
        const menuItems = channelMenu ? channelMenu.querySelectorAll('.menu-channel-item') : [];
        const MAX_CHANNEL_INDEX = allChannelsList.length - 1; 

        // LOGJIKA E NDËRRIMIT ME NUMRA
        if (e.key >= '0' && e.key <= '9') {
            e.preventDefault();
            
            if (digitTimer) clearTimeout(digitTimer);
            
            if (digitBuffer.length < 3) {
                digitBuffer += e.key;
            } else {
                digitBuffer = e.key;
            }
            
            const infoBar = document.getElementById('infoBar');
            const title = infoBar.querySelector('.channel-title');

            title.textContent = `Kanali: ${digitBuffer}`;
            infoBar.classList.add('visible'); 

            if (infoBarTimer) clearTimeout(infoBarTimer);
            
            digitTimer = setTimeout(() => {
                let targetNumber = parseInt(digitBuffer);
                
                if (targetNumber > 0 && targetNumber <= allChannelsList.length) {
                    const targetChannel = allChannelsList[targetNumber - 1];
                    switchChannel(targetChannel); 
                }
                
                digitBuffer = '';
                
                if (allChannelsList[currentChannelIndex]) {
                    showInfoBar(allChannelsList[currentChannelIndex]); 
                } else {
                    infoBar.classList.remove('visible');
                }
            }, 1500); 
            
            return; 
        }
        
        // KONTROLLA E MENYSË (Kur menuja është hapur)
        if(isMenuVisible){
            if(e.key === 'ArrowUp'){
                menuItems[menuFocusIndex]?.classList.remove('focused');
                menuFocusIndex = Math.max(0, menuFocusIndex - 1);
                menuItems[menuFocusIndex]?.classList.add('focused');
                centerMenuFocus(menuItems, menuFocusIndex); 
            } else if(e.key === 'ArrowDown'){
                menuItems[menuFocusIndex]?.classList.remove('focused');
                menuFocusIndex = Math.min(MAX_CHANNEL_INDEX, menuFocusIndex + 1);
                menuItems[menuFocusIndex]?.classList.add('focused');
                centerMenuFocus(menuItems, menuFocusIndex); 
            } else if(e.key === 'Enter'){
                const channel = allChannelsList[menuFocusIndex];
                switchChannel(channel);
            }
            return; 
        } 

        // NDËRRIMI SEKUENCIAL ME UP/DOWN
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
            
            if (digitTimer) clearTimeout(digitTimer);
            digitBuffer = '';
            
            let newIndex = currentChannelIndex;
            
            if (e.key === 'ArrowUp') {
                newIndex = currentChannelIndex > 0 ? currentChannelIndex - 1 : MAX_CHANNEL_INDEX;
            } else if (e.key === 'ArrowDown') {
                newIndex = currentChannelIndex < MAX_CHANNEL_INDEX ? currentChannelIndex + 1 : 0;
            }
            
            const nextChannel = allChannelsList[newIndex];
            currentChannelIndex = newIndex; 
            openPlayerForChannel(nextChannel, true); 
            return;
        }


        // OK/ENTER: HAP MENUNË E KANALIT dhe shfaq Info Bar
        if(e.key === 'Enter'){
            if (digitBuffer.length > 0) {
                let targetNumber = parseInt(digitBuffer);
                if (targetNumber > 0 && targetNumber <= allChannelsList.length) {
                    const targetChannel = allChannelsList[targetNumber - 1];
                    switchChannel(targetChannel); 
                }
                if (digitTimer) clearTimeout(digitTimer);
                digitBuffer = '';
            } else {
                const currentChannel = allChannelsList[currentChannelIndex];
                showInfoBar(currentChannel);
                toggleChannelMenu();
            }
        } 

        // BACKSPACE/ESCAPE: Mbyll player-in
        if(e.key === 'Backspace' || e.key === 'Escape'){ 
            if (digitTimer) clearTimeout(digitTimer); 
            digitBuffer = '';
            closePlayer(); 
            history.back(); 
        }
        
        return; 
    } 

    // KONTROLLAT E NAVIGIMIT TË UI-SË (jashtë player-it)
    if(e.key === 'ArrowRight'){
        if(focusedArea === 'cats') { catFocus = Math.min(catFocus + 1, categories.length - 1); }
        else { gridFocus = gridFocus + 1; }
    }
    if(e.key === 'ArrowLeft'){
        if(focusedArea === 'cats') { catFocus = Math.max(catFocus - 1, 0); }
        else { gridFocus = Math.max(gridFocus - 1, 0); }
    }
    if(e.key === 'ArrowDown'){
        if(focusedArea === 'cats'){
            focusedArea = 'grid';
            gridFocus = catFocus; 
        } else {
            gridFocus = gridFocus + GRID_COLS;
        }
    }
    if(e.key === 'ArrowUp'){
        if(focusedArea === 'grid'){
            if(gridFocus < GRID_COLS){ 
                focusedArea = 'cats';
                catFocus = Math.min(gridFocus, categories.length - 1);
            } else {
                gridFocus = gridFocus - GRID_COLS;
            }
        }
    } 

    const gridItems = grid.querySelectorAll('.channel');
    if(gridFocus >= gridItems.length) gridFocus = gridItems.length - 1;
    if(gridFocus < 0) gridFocus = 0; 

    if(e.key === 'Enter'){
        if(focusedArea === 'cats'){ loadCategory(categories[catFocus]); }
        else { grid.querySelectorAll('.channel')[gridFocus]?.click(); }
    } 

    focusCurrent();
}); 

// --- player helpers (hls.js fallback) ---
function openPlayerForChannel(ch, isSwitching = false){
    const url = ch.url;
    if(!url) {
        if (!isSwitching) {
            alert(`Kanali "${ch.name}" nuk ka një URL aktive.`);
        } else {
            updateLoadingState('error', ch.name);
        }
        return;
    }
    
    updateLoadingState('loading');
    showInfoBar(ch); 

    if (ch.fullIndex !== undefined) {
        currentChannelIndex = ch.fullIndex;
        menuFocusIndex = ch.fullIndex; 
    } else {
        const foundIndex = allChannelsList.findIndex(channel => channel.url === url);
        if (foundIndex !== -1) {
            currentChannelIndex = foundIndex;
            menuFocusIndex = foundIndex;
        }
    }


    if (!isSwitching) {
        document.body.style.padding = '0';
        document.body.style.overflow = 'hidden';
        document.getElementById('mainContent').style.display = 'none'; 
        history.pushState({player:true}, 'player');
        playerContainer.style.display = 'flex';
    }
    
    if(hls){ try{ hls.destroy(); }catch(e){} hls = null; } 

    let video = document.getElementById('tvplayer');
    let channelMenu = document.getElementById('channelMenu');
    
    if (!video) {
        video = document.createElement('video');
        video.id = 'tvplayer';
        video.autoplay = true;
        video.controls = false; 
        video.muted = false;
        video.setAttribute('playsinline','');
        playerContainer.insertBefore(video, document.getElementById('infoBar')); 

        channelMenu = document.createElement('div');
        channelMenu.id = 'channelMenu';
        playerContainer.appendChild(channelMenu);
        
        updateOrientationClass(); 
    }


    // POPULLO DHE FSHEH MENYNË ANËSORE
    if (!channelMenu) channelMenu = document.getElementById('channelMenu');
    channelMenu.innerHTML = ''; 
    allChannelsList.forEach((channelData, index) => {
        const item = document.createElement('div');
        item.className = 'menu-channel-item';
        
        const channelNumber = document.createElement('span');
        channelNumber.className = 'menu-channel-number';
        channelNumber.textContent = channelData.number; 
        
        const channelName = document.createElement('span');
        channelName.textContent = channelData.name;
        
        item.appendChild(channelNumber);
        item.appendChild(channelName);
        
        item.setAttribute('data-url', channelData.url);
        item.setAttribute('data-index', index);
        item.tabIndex = 0; 
        
        if (index === currentChannelIndex) {
            item.classList.add('focused');
        }
        
        item.onclick = () => switchChannel(channelData); 
        channelMenu.appendChild(item);
    });
    
    isMenuVisible = false;
    channelMenu.classList.remove('active'); 
    channelMenu.style.display = 'none';


    // Luaj me hls.js
    if(Hls && Hls.isSupported()){
        hls = new Hls({ maxBufferLength: 30 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function(){ 
            video.play().catch(()=>{}); 
        });
        
        hls.on(Hls.Events.ERROR, function(event, data){
            if (data.fatal) {
                updateLoadingState('error', ch.name);
                console.error('HLS Fatal Error:', data.details);
            }
        });
    } else {
        video.src = url;
        video.play().catch(()=>{});
    } 

    video.onplaying = () => {
        updateLoadingState('hidden');
    };
    video.onerror = () => {
        updateLoadingState('error', ch.name);
    } 

    try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape'); }catch(e){} 
    const req = video.requestFullscreen || video.webkitRequestFullscreen || video.msRequestFullscreen;
    try{ req && req.call(video).catch(()=>{}); }catch(e){}
} 

function closePlayer(){
    document.body.style.padding = '40px';
    document.body.style.overflow = 'auto'; 
    document.getElementById('mainContent').style.display = 'flex'; 
    isMenuVisible = false; 

    if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
    const video = document.getElementById('tvplayer');
    if (video) video.remove(); 
    
    const menu = document.getElementById('channelMenu');
    if (menu) {
        menu.classList.remove('active'); 
        menu.style.display = 'none';
    }

    updateLoadingState('hidden'); 
    if (infoBarTimer) {
        clearTimeout(infoBarTimer); 
        document.getElementById('infoBar').classList.remove('visible');
    }
    if (digitTimer) clearTimeout(digitTimer); 
    digitBuffer = '';
    
    playerContainer.style.display = 'none';
    
    try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
    
    focusCurrent();
} 

// handle history/back
window.addEventListener('popstate', (e)=>{
    if(playerContainer.style.display === 'flex'){
        closePlayer();
    }
}); 

window.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' || e.key === 'Backspace'){
        if(playerContainer.style.display === 'flex' && !isMenuVisible){
            if(window.history.state && window.history.state.player){
                 history.back(); 
            } else {
                closePlayer();
            }
        }
    }
}); 

function updateOrientationClass(){
    const w = window.innerWidth, h = window.innerHeight;
    if(w>h) { playerContainer.classList.add('video-landscape'); playerContainer.classList.remove('video-portrait'); }
    else { playerContainer.classList.add('video-portrait'); playerContainer.classList.remove('video-landscape'); }
}
window.addEventListener('resize', updateOrientationClass);
window.addEventListener('orientationchange', updateOrientationClass); 

// initial load
loadCategory(currentCategory); 

// INICIALIZIMI I WIDGET-IT TË MOTIT/ORËS
updateClock(); 
loadSuharekeWeather(); 

// Përditësojmë Orën çdo minutë (60000ms)
setInterval(updateClock, 60000); 
// Përditësojmë Motin çdo 10 minuta (600000ms)
setInterval(loadSuharekeWeather, 600000); 

</script>
