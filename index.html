<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TV App UI - Versioni Statik (Pa EPG, Më Shpejtë) - V25 (Përditësuar me Rotacion & Meny Instant)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    /* --- STILIMET KRYESORE --- */
    body { 
        background: #1e1e1e; 
        font-family:'Rubik',sans-serif; 
        color:#fff; 
        margin:0; 
        transition: padding 0.3s ease; 
    } 
    
    /* SFONDI STATIK I IMZHIT - BLUR I LARGUR */
    #background-image {
        position: fixed;
        right: 0;
        bottom: 0;
        min-width: 100%; 
        min-height: 100%;
        width: auto;
        height: auto;
        z-index: -2; 
        object-fit: cover;
        background-image: url("https://i.imgur.com/yeiw0tZ.jpeg");
        background-size: cover;
        background-position: center;
        filter: brightness(0.7); 
    }

    /* --- WIDGET I ORËS DHE MOTIT (POSHTË NË TË DJATHTË) --- */
    #headerWidget {
        position: fixed;
        bottom: 20px; 
        right: 20px; 
        left: auto; 
        top: auto; 
        transform: none; 
        color: #fff;
        text-align: right; 
        z-index: 10;
        display: flex; 
        flex-direction: column; 
        align-items: flex-end; 
        gap: 0; 
        pointer-events: none; 
    } 

    /* KARTELA KRYESORE E WIDGET-IT */
    #timeDate {
        display: flex;
        flex-direction: column;
        align-items: flex-end; 
        background: none; 
        padding: 10px 20px; 
        border-radius: 14px; 
        min-width: 200px; 
        box-shadow: none; 
        position: relative; 
    }

    /* Moti i menjëhershëm */
    #weatherSummary {
        display: flex;
        align-items: center;
        justify-content: flex-end; 
        font-size: 1.4em; 
        font-weight: 500; 
        color: rgba(255, 255, 255, 0.9); 
        margin-bottom: 5px; 
        padding: 0; 
        background: none; 
        border-radius: 0;
        min-width: auto; 
        text-align: right;
    }

    /* ORA */
    #currentTime {
        font-size: 3em; 
        font-weight: 700; 
        line-height: 1;
        margin: 0;
        padding: 0; 
        background: none; 
        border-radius: 0;
        box-shadow: none;
        text-align: right; 
    }

    /* DITA DHE DATA */
    #currentDate {
        font-size: 1em; 
        font-weight: 400; 
        margin-top: 5px; 
        line-height: 1.2;
        color: rgba(255, 255, 255, 0.8); 
        background: none; 
        padding: 0; 
        border-radius: 0;
        text-align: right; 
    } 

    /* Vendi/Qyteti (I Fshehur) */
    #weatherCity { display: none; } 

    /* Parashikimi 7-ditor (I FSHEHUR PLOTËSISHT) */
    #weatherInfo { display: none; } 

    /* --- FUNDI I STILIMIT TË WIDGET-IT --- */


    /* KONTEJNERI KRYESOR PËR QENDRËZIM */
    #mainContent {
        display: flex;
        flex-direction: column;
        align-items: center; 
        padding: 40px; 
        background: none; 
        margin-top: 20px; 
    } 

    /* KATEGORITË & GRIDI I KANALEVE */
    .categories { 
        display:flex; 
        gap: 20px; 
        margin-bottom:40px; 
        justify-content: center; 
        width: 100%; 
        padding-top: 0; 
    } 

    /* STILIMI I RI PËR KATEGORITË */
    .cat-btn { 
        background: none; 
        color:#fff; 
        padding:15px 28px; 
        font-size: 1.3em; 
        font-weight: 600; 
        cursor:pointer; 
        transition: transform .15s ease-out; 
        border: none; 
        border-radius: 0;
        position: relative; 
        margin: 0; 
        outline: none;
    }

    /* Vija e bardhë (Indikatori) */
    .cat-btn::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 4px;
        background-color: #fff;
        border-radius: 2px;
        transition: width 0.1s ease-out;
    }

    /* STILIMI I FOKUSIT (VETËM VIZA POSHTË DHE SCALE UP) */
    .cat-btn:focus, .cat-btn.focused { 
        background: none; 
        color: #fff;
        transform: scale(1.05); 
        box-shadow: none; 
    }
    
    .cat-btn:focus::after, .cat-btn.focused::after {
        width: 30px; 
    }

    .cat-btn:active { transform:scale(0.98); } 

    .grid { 
        display:grid; 
        grid-template-columns:repeat(7,120px); 
        gap:20px; 
    } 

    /* --- STILIMI I KANALIT --- */
    .channel { 
        width:120px; 
        height:120px; 
        background: rgba(180, 160, 255, 0.2); 
        border-radius:14px; 
        box-shadow:0 6px 20px rgba(0,0,0,.5); 
        display:flex; 
        flex-direction: column; 
        justify-content:center; 
        align-items:center; 
        cursor:pointer; 
        transition: transform .1s ease-out, box-shadow .1s ease-out, border-color .1s ease-out; 
        border: 3px solid transparent; 
        overflow: hidden; 
        padding: 10px; 
        box-sizing: border-box;
        position: relative; 
        outline: none; /* Heq konturin e fokusit natyral */
    }

    .channel:focus, .channel.focused { 
        transform: scale(1.25); 
        border: 3px solid transparent; 
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8); 
        outline:none; 
        z-index: 1; 
    }
    .channel:active { transform:scale(0.98); } 

    /* Vija e bardhë në fund (Indikatori) */
    .channel-indicator {
        position: absolute;
        bottom: 5px; 
        left: 50%; 
        transform: translateX(-50%);
        width: 40px; 
        height: 4px; 
        background-color: transparent; 
        transition: background-color .1s ease-out;
        border-radius: 2px;
        z-index: 2; 
    }

    /* Shfaqet vetëm kur është fokusuar */
    .channel:focus .channel-indicator, .channel.focused .channel-indicator {
        background-color: #ffffff;
    }

    .channel img { 
        max-width: 90%; 
        max-height: 90%; 
        object-fit: contain; 
        filter: saturate(1); 
        transition: filter 0.1s, transform 0.1s; 
    } 

    .channel:focus img, .channel.focused img { 
        filter: saturate(1.2); 
        transform: none; 
    }

    /* --- FUNDI I STILIMIT TË KANALIT --- */

    /* PLAYER CONTAINER (pa ndryshime) */
    #playerContainer { 
        position:fixed; 
        inset:0; 
        background:#000; 
        display:none; 
        z-index:99999; 
        align-items:center; 
        justify-content:center; 
        touch-action: none; 
    }
    #playerContainer video { 
        width:100vw; 
        height:100vh; 
        object-fit:contain; 
        outline:none; 
        border:0; 
        pointer-events: auto; 
    } 

    /* Info Bar (pa ndryshime) */
    #infoBar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 60px; 
        background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0)); 
        padding: 10px 40px 10px 40px; 
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        opacity: 0;
        pointer-events: none;
        transform: translateY(100%); 
        transition: opacity 0.5s, transform 0.5s ease-out; 
        z-index: 99999;
        justify-content: center; 
    } 

    #infoBar.visible {
        opacity: 1;
        transform: translateY(0%);
    } 

    .channel-title {
        font-size: 2.2em;
        font-weight: 700;
        color: #fff;
        line-height: 1;
    } 

    /* Loading/Error Overlay (pa ndryshime) */
    #loadingOverlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none; 
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100000; 
    } 
    #loadingOverlay .message {
        font-size: 1.5em;
        font-weight: 500;
        color: #fff;
        margin-top: 20px;
    } 
    .spinner {
        border: 5px solid rgba(255, 255, 255, 0.3);
        border-top: 5px solid #6246B8;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
    } 
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    } 
    .error-text {
        color: #ff4d4f; 
        font-weight: bold;
    } 

    /* --- NDRYSHIMI I MADH: MENYJA ANËSORE (Tani Overlay i Menjëhershëm) --- */
    #channelMenu {
        position: fixed; 
        inset: 0; /* Mbulon gjithë ekranin e player-it */
        
        /* NDRYSHIMI: Hije pak më e lehtë (0.8 -> 0.7) */
        background: rgba(0, 0, 0, 0.7); /* Hije e errët transparente, më e lehtë */
        backdrop-filter: blur(0); 
        -webkit-backdrop-filter: blur(0);
        
        border: none; 
        box-shadow: none; 

        overflow-y: auto; 
        overflow-x: hidden;
        display: none; 
        z-index: 100001; 
        
        transition: opacity 0.1s ease-out; 
        
        display: flex; 
        flex-direction: column;
        align-items: center; 
        justify-content: center; 
        opacity: 0;
        pointer-events: none;
    } 

    #channelMenu.active {
        opacity: 1; 
        pointer-events: auto;
    }

    /* KONTEJNERI I LISTËS SË KANALEVE BRENDA OVERLAY-T */
    .menu-channel-list-wrapper {
        width: 380px; 
        max-height: 90vh; 
        overflow-y: auto;
        padding: 20px 0;
        background: none; 
        
        /* Stilim minimal për scrollbar */
        scrollbar-width: none; 
        -ms-overflow-style: none;  
    }
    .menu-channel-list-wrapper::-webkit-scrollbar {
        display: none; 
    }

    .menu-channel-item {
        background: none; 
        border: none; 
        outline: none;
        
        padding: 15px 25px; 
        color: #fff; 
        font-size: 1.6em; 
        font-weight: 600; 
        cursor:pointer;
        /* Heqim tranzicionin e transform për shpejtësi maksimale */
        transition: background-color 0.05s, border-left-color 0.05s; 
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center; 
        gap: 25px; 
        
        /* Indikatori i fokusit (vija e majtë) */
        border-left: 5px solid transparent; 
        box-shadow: none; 
        transform: none; 
    } 

    .menu-channel-number {
        font-weight: 800; 
        color: #6246B8; 
        font-size: 1.6em; 
        width: 40px; 
        text-align: right;
    } 
    
    .menu-channel-name {
        color: #ffffff; 
        text-align: left;
    }

    /* FOKUSI I RI: VETËM VIZA E BARDHË DHE ZBARDHJA E TEKSTIT */
    .menu-channel-item.focused {
        background-color: rgba(255, 255, 255, 0.1); 
        border-left-color: #ffffff; 
        color: #fff;
        transform: none; 
        box-shadow: none; 
    } 

    .menu-channel-item.focused .menu-channel-name,
    .menu-channel-item.focused .menu-channel-number {
        color: #ffffff;
    }
    
    .menu-channel-item:focus {
        outline: none; 
    }
    /* --- FUNDI I STILIMIT TË MENUSË ANËSORE --- */
    
    
    /* --- BUTONI I ROTACIONIT (Ekrani i Vogël) --- */
    #rotateButton {
        position: absolute;
        top: 20px; 
        right: 20px; 
        background: rgba(0, 0, 0, 0.5); 
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        font-size: 1.5em;
        display: none; /* Default fshehur, shfaqet me media query */
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 100000; /* Mbi video, poshtë menusë */
        transition: opacity 0.3s ease;
        opacity: 0; 
        pointer-events: none;
    }

    #rotateButton.visible {
        opacity: 1;
        pointer-events: auto;
    }

    /* Shfaqet vetëm në ekrane të vogla (p.sh. telefona) */
    @media (max-width: 768px) {
        #rotateButton {
            display: flex;
        }
    }

    /* --- NDËRFAQJA E KONFIRMIMIT TË DALJES (MODAL) --- */
    #exitConfirmModal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85); 
        display: none; 
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100002; 
    }

    .modal-content {
        background: rgba(30, 30, 30, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        padding: 40px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .modal-content p {
        font-size: 1.8em;
        font-weight: 500;
        margin-bottom: 30px;
    }

    .modal-buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
    }

    .modal-btn {
        padding: 15px 40px;
        font-size: 1.2em;
        font-weight: 700;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s, background-color 0.1s;
        outline: none;
    }

    .modal-btn.yes {
        background-color: #ff4d4f; 
        color: #fff;
    }
    .modal-btn.no {
        background-color: #4169e1; 
        color: #fff;
    }

    .modal-btn:focus, .modal-btn.focused {
        transform: scale(1.05);
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }
    .modal-btn:active {
        transform: scale(0.98);
    }
    /* --- FUNDI I MODALIT TË DALJES --- */


    /* --- ADAPTIVITETI (RESPONSIVE DESIGN) --- */

    /* Për ekrane më të vogla se 1024px (Tableta, Laptopë të vegjël) */
    @media (max-width: 1024px) {
        .grid {
            grid-template-columns: repeat(5, 120px); 
            gap: 15px;
        }
        #mainContent {
            padding: 20px;
        }
        .categories {
            margin-bottom: 30px;
            gap: 15px;
        }
        .cat-btn {
            padding: 12px 20px;
            font-size: 1.1em;
        }
        .menu-channel-list-wrapper {
            width: 320px;
        }
    }

    /* Për ekrane më të vogla se 600px (Telefonat) */
    @media (max-width: 600px) {
        .grid {
            grid-template-columns: repeat(3, 100px); 
            gap: 10px;
        }
        .channel {
            width: 100px;
            height: 100px;
            border-radius: 10px;
        }
        .channel:focus, .channel.focused { 
            transform: scale(1.15); 
        }
        #headerWidget {
            bottom: 10px; 
            right: 10px; 
        }
        #currentTime {
            font-size: 2.5em; 
        }
        #mainContent {
            padding: 10px;
            margin-top: 10px;
        }
        .categories {
            display: flex; 
            overflow-x: auto; 
            justify-content: flex-start; 
            padding: 0 5px; 
            margin-bottom: 20px;
        }
        .cat-btn {
             font-size: 1em; 
             padding: 10px 15px;
             flex-shrink: 0; 
        }
        .menu-channel-list-wrapper {
            width: 90%; 
        }
        .menu-channel-item {
            font-size: 1.2em;
        }
    }

</style>
</head>

    <div id="background-image"></div>
    
    <div id="headerWidget">
        <div id="timeDate">
            <span id="weatherSummary"></span> 
            <span id="currentTime">--:--</span>

        <div id="weatherInfo">

    <div id="mainContent">
        <div class="categories" id="categories" role="toolbar" aria-label="Categories"></div>
        <div class="grid" id="grid" role="grid"></div>

    <div id="playerContainer">
        
        <button id="rotateButton" aria-label="Rotate Screen">
            <i class="fas fa-sync-alt"></i>
        </button>
        
        <div id="loadingOverlay">
            <div class="spinner"></div>
            <div class="message">Po ngarkohet...</div>
        </div> 

        <div id="infoBar">

    <div id="exitConfirmModal">
        <div class="modal-content">
            <p>Dëshironi të largoheni?</p>

                <button id="exitYes" class="modal-btn yes" tabindex="0">PO</button>

            </div>
        </div>
    </div>

            exitYesBtn.focus();
        }

    if (currentFocusedElement) {
        currentFocusedElement.classList.remove('focused');
    }

    let targetElement = null;
    
    if(focusedArea === 'cats'){
        const cats = catWrap.querySelectorAll('.cat-btn');
        if (cats[catFocus]) {
            targetElement = cats[catFocus];
        }
    } else {
        const items = grid.querySelectorAll('.channel');
        if (items[gridFocus]) {
            targetElement = items[gridFocus];
        }
    }
    
    if (targetElement) {
        targetElement.classList.add('focused');
        targetElement.focus(); 
        currentFocusedElement = targetElement;

        if (focusedArea === 'grid' && window.innerWidth <= 600) {
            targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }
}

function getWeatherDescription(code) {
    if (code === 0) return { description: "Diell i pastër", emoji: "☀️" };
    if (code === 1) return { description: "Kryesisht diell", emoji: "🌤️" };
    if (code === 2) return { description: "Pjesërisht i vranët", emoji: "⛅️" };
    if (code === 3) return { description: "Moti i vranët", emoji: "☁️" };
    if (code === 45 || code === 48) return { description: "Mjegull", emoji: "🌫️" };
    if (code >= 51 && code <= 55) return { description: "Shi i lehtë", emoji: "🌦️" };
    if (code >= 61 && code <= 65) return { description: "Shi i fortë", emoji: "🌧️" };
    if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86) || code === 66 || code === 67) {
        return { description: "Borë", emoji: "❄️" };
    }
    if (code >= 80 && code <= 82) return { description: "Stuhi me shi", emoji: "⛈️" };
    if (code >= 95 && code <= 99) return { description: "Stuhi", emoji: "🌩️" };
    if (code >= 50 && code <= 89) {
        return { description: "I Lagësht/Shi", emoji: "💧" }; 
    }
    return { description: "Moti i Panjohur", emoji: "❓" }; 
} 

function updateClock() {
    const now = new Date();
    const timeString = now.toLocaleTimeString('sq-AL', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    const dateString = now.toLocaleDateString('sq-AL', { weekday: 'long', day: 'numeric', month: 'long' });
    
    document.getElementById('currentTime').textContent = timeString;
    document.getElementById('currentDate').textContent = dateString;
} 

async function fetchWeather(lat, lon, cityName) {
    const weatherSummary = document.getElementById('weatherSummary');
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`; 

    try {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`Gabim HTTP: ${response.status}`);
        }
        const data = await response.json(); 

        const currentTemp = Math.round(data.current.temperature_2m);
        const currentCode = data.current.weather_code;
        const currentWeatherDesc = getWeatherDescription(currentCode);
        
        weatherSummary.innerHTML = `${currentWeatherDesc.emoji} ${currentTemp}°C`; 
        
    } catch (error) {
        console.error("Gabim në marrjen e motit:", error);
        weatherSummary.innerHTML = `❓ --°C`;
    }
}

function showRotateButton() {
    if (window.innerWidth <= 768) { // Shfaqet vetëm në ekrane të vogla
        rotateButton.classList.add('visible');
        if (rotationTimer) clearTimeout(rotationTimer);
        rotationTimer = setTimeout(() => {
            rotateButton.classList.remove('visible');
        }, 3000); // Fshihet pas 3 sekondave
    }
}

function toggleScreenOrientation() {
    const isMobile = window.innerWidth <= 768;
    if (!isMobile) return;

    if (screen.orientation && screen.orientation.lock) {
        const currentOrientation = screen.orientation.type;
        let newOrientation = 'landscape';
        
        // Përcakto orientimin e ri bazuar në atë aktual
        if (currentOrientation.includes('landscape')) {
            newOrientation = 'portrait';
        } else if (currentOrientation.includes('portrait')) {
            newOrientation = 'landscape';
        }

        screen.orientation.lock(newOrientation)
            .then(() => {
                console.log(`Ekrani u kyç në orientimin: ${newOrientation}`);
            })
            .catch((error) => {
                console.warn("Nuk mund të kyçej orientimi (Në disa shfletues nuk mbështetet):", error);
            });
    } else {
        alert("Orientimi i ekranit nuk mbështetet në këtë shfletues.");
    }
}
rotateButton.onclick = toggleScreenOrientation;

function updateLoadingState(state, channelName = null) {
    const overlay = document.getElementById('loadingOverlay');
    const spinner = overlay.querySelector('.spinner');
    const message = overlay.querySelector('.message'); 

    if (!overlay) return; 

    if (state === 'loading') {
        spinner.style.display = 'block';
        message.classList.remove('error-text');
        message.textContent = 'Po ngarkohet...';
        overlay.style.display = 'flex';
        rotateButton.classList.add('visible'); // Mbaje butonin e rotacionit aktiv gjatë ngarkimit
    } else if (state === 'error') {
        spinner.style.display = 'none';
        message.classList.add('error-text');
        message.textContent = `Kanali nuk punon: ${channelName || 'Pritet lidhja'}`;
        overlay.style.display = 'flex';
        showRotateButton();
    } else if (state === 'hidden') {
        overlay.style.display = 'none';
        rotateButton.classList.remove('visible');
    }
} 

function centerMenuFocus(menuItems, index) {
    const channelMenuWrapper = document.querySelector('.menu-channel-list-wrapper');
    const focusedItem = menuItems[index]; 

    if (!focusedItem || !channelMenuWrapper) return; 

    const itemHeight = focusedItem.offsetHeight; 
    const menuHeight = channelMenuWrapper.clientHeight; 
    const targetScrollTop = focusedItem.offsetTop - (menuHeight / 2) + (itemHeight / 2); 

    // NDRYSHIMI: Përdorim 'auto' për lëvizje të menjëhershme ose 'smooth' vetëm në hapjen fillestare
    channelMenuWrapper.scrollTo({ 
        top: targetScrollTop, 
        behavior: 'auto' 
    });
} 

function toggleChannelMenu(){
    const channelMenu = document.getElementById('channelMenu');
    if (!channelMenu) return; 
    
    if (exitModalActive) return;

    isMenuVisible = !isMenuVisible;
    
    if(isMenuVisible) {
        channelMenu.style.display = 'flex'; 
        channelMenu.classList.add('active'); 
    } else {
        channelMenu.classList.remove('active');
        setTimeout(() => {
            if (!channelMenu.classList.contains('active')) {
                 channelMenu.style.display = 'none';
            }
        }, 100); 
    }
    
    if (isMenuVisible) {
        const items = document.querySelectorAll('#channelMenu .menu-channel-item');
        if(items.length > 0) {
            items.forEach(i => i.classList.remove('focused')); 
            menuFocusIndex = Math.min(Math.max(0, currentChannelIndex), items.length - 1); 
            items[menuFocusIndex].classList.add('focused');
            items[menuFocusIndex].focus(); 
            // Këtu përdorim scrollTO me behavior: 'smooth' VETËM në hapjen fillestare
            document.querySelector('.menu-channel-list-wrapper').scrollTo({
                top: items[menuFocusIndex].offsetTop - (document.querySelector('.menu-channel-list-wrapper').clientHeight / 2) + (items[menuFocusIndex].offsetHeight / 2),
                behavior: 'smooth'
            });
        }
    } else {
        const video = document.getElementById('tvplayer');
        if (video) video.focus(); 
    }
} 

function switchChannel(ch){
    if(!ch.url) return;
    
    if (ch.fullIndex === currentChannelIndex && isMenuVisible) {
        toggleChannelMenu(); 
        return; 
    }
    
    if (isMenuVisible) {
        toggleChannelMenu(); 
    }
    
    currentChannelIndex = ch.fullIndex; 
    menuFocusIndex = ch.fullIndex; 

    openPlayerForChannel(ch, true);
}


function openPlayerForChannel(ch, isSwitching = false){
    const url = ch.url;
    if(!url) {
        if (!isSwitching) {
            alert(`Kanali "${ch.name}" nuk ka një URL aktive.`);
        } else {
            updateLoadingState('error', ch.name);
        }
        return;
    }
    
    updateLoadingState('loading');
    showInfoBar(ch); 

    if (ch.fullIndex !== undefined) {
        currentChannelIndex = ch.fullIndex;
        menuFocusIndex = ch.fullIndex;
    } else {
        const foundIndex = allChannelsList.findIndex(channel => channel.url === url);
        if (foundIndex !== -1) {
            currentChannelIndex = foundIndex;
            menuFocusIndex = foundIndex;
        }
    }

    if (!isSwitching) {
        document.body.style.padding = '0';
        document.body.style.overflow = 'hidden';
        document.getElementById('mainContent').style.display = 'none'; 
        history.pushState({player:true}, 'player');
        playerContainer.style.display = 'flex';
    }
    
    if(hls){ try{ hls.destroy(); }catch(e){} hls = null; } 

    let video = document.getElementById('tvplayer');
    let channelMenu = document.getElementById('channelMenu');
    
    if (!video) {
        video = document.createElement('video');
        video.id = 'tvplayer';
        video.autoplay = true;
        video.controls = false; 
        video.muted = false;
        video.setAttribute('playsinline','');
        video.tabIndex = -1; 
        playerContainer.insertBefore(video, document.getElementById('infoBar')); 

        if (!channelMenu) {
            channelMenu = document.createElement('div');
            channelMenu.id = 'channelMenu';
            playerContainer.appendChild(channelMenu);
        }
        
        updateOrientationClass(); 
        setupSwipeDetection(); 
    }

    // POPULLO DHE FSHEH MENYNË ANËSORE
    if (!channelMenu) channelMenu = document.getElementById('channelMenu');
    channelMenu.innerHTML = '';
    
    const listWrapper = document.createElement('div');
    listWrapper.className = 'menu-channel-list-wrapper';

    allChannelsList.forEach((channelData, index) => {
        const item = document.createElement('button'); 
        item.className = 'menu-channel-item';
        
        const channelNumber = document.createElement('span');
        channelNumber.className = 'menu-channel-number';
        channelNumber.textContent = channelData.number;
        
        const channelName = document.createElement('span');
        channelName.className = 'menu-channel-name'; 
        channelName.textContent = channelData.name;
        
        item.appendChild(channelNumber);
        item.appendChild(channelName);
        
        item.setAttribute('data-url', channelData.url);
        item.setAttribute('data-index', index);
        item.tabIndex = 0; 
        
        if (index === currentChannelIndex) {
            item.classList.add('focused');
        }
        
        item.onclick = (e) => { 
            if (index !== currentChannelIndex || e.clientX > 0) {
                 switchChannel(channelData); 
            }
        }; 
        listWrapper.appendChild(item);
    });
    
    channelMenu.appendChild(listWrapper); 

    isMenuVisible = false;
    channelMenu.classList.remove('active'); 
    channelMenu.style.display = 'none';


    // Luaj me hls.js
    if(Hls && Hls.isSupported()){
        hls = new Hls({ maxBufferLength: 10 }); 
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function(){ 
            video.play().catch(()=>{}); 
        });
        
        hls.on(Hls.Events.ERROR, function(event, data){
            if (data.fatal) {
                updateLoadingState('error', ch.name);
                console.error('HLS Fatal Error:', data.details);
            }
        });
    } else {
        video.src = url;
        video.play().catch(()=>{});
    } 

    video.onplaying = () => {
        updateLoadingState('hidden');
    };
    video.onerror = () => {
        updateLoadingState('error', ch.name);
    } 

    try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape'); }catch(e){} 
    const req = video.requestFullscreen || video.webkitRequestFullscreen || video.msRequestFullscreen;
    try{ req && req.call(video).catch(()=>{}); }catch(e){}
} 

function closePlayer(){
    document.body.style.padding = '40px';
    document.body.style.overflow = 'auto'; 
    document.getElementById('mainContent').style.display = 'flex'; 
    isMenuVisible = false; 
    
    if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
    const video = document.getElementById('tvplayer');
    if (video) video.remove(); 
    
    const menu = document.getElementById('channelMenu');
    if (menu) {
        menu.classList.remove('active'); 
        menu.style.display = 'none';
    }

    updateLoadingState('hidden'); 
    if (infoBarTimer) {
        clearTimeout(infoBarTimer); 
        document.getElementById('infoBar').classList.remove('visible');
    }
    if (rotationTimer) {
        clearTimeout(rotationTimer); 
        rotateButton.classList.remove('visible');
    }
    if (digitTimer) clearTimeout(digitTimer); 
    digitBuffer = '';
    
    playerContainer.style.display = 'none';
    
    try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
    
    focusCurrent();
}

// --- LOGJIKA E SWIPE (RRËSHQITJES) ---

function handleSwipe() {
    if (playerContainer.style.display === 'flex' && digitBuffer.length === 0) {
        if (Math.abs(touchendX - touchstartX) > SWIPE_THRESHOLD) {
            toggleChannelMenu();
        }
    }
}

function setupSwipeDetection() {
    // Shtojmë touch listener në të gjithë player containerin kur është aktiv
    const container = document.getElementById('playerContainer');
    if (!container) return; 

    container.addEventListener('touchstart', e => {
        if (!isMenuVisible) {
            touchstartX = e.changedTouches[0].screenX;
        }
    }, false);

    container.addEventListener('touchmove', e => {
        const diffX = e.changedTouches[0].screenX - touchstartX;
        const diffY = e.changedTouches[0].screenY - e.changedTouches[0].screenY;
        if (Math.abs(diffX) > Math.abs(diffY) && !isMenuVisible) {
            e.preventDefault(); 
        }
    }, false);

    container.addEventListener('touchend', e => {
        if (!isMenuVisible) {
            touchendX = e.changedTouches[0].screenX;
            handleSwipe();
        } else {
             // Kur menuja është e hapur, një tap jashtë menuwrapper-it e mbyll menunë
            if (e.target.id === 'channelMenu') {
                toggleChannelMenu();
            }
        }
        
    }, false);
}

// --- FUND I LOGJIKËS SË SWIPE ---


// --- LOGJIKA KRYESORE E NAVIGIMIT DHE SHIGJETAVE ---
document.addEventListener('keydown', (e)=>{
    
    // 1. KONTROLLA E MODALIT TË DALJES
    if (exitModalActive) {
        if (e.key === 'ArrowLeft') {
            exitYesBtn.classList.add('focused');
            exitNoBtn.classList.remove('focused');
            exitYesBtn.focus();
        } else if (e.key === 'ArrowRight') {
            exitNoBtn.classList.add('focused');
            exitYesBtn.classList.remove('focused');
            exitNoBtn.focus();
        } else if (e.key === 'Enter') {
            const focusedBtn = exitModal.querySelector('.modal-btn.focused');
            if (focusedBtn) focusedBtn.click();
        } else if (e.key === 'Escape' || e.key === 'Backspace') {
            hideExitConfirmModal();
        }
        e.preventDefault();
        return;
    }


    // 2. KONTROLLA E PLAYERIT (KUR ËSHTË HAPUR)
    if(playerContainer.style.display === 'flex'){
        
        const menuItems = document.querySelectorAll('#channelMenu .menu-channel-item');
        const MAX_CHANNEL_INDEX = allChannelsList.length - 1; 

        // LOGJIKA E NDËRRIMIT ME NUMRA
        if (e.key >= '0' && e.key <= '9') {
            e.preventDefault();
            
            if (digitTimer) clearTimeout(digitTimer);
            
            if (digitBuffer.length < 3) {
                digitBuffer += e.key;
            } else {
                digitBuffer = e.key;
            }
            
            const infoBar = document.getElementById('infoBar');
            const title = infoBar.querySelector('.channel-title');

            title.textContent = `Kanali: ${digitBuffer}`;
            infoBar.classList.add('visible'); 
            showRotateButton(); // Shfaq butonin e rotacionit me info barin e numrit

            if (infoBarTimer) clearTimeout(infoBarTimer);
            
            digitTimer = setTimeout(() => {
                let targetNumber = parseInt(digitBuffer);
                
                if (targetNumber > 0 && targetNumber <= allChannelsList.length) {
                    const targetChannel = allChannelsList[targetNumber - 1];
                    switchChannel(targetChannel); 
                }
                
                digitBuffer = '';
                
                if (allChannelsList[currentChannelIndex]) {
                    showInfoBar(allChannelsList[currentChannelIndex]); 
                } else {
                    infoBar.classList.remove('visible');
                    rotateButton.classList.remove('visible');
                }
            }, 1000); 
            
            return; 
        }
        
        // KONTROLLA E MENYSË (Kur menuja është hapur)
        if(isMenuVisible){
            if(e.key === 'ArrowUp'){
                menuItems[menuFocusIndex]?.classList.remove('focused');
                menuFocusIndex = Math.max(0, menuFocusIndex - 1);
                menuItems[menuFocusIndex]?.classList.add('focused');
                menuItems[menuFocusIndex]?.focus(); 
                // NDRYSHIM: Përdorim 'auto' për scroll të menjëhershëm gjatë mbajtjes shtypur
                centerMenuFocus(menuItems, menuFocusIndex); 
            } else if(e.key === 'ArrowDown'){
                menuItems[menuFocusIndex]?.classList.remove('focused');
                menuFocusIndex = Math.min(MAX_CHANNEL_INDEX, menuFocusIndex + 1);
                menuItems[menuFocusIndex]?.classList.add('focused');
                menuItems[menuFocusIndex]?.focus(); 
                // NDRYSHIM: Përdorim 'auto' për scroll të menjëhershëm gjatë mbajtjes shtypur
                centerMenuFocus(menuItems, menuFocusIndex); 
            } else if(e.key === 'Enter'){
                const channel = allChannelsList[menuFocusIndex];
                switchChannel(channel);
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Escape' || e.key === 'Backspace') {
                toggleChannelMenu(); 
            }
            e.preventDefault();
            return; 
        } 

        // NDËRRIMI SEKUENCIAL ME UP/DOWN (Kur menuja është fshehur)
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
            
            if (digitTimer) clearTimeout(digitTimer);
            digitBuffer = '';
            
            let newIndex = currentChannelIndex;
            
            if (e.key === 'ArrowUp') {
                newIndex = currentChannelIndex > 0 ? currentChannelIndex - 1 : MAX_CHANNEL_INDEX;
            } else if (e.key === 'ArrowDown') {
                newIndex = currentChannelIndex < MAX_CHANNEL_INDEX ? currentChannelIndex + 1 : 0;
            }
            
            const nextChannel = allChannelsList[newIndex];
            currentChannelIndex = newIndex; 
            openPlayerForChannel(nextChannel, true); 
            e.preventDefault();
            return;
        }


        // OK/ENTER: HAP MENUNË E KANALIT dhe shfaq Info Bar
        if(e.key === 'Enter'){
            e.preventDefault();
            if (digitBuffer.length > 0) {
                let targetNumber = parseInt(digitBuffer);
                if (targetNumber > 0 && targetNumber <= allChannelsList.length) {
                    const targetChannel = allChannelsList[targetNumber - 1];
                    switchChannel(targetChannel); 
                }
                if (digitTimer) clearTimeout(digitTimer);
                digitBuffer = '';
            } else {
                const currentChannel = allChannelsList[currentChannelIndex];
                showInfoBar(currentChannel);
                toggleChannelMenu();
            }
        } 

        // BACKSPACE/ESCAPE: Shfaq Modalin e Daljes
        if(e.key === 'Backspace' || e.key === 'Escape'){ 
            e.preventDefault();
            if (digitTimer) clearTimeout(digitTimer); 
            digitBuffer = '';
            showExitConfirmModal(); 
        }
        
        // SHIGJETA MAJTAS/DJATHTAS: Shfaq Info Bar (dhe butonin e rotacionit)
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
             const currentChannel = allChannelsList[currentChannelIndex];
             if (currentChannel) {
                showInfoBar(currentChannel);
             }
             e.preventDefault();
        }
        
        return; 
    } 

    // 3. KONTROLLAT E NAVIGIMIT TË UI-SË (jashtë player-it)
    
    // Logjika e navigimit me shigjeta (për TV/Desktop)
    if(e.key === 'ArrowRight'){
        if(focusedArea === 'cats') { catFocus = Math.min(catFocus + 1, categories.length - 1); }
        else { 
            const gridItems = grid.querySelectorAll('.channel');
            const cols = parseInt(window.getComputedStyle(grid).gridTemplateColumns.split(' ').length);
            // Kjo pjesë bëhet aktive vetëm në ekrane të mëdha
            if(window.innerWidth > 1024) { 
                if (gridFocus < gridItems.length - 1) {
                    gridFocus = gridFocus + 1;
                }
            } else {
                 gridFocus = gridFocus + 1;
            }
        }
    }
    if(e.key === 'ArrowLeft'){
        if(focusedArea === 'cats') { catFocus = Math.max(catFocus - 1, 0); }
        else { gridFocus = Math.max(gridFocus - 1, 0); }
    }
    if(e.key === 'ArrowDown'){
        const cols = parseInt(window.getComputedStyle(grid).gridTemplateColumns.split(' ').length);
        if(focusedArea === 'cats'){
            focusedArea = 'grid';
            gridFocus = Math.min(catFocus, grid.querySelectorAll('.channel').length - 1); 
        } else {
            const currentItems = grid.querySelectorAll('.channel');
            const newIndex = gridFocus + cols;
            if (newIndex < currentItems.length) {
                gridFocus = newIndex;
            }
        }
    }
    if(e.key === 'ArrowUp'){
        const cols = parseInt(window.getComputedStyle(grid).gridTemplateColumns.split(' ').length);
        if(focusedArea === 'grid'){
            if(gridFocus < cols){ 
                focusedArea = 'cats';
                catFocus = Math.min(gridFocus, categories.length - 1);
            } else {
                gridFocus = gridFocus - cols;
            }
        }
    } 

    const gridItems = grid.querySelectorAll('.channel');
    if(gridFocus >= gridItems.length) gridFocus = gridItems.length - 1;
    if(gridFocus < 0) gridFocus = 0; 
    
    if(e.key === 'Enter'){
        if(focusedArea === 'cats'){
            loadCategory(categories[catFocus]);
        } else {
            grid.querySelectorAll('.channel')[gridFocus]?.click();
        }
    }
    
    // BACKSPACE/ESCAPE: KTHEHU NË FAQEN KRYESORE NGA GRIDI
    if(e.key === 'Escape' || e.key === 'Backspace'){
        e.preventDefault();
        showExitConfirmModal();
        return;
    }


    focusCurrent();
}); 

// handle history/back
window.addEventListener('popstate', (e)=>{
    if(playerContainer.style.display === 'flex'){
        closePlayer();
    }
}); 

function updateOrientationClass(){
    const w = window.innerWidth, h = window.innerHeight;
    if(w>h) { playerContainer.classList.add('video-landscape'); playerContainer.classList.remove('video-portrait'); }
    else { playerContainer.classList.add('video-portrait'); playerContainer.classList.remove('video-landscape'); }
    
    // Gjithashtu rregullo gridin në resize/orientim
    const cols = window.innerWidth <= 600 ? 3 : (window.innerWidth <= 1024 ? 5 : 7);
    grid.style.gridTemplateColumns = `repeat(${cols}, ${window.innerWidth <= 600 ? '100px' : '120px'})`;
}
window.addEventListener('resize', updateOrientationClass);
window.addEventListener('orientationchange', updateOrientationClass); 

// initial load
loadCategory(currentCategory); 

// INICIALIZIMI I WIDGET-IT TË MOTIT/ORËS
updateClock(); 
loadSuharekeWeather(); 

// Përditësojmë Orën çdo minutë (60000ms)
setInterval(updateClock, 60000); 
// Përditësojmë Motin çdo 10 minuta (600000ms)
setInterval(loadSuharekeWeather, 600000); 

</script>
