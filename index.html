<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TV App UI</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body { background:#3f4451; font-family:'Rubik',sans-serif; color:#fff; margin:0; padding:40px; }
  .categories { display:flex; gap:20px; margin-bottom:40px; }
  .cat-btn { background:#6246B8; color:#fff; padding:15px 28px; border-radius:12px; font-weight:500; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.45); transition:.2s cubic-bezier(0,-0.5,0,3); }
  .cat-btn:focus, .cat-btn:hover { box-shadow:0 12px 40px rgba(0,0,0,.5); transform:translateY(-2px); outline:none; }
  .cat-btn:active { transform:translateY(2px); }

  .grid { display:grid; grid-template-columns:repeat(7,120px); gap:20px; }
  .channel { width:120px; height:120px; background:#fff; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,.5); display:flex; justify-content:center; align-items:center; cursor:pointer; transition:.2s cubic-bezier(0,-0.5,0,3); }
  .channel:focus, .channel:hover { transform:translateY(-2px); box-shadow:0 12px 40px rgba(0,0,0,.55); outline:none; }
  .channel:active { transform:translateY(2px); }
  .channel img { width:80%; height:80%; object-fit:contain; }

  #playerContainer {
    position:fixed;
    inset:0;
    background:#000;
    display:none;
    z-index:999999;
    align-items:center;
    justify-content:center;
  }
</style>
</head>
<body>

  <div class="categories" id="categories"></div>
  <div class="grid" id="grid"></div>

  <div id="playerContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>

// FULL CHANNEL DATABASE ----------------------------------------

const categories = ["LIVE TV","FILMA","SPORT","FEMIJE","DOKU"];

const channelsByCategory = {

  "LIVE TV": [
    { name:"TOP CHANNEL", logo:"https://vimg.ipko.tv/logo/color/topchanel.png", url:"https://cf.business-cdn.me/live/FrancescoFili/e76dc66304/1221574.m3u8" },
    { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png", url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
    { name:"RTK 3", logo:"http://vimg.ipko.tv/logo/color/rtk3.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },

    { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png", url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
    { name:"VIZION PLUS", logo:"https://vimg.ipko.tv/logo/color/vizionplus.png", url:"http://tringliveviz.akamaized.net/delta/105/out/u/qwaszxerdfcvrtryuy.m3u8" },

    { name:"RTK 3", logo:"http://vimg.ipko.tv/logo/color/rtk3.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },
    { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png", url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
    { name:"KTV", logo:"http://vimg.ipko.tv/logo/color/ktv.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/lj9-pxm-o53-rp0/tracks-v4a1/mono.ts.m3u8" }
  ],

  "FILMA": [
    { name:"Cinema 1", logo:"https://via.placeholder.com/120x120?text=C1", url:"" },
    { name:"Cinema 2", logo:"https://via.placeholder.com/120x120?text=C2", url:"" },
    { name:"Cinema 3", logo:"https://via.placeholder.com/120x120?text=C3", url:"" },
    { name:"Cinema 4", logo:"https://via.placeholder.com/120x120?text=C4", url:"" }
  ],

  "SPORT": [
    { name:"Sport 1", logo:"https://via.placeholder.com/120x120?text=S1", url:"" },
    { name:"Sport 2", logo:"https://via.placeholder.com/120x120?text=S2", url:"" },
    { name:"Sport 3", logo:"https://via.placeholder.com/120x120?text=S3", url:"" },
    { name:"Sport 4", logo:"https://via.placeholder.com/120x120?text=S4", url:"" }
  ],

    { name:"DISNEY JUNIOR", logo:"https://via.placeholder.com/120x120?text=DJ",

      url:"http://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/6380c94947c72b0007ee9a13/master.m3u8" },

    { name:"NARUTO", logo:"https://via.placeholder.com/120x120?text=N", 
      url:"http://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/65d5fc39a25d5e00082895c4/master.m3u8" }

      url:"https://fl1.moveonjoy.com/National_Geographic/index.m3u8" },

    { name:"NAT GEO WILD", logo:"https://via.placeholder.com/120x120?text=NGW", 
      url:"https://fl1.moveonjoy.com/Nat_Geo_Wild/index.m3u8" },

      url:"https://fl1.moveonjoy.com/history_channel/index.m3u8" },

      url:"http://cfd-v4-service-channel-stitcher-use1-1.prd.pluto.tv/stitch/hls/channel/5c12ba66eae03059cbdc77f2/master.m3u8" }
  ]

};

// RENDER UI -----------------------------------------------------

const catWrap = document.getElementById("categories");
const grid = document.getElementById("grid");
const playerContainer = document.getElementById("playerContainer");
let hls = null;

let currentCategory = "LIVE TV";

categories.forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "cat-btn";
  btn.textContent = cat;
  btn.onclick = () => loadCategory(cat);
  catWrap.appendChild(btn);
});

function loadCategory(cat){
  grid.innerHTML = "";
  channelsByCategory[cat].forEach(ch => {
    const box = document.createElement("button");
    box.className = "channel";
    box.innerHTML = `<img src="${ch.logo}" alt="${ch.name}">`;
    box.onclick = () => openPlayer(ch);
    grid.appendChild(box);
  });
}
loadCategory(currentCategory);


// FIXED FULLSCREEN VIDEO ENGINE --------------------------------

function openPlayer(ch){
  const url = ch.url;
  if(!url) return;

  history.pushState({player:true}, "");

  playerContainer.style.display = "flex";
  playerContainer.innerHTML = "";

  if(hls){ hls.destroy(); hls = null; }

  const video = document.createElement("video");
  video.autoplay = true;
  video.controls = false;
  video.playsInline = true;

  // FULLSCREEN FIX
  video.style.width = "100vw";
  video.style.height = "100vh";
  video.style.objectFit = "cover";
  video.style.background = "#000";

  playerContainer.appendChild(video);

  if(Hls.isSupported()){
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
  } else {
    video.src = url;
  }

  const fs = playerContainer.requestFullscreen
         || playerContainer.webkitRequestFullscreen;
  if(fs) fs.call(playerContainer);
}

window.addEventListener("popstate", () => {
  playerContainer.style.display = "none";
  playerContainer.innerHTML = "";
  if(hls){ hls.destroy(); hls = null; }
});

</script>

</body>
</html>
