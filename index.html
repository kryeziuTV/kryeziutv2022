<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>TV App UI with JWPlayer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background: #3f4451;
      font-family: 'Rubik', sans-serif;
      color: #fff;
      margin: 0;
      padding: 40px;
      overflow: hidden; /* prevent arrow keys from scrolling page */
    }
    .categories {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
    }
    .cat-btn {
      background: #6246B8;
      color: #fff;
      padding: 15px 28px;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .45);
      transition: .2s cubic-bezier(0, -0.5, 0, 3);
    }
    .cat-btn:focus,
    .cat-btn:hover {
      box-shadow: 0 12px 40px rgba(0, 0, 0, .5);
      transform: translateY(-2px);
      outline: none;
    }
    .cat-btn:active {
      transform: translateY(2px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 120px);
      gap: 20px;
    }
    .channel {
      width: 120px;
      height: 120px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .5);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: .2s cubic-bezier(0, -0.5, 0, 3);
    }
    .channel:focus,
    .channel:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .55);
      outline: none;
    }
    .channel:active {
      transform: translateY(2px);
    }
    .channel img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }

    /* JWPlayer container fullscreen styling */
    #playerContainer {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      z-index: 99999;
      align-items: center;
      justify-content: center;
    }
    #playerContainer #jwplayer {
      width: 100vw;
      height: 100vh;
    }
  </style>

  <!-- Include JWPlayer library -->
  <!-- Replace path below with your hosted jwplayer.js -->
  <script src="path/to/your/jwplayer.js"></script>
  <!-- Your JW Player license key -->
  <script>
    jwplayer.key = "YOUR_JWPLAYER_LICENSE_KEY";
  </script>

</head>
<body>
  <div class="categories" id="categories" role="toolbar" aria-label="Categories"></div>
  <div class="grid" id="grid" role="grid"></div>

  <!-- JWPlayer player container -->
  <div id="playerContainer">
    <div id="jwplayer">Loading…</div>
  </div>

<script>
  // --- data ---
  const categories = ["LIVE TV","FILMA","SPORT","FEMIJE","DOKU"];
  const channelsByCategory = {
    "LIVE TV": [
      { name:"TOP CHANNEL", logo:"https://vimg.ipko.tv/logo/color/topchanel.png", url:"https://cf.business-cdn.me/live/FrancescoFili/e76dc66304/1221574.m3u8" },
      { name:"RTK 1", logo:"http://vimg.ipko.tv/logo/color/rtk1.png", url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8" },
      { name:"RTK 3", logo:"http://vimg.ipko.tv/logo/color/rtk3.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8" },
      { name:"KTV", logo:"http://vimg.ipko.tv/logo/color/ktv.png", url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/lj9-pxm-o53-rp0/tracks-v4a1/mono.ts.m3u8" }
    ],
    "FILMA": [ { name:"Cinema 1", logo:"https://via.placeholder.com/120x120?text=C1", url:"" }, { name:"Cinema 2", logo:"https://via.placeholder.com/120x120?text=C2", url:"" }, { name:"Cinema 3", logo:"https://via.placeholder.com/120x120?text=C3", url:"" } ],
    "SPORT": [ { name:"Sport+", logo:"https://via.placeholder.com/120x120?text=S+", url:"" }, { name:"Arena", logo:"https://via.placeholder.com/120x120?text=A", url:"" } ],
    "FEMIJE": [ { name:"Kids 1", logo:"https://via.placeholder.com/120x120?text=K1", url:"" }, { name:"Kids 2", logo:"https://via.placeholder.com/120x120?text=K2", url:"" } ],
    "DOKU": [ { name:"Doku 1", logo:"https://via.placeholder.com/120x120?text=D1", url:"" }, { name:"Doku 2", logo:"https://via.placeholder.com/120x120?text=D2", url:"" } ]
  };

  // --- DOM refs ---
  const catWrap = document.getElementById('categories');
  const grid = document.getElementById('grid');
  const playerContainer = document.getElementById('playerContainer');
  let player = null;
  let currentCategory = 'LIVE TV';

  // --- render categories UI ---
  categories.forEach((cat, ci) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.textContent = cat;
    btn.setAttribute('data-cat', cat);
    btn.tabIndex = 0;
    btn.onclick = () => loadCategory(cat);
    btn.onfocus = () => { focusedArea = 'cats'; catFocus = ci; };
    catWrap.appendChild(btn);
  });

  // render channels grid
  function loadCategory(cat) {
    currentCategory = cat;
    grid.innerHTML = '';
    const list = channelsByCategory[cat] || [];
    list.forEach((ch, idx) => {
      const box = document.createElement('button');
      box.className = 'channel';
      box.tabIndex = 0;
      box.setAttribute('data-idx', idx);
      box.innerHTML = `<img src="${ch.logo}" alt="${ch.name}" />`;
      box.onclick = () => openPlayerForChannel(ch);
      box.onfocus = () => { focusedArea = 'grid'; gridFocus = idx; };
      grid.appendChild(box);
    });
    catFocus = categories.indexOf(cat) >= 0 ? categories.indexOf(cat) : 0;
    gridFocus = 0;
    focusedArea = 'cats';
    focusCurrent();
  }

  // --- navigation / focus ---
  let focusedArea = 'cats'; // 'cats' or 'grid'
  let catFocus = 0;
  let gridFocus = 0;
  const GRID_COLS = 7;

  function focusCurrent() {
    if (focusedArea === 'cats') {
      const cats = catWrap.querySelectorAll('.cat-btn');
      cats[catFocus]?.focus();
    } else {
      const items = grid.querySelectorAll('.channel');
      items[gridFocus]?.focus();
    }
  }

  document.addEventListener('keydown', (e) => {
    // if JWPlayer is open, only listen for close keys
    if (playerContainer.style.display === 'flex') {
      if (e.key === 'Backspace' || e.key === 'Escape') {
        closePlayer();
        history.back();
      }
      return;
    }

    if (e.key === 'ArrowRight') {
      if (focusedArea === 'cats') catFocus = Math.min(catFocus + 1, categories.length - 1);
      else gridFocus = gridFocus + 1;
    }
    if (e.key === 'ArrowLeft') {
      if (focusedArea === 'cats') catFocus = Math.max(catFocus - 1, 0);
      else gridFocus = Math.max(gridFocus - 1, 0);
    }
    if (e.key === 'ArrowDown') {
      if (focusedArea === 'cats') {
        focusedArea = 'grid';
        gridFocus = catFocus;
      } else {
        gridFocus = gridFocus + GRID_COLS;
      }
    }
    if (e.key === 'ArrowUp') {
      if (focusedArea === 'grid') {
        if (gridFocus < GRID_COLS) {
          focusedArea = 'cats';
          catFocus = Math.min(gridFocus, categories.length - 1);
        } else {
          gridFocus = gridFocus - GRID_COLS;
        }
      }
    }

    const gridItems = grid.querySelectorAll('.channel');
    if (gridFocus >= gridItems.length) gridFocus = gridItems.length - 1;
    if (gridFocus < 0) gridFocus = 0;

    if (e.key === 'Enter') {
      if (focusedArea === 'cats') loadCategory(categories[catFocus]);
      else grid.querySelectorAll('.channel')[gridFocus]?.click();
    }

    focusCurrent();
  });

  // --- JWPlayer handling ---
  function openPlayerForChannel(ch) {
    const url = ch.url;
    if (!url) return;

    // push history so back button returns
    history.pushState({ player: true }, 'player');

    // prepare UI
    playerContainer.style.display = 'flex';

    // setup jwplayer
    // If player already exists, we can just load new source
    if (!player) {
      player = jwplayer('jwplayer').setup({
        sources: [
          { file: url, type: 'hls' }
        ],
        width: "100%",
        height: "100%",
        autostart: true,
        mute: false,
        stretching: "uniform", // maintain aspect ratio, fit inside container
        skin: { name: "seven" }  // or another skin if you like
      });
    } else {
      player.load([{ file: url, type: 'hls' }]);
      player.play();
    }

    // try fullscreen
    try {
      const container = document.getElementById('jwplayer');
      const req = container.requestFullscreen || container.webkitRequestFullscreen || container.msRequestFullscreen;
      req && req.call(container);
    } catch (e) {
      console.warn("Fullscreen request failed", e);
    }
  }

  function closePlayer() {
    if (player) {
      player.pause();
    }
    playerContainer.style.display = 'none';
  }

  window.addEventListener('popstate', (e) => {
    if (playerContainer.style.display === 'flex') {
      closePlayer();
    }
  });

  window.addEventListener('keydown', (e) => {
    if ((e.key === 'Escape' || e.key === 'Backspace') && playerContainer.style.display === 'flex') {
      history.back();
    }
  });

  // initial load
  loadCategory(currentCategory);
</script>
</body>
</html>
