<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>TV App UI</title>
<style>
  body {
    background:#3f4451;
    font-family:'Rubik',sans-serif;
    color:#fff;
    margin:0;
    padding:40px;
    overflow:hidden;
  }
  .top-right-clock {
    position:fixed;
    top:15px;
    right:25px;
    font-size:22px;
    font-weight:500;
    opacity:.9;
  }
  .categories {display:flex;gap:20px;margin-bottom:40px;}
  .cat-btn {
    background:#6246B8;
    color:#fff;
    padding:15px 40px;
    border-radius:12px;
    font-weight:500;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.45);
    transition:.2s cubic-bezier(0,-0.5,0,3);
  }
  .cat-btn:focus {
    outline:4px solid #fff;
    box-shadow:0 0 25px #bfa4ff;
  }
  .cat-btn:hover {transform:translateY(-2px);} 
  .grid {display:grid;grid-template-columns:repeat(7,120px);gap:20px;}

  .channel {
    width:120px;height:120px;
    background:#fff;border-radius:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
    display:flex;justify-content:center;align-items:center;
    cursor:pointer;
    transition:.2s cubic-bezier(0,-0.5,0,3);
  }
  .channel:focus {
    outline:4px solid #6246B8;
    box-shadow:0 0 25px #bfa4ff;
  }
  .channel img {width:80%;height:80%;object-fit:contain;}

  #playerWrapper {
    position:fixed;inset:0;background:black;display:none;z-index:9999;
  }
  #playerWrapper video {width:100%;height:100%;object-fit:contain;pointer-events:none;}
</style>
</head>
<body>
<div class="top-right-clock" id="clock"></div>
<div class="categories" id="categories"></div>
<div class="grid" id="grid"></div>

<div id="playerWrapper"><video id="player"></video></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const categories=["LIVE TV","FILMA","SPORT","FEMIJE","DOKU"];

const channelsByCategory={
  "LIVE TV":[
    {name:"RTK 1",logo:"http://vimg.ipko.tv/logo/color/rtk1.png",url:"http://gjvideo-live-xk.gjirafa.net/gjvideo-livestream/98r-d35-487-v6m/tracks-v4a1/mono.ts.m3u8"},
    {name:"RTK 3",logo:"http://vimg.ipko.tv/logo/color/rtk3.png",url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/rtk3/tracks-v4a1/mono.ts.m3u8"},
    {name:"KTV",logo:"http://vimg.ipko.tv/logo/color/ktv.png",url:"http://gjirafa-video-live.gjirafa.net/gjvideo-livestream/lj9-pxm-o53-rp0/tracks-v4a1/mono.ts.m3u8"}
  ],
  "FILMA":[{name:"Cinema 1",logo:"https://via.placeholder.com/120?text=C1",url:""}]
};

const catWrap=document.getElementById("categories");
const grid=document.getElementById("grid");

let currentCategory="LIVE TV";
let currentChannelIndex=0;

categories.forEach(cat=>{
  const b=document.createElement("div");
  b.className="cat-btn";
  b.textContent=cat;
  b.tabIndex=0;
  b.onclick=()=>loadCategory(cat);
  catWrap.appendChild(b);
});

function loadCategory(cat){
  currentCategory=cat;
  grid.innerHTML="";
  channelsByCategory[cat].forEach((c,i)=>{
    const box=document.createElement("div");
    box.className="channel";
    box.tabIndex=0;
    box.innerHTML=`<img src="${c.logo}">`;
    box.onclick=()=>playChannel(i);
    grid.appendChild(box);
  });
  focusIndex=0;
  focusItem(0);
}

const playerWrapper=document.getElementById("playerWrapper");
const player=document.getElementById("player");
let hls;

function playChannel(i){
  currentChannelIndex=i;
  const obj=channelsByCategory[currentCategory][i];
  const url=obj.url;

  if(hls){hls.destroy();}
  if(Hls.isSupported()){
    hls=new Hls();
    hls.loadSource(url);
    hls.attachMedia(player);
  } else {
    player.src=url;
  }
  player.muted=false;
  playerWrapper.style.display="block";
  player.play();
  if(player.requestFullscreen) player.requestFullscreen();
  try{screen.orientation.lock('landscape');}catch(e){}
}

function channelUp(){
  const list=channelsByCategory[currentCategory];
  currentChannelIndex=(currentChannelIndex+1)%list.length;
  playChannel(currentChannelIndex);
}
function channelDown(){
  const list=channelsByCategory[currentCategory];
  currentChannelIndex=(currentChannelIndex-1+list.length)%list.length;
  playChannel(currentChannelIndex);
}

document.addEventListener("keydown",e=>{
  if(playerWrapper.style.display==="block"){
    if(e.key==="ArrowUp") channelUp();
    if(e.key==="ArrowDown") channelDown();
    if(e.key==="Backspace"||e.key==="Escape"){playerWrapper.style.display="none";player.pause();}
    return;
  }

  const items=[...document.querySelectorAll('.cat-btn'),...document.querySelectorAll('.channel')];
  const channelStart=categories.length;

  if(e.key==="ArrowRight") focusItem(focusIndex+1);
  if(e.key==="ArrowLeft") focusItem(focusIndex-1);
  if(e.key==="ArrowDown"){
    if(focusIndex<channelStart) focusItem(channelStart);
    else focusItem(focusIndex+7);
  }
  if(e.key==="ArrowUp"){
    if(focusIndex>=channelStart) focusItem(focusIndex-7);
    else focusItem(0);
  }
  if(e.key==="Enter") items[focusIndex].click();
});

let focusIndex=0;
function focusItem(i){
  const items=[...document.querySelectorAll('.cat-btn'),...document.querySelectorAll('.channel')];
  if(i<0||i>=items.length) return;
  items[focusIndex]?.blur();
  focusIndex=i;
  items[i].focus();
}

function updateClock(){
  const el=document.getElementById("clock");
  const d=new Date();
  el.textContent=d.toLocaleDateString()+" | "+d.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

loadCategory("LIVE TV");
</script>
</body>
</html>
