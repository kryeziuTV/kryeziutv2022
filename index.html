<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TV App UI - XTREAM READY - V23</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<style>
    /* --- STILIMET KRYESORE --- */
    body { 
        background: #1e1e1e; 
        font-family:'Rubik',sans-serif; 
        color:#fff; 
        margin:0; 
    } 
    
    /* SFONDI STATIK I IMZHIT - BLUR I LARGUR */
    #background-image {
        position: fixed;
        right: 0;
        bottom: 0;
        min-width: 100%; 
        min-height: 100%;
        width: auto;
        height: auto;
        z-index: -2; 
        object-fit: cover;
        background-image: url("https://i.imgur.com/yeiw0tZ.jpeg");
        background-size: cover;
        background-position: center;
        filter: brightness(0.7); 
    }

    /* --- WIDGET I ORËS DHE MOTIT (POSHTË NË TË DJATHTË) --- */
    #headerWidget {
        position: fixed;
        bottom: 20px; 
        right: 20px; 
        left: auto; 
        top: auto; 
        transform: none; 
        color: #fff;
        text-align: right; 
        z-index: 10;
        display: flex; 
        flex-direction: column; 
        align-items: flex-end; 
        gap: 0; 
        pointer-events: none; 
    } 

    /* KARTELA KRYESORE E WIDGET-IT - TANI PA SFOND DHE HIJE */
    #timeDate {
        display: flex;
        flex-direction: column;
        align-items: flex-end; 
        background: none; 
        padding: 10px 20px; 
        border-radius: 14px; 
        min-width: 200px; 
        box-shadow: none; 
        position: relative; 
    }

    /* Moti i menjëhershëm */
    #weatherSummary {
        display: flex;
        align-items: center;
        justify-content: flex-end; 
        font-size: 1.4em; 
        font-weight: 500; 
        color: rgba(255, 255, 255, 0.9); 
        margin-bottom: 5px; 
        padding: 0; 
        background: none; 
        border-radius: 0;
        min-width: auto; 
        text-align: right;
    }

    /* ORA */
    #currentTime {
        font-size: 3em; 
        font-weight: 700; 
        line-height: 1;
        margin: 0;
        padding: 0; 
        background: none; 
        border-radius: 0;
        box-shadow: none;
        text-align: right; 
    }

    /* DITA DHE DATA */
    #currentDate {
        font-size: 1em; 
        font-weight: 400; 
        margin-top: 5px; 
        line-height: 1.2;
        color: rgba(255, 255, 255, 0.8); 
        background: none; 
        padding: 0; 
        border-radius: 0;
        text-align: right; 
    } 

    /* Vendi/Qyteti (I Fshehur) */
    #weatherCity { display: none; } 

    /* Parashikimi 7-ditor (I FSHEHUR PLOTËSISHT) */
    #weatherInfo { display: none; } 

    /* --- FUNDI I STILIMIT TË WIDGET-IT --- */


    /* KONTEJNERI KRYESOR PËR QENDRËZIM */
    #mainContent {
        display: flex;
        flex-direction: column;
        align-items: center; 
        padding: 40px; 
        background: none; 
        margin-top: 20px; 
    } 

    /* KATEGORITË & GRIDI I KANALEVE */
    .categories { 
        display:flex; 
        gap: 20px; 
        margin-bottom:40px; 
        justify-content: center; 
        width: 100%; 
        padding-top: 0; 
    } 

    /* STILIMI I RI PËR KATEGORITË */
    .cat-btn { 
        background: none; 
        color:#fff; 
        padding:15px 28px; 
        font-size: 1.3em; 
        font-weight: 600; 
        cursor:pointer; 
        transition: transform .15s ease-out; 
        border: none; 
        border-radius: 0;
        position: relative; 
        margin: 0; 
        outline: none;
    }

    /* Vija e bardhë (Indikatori) */
    .cat-btn::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 4px;
        background-color: #fff;
        border-radius: 2px;
        transition: width 0.1s ease-out;
    }

    /* STILIMI I FOKUSIT (VETËM VIZA POSHTË DHE SCALE UP) */
    .cat-btn:focus, .cat-btn.focused { 
        background: none; 
        color: #fff;
        transform: scale(1.05); 
        box-shadow: none; 
    }
    
    .cat-btn:focus::after, .cat-btn.focused::after {
        width: 30px; 
    }

    .cat-btn:active { transform:scale(0.98); } 

    .grid { 
        display:grid; 
        grid-template-columns:repeat(7,120px); 
        gap:20px; 
    } 

    /* --- STILIMI I KANALIT --- */
    .channel { 
        width:120px; 
        height:120px; 
        background: rgba(180, 160, 255, 0.2); 
        border-radius:14px; 
        box-shadow:0 6px 20px rgba(0,0,0,.5); 
        display:flex; 
        flex-direction: column; 
        justify-content:center; 
        align-items:center; 
        cursor:pointer; 
        transition: transform .1s ease-out, box-shadow .1s ease-out, border-color .1s ease-out; 
        border: 3px solid transparent; 
        overflow: hidden; 
        padding: 10px; 
        box-sizing: border-box;
        position: relative; 
    }

    .channel:focus, .channel.focused { 
        transform: scale(1.25); 
        border: 3px solid transparent; 
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8); 
        outline:none; 
    }
    .channel:active { transform:scale(0.98); } 

    /* Vija e bardhë në fund (Indikatori) */
    .channel-indicator {
        position: absolute;
        bottom: 5px; 
        left: 50%; 
        transform: translateX(-50%);
        width: 40px; 
        height: 4px; 
        background-color: transparent; 
        transition: background-color 0.1s ease-out;
        border-radius: 2px;
        z-index: 2; 
    }

    /* Shfaqet vetëm kur është fokusuar */
    .channel:focus .channel-indicator, .channel.focused .channel-indicator {
        background-color: #ffffff;
    }

    .channel img { 
        max-width: 90%; 
        max-height: 90%; 
        object-fit: contain; 
        filter: saturate(1); 
        transition: filter 0.1s, transform 0.1s; 
    } 

    .channel:focus img, .channel.focused img { 
        filter: saturate(1.2); 
        transform: none; 
    }

    /* --- FUNDI I STILIMIT TË KANALIT --- */

    /* PLAYER CONTAINER (pa ndryshime) */
    #playerContainer { 
        position:fixed; 
        inset:0; 
        background:#000; 
        display:none; 
        z-index:99999; 
        align-items:center; 
        justify-content:center; 
    }
    #playerContainer video { 
        width:100vw; 
        height:100vh; 
        object-fit:contain; 
        outline:none; 
        border:0; 
        pointer-events:none; 
    } 

    /* Info Bar (pa ndryshime) */
    #infoBar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 60px; 
        background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0)); 
        padding: 10px 40px 10px 40px; 
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        opacity: 0;
        pointer-events: none;
        transform: translateY(100%); 
        transition: opacity 0.5s, transform 0.5s ease-out; 
        z-index: 99999;
        justify-content: center; 
    } 

    #infoBar.visible {
        opacity: 1;
        transform: translateY(0%);
    } 

    .channel-title {
        font-size: 2.2em;
        font-weight: 700;
        color: #fff;
        line-height: 1;
    } 

    /* Loading/Error Overlay (pa ndryshime) */
    #loadingOverlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none; 
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100000; 
    } 
    #loadingOverlay .message {
        font-size: 1.5em;
        font-weight: 500;
        color: #fff;
        margin-top: 20px;
    } 
    .spinner {
        border: 5px solid rgba(255, 255, 255, 0.3);
        border-top: 5px solid #6246B8;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
    } 
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    } 
    .error-text {
        color: #ff4d4f; 
        font-weight: bold;
    } 

    /* --- MENYJA ANËSORE (E Shpejtë - pa ndryshime) --- */
    #channelMenu {
        position: absolute;
        top: 0;
        left: 0;
        height: 100vh; 
        width: 350px; 
        padding: 20px 0;
        background: rgba(0, 0, 0, 0.95); 
        border-right: 1px solid rgba(255, 255, 255, 0.1); 
        overflow-y: auto; 
        overflow-x: hidden;
        display: none; 
        z-index: 100001; 
        scroll-behavior: auto; 
        transform: translateX(-100%); 
    } 

    #channelMenu.active {
        transform: translateX(0);
    }

    .menu-channel-item {
        padding: 20px 25px; 
        color: #fff; 
        font-size: 1.3em; 
        font-weight: 500;
        cursor:pointer;
        transition: background-color 0.05s, transform 0.05s, box-shadow 0.05s; 
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center; 
        gap: 20px; 
        border-left: 5px solid transparent; 
    } 

    .menu-channel-number {
        font-weight: 700; 
        color: #6246B8; 
        font-size: 1.5em; 
        width: 45px; 
        text-align: right;
    } 

    .menu-channel-item.focused {
        background-color: rgba(65, 105, 225, 0.3); 
        border-left-color: #4169e1; 
        color: #fff;
        transform: scale(1.03);
        box-shadow: 
            0 0 10px rgba(65, 105, 225, 0.3),
            5px 0 15px rgba(0, 0, 0, 0.5); 
        border-top-right-radius: 8px;
        border-bottom-right-radius: 8px;
    } 

    .menu-channel-item:focus {
        outline: none; 
    }
    /* --- FUNDI I STILIMIT TË MENUSË ANËSORE --- */


    /* --- XTREAM LOGIN FORM STILIMET --- */
    #xtreamLoginForm {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        display: none; /* Fshehur fillimisht */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        padding: 20px;
    }

    #xtreamLoginForm.visible {
        display: flex;
    }

    .form-box {
        background: #2a2a2a;
        padding: 40px;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 500px;
    }

    .form-box h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #fff;
        font-weight: 700;
        font-size: 2em;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #ccc;
    }

    .input-group input {
        width: 100%;
        padding: 15px;
        border: 2px solid #3e3e3e;
        border-radius: 8px;
        background: #1e1e1e;
        color: #fff;
        font-size: 1.1em;
        box-sizing: border-box;
        transition: border-color 0.1s;
        outline: none;
    }

    .input-group input:focus, .input-group input.focused {
        border-color: #6246B8;
        box-shadow: 0 0 10px rgba(98, 70, 184, 0.5);
    }

    .form-actions {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 30px;
    }

    .form-actions button {
        flex-grow: 1;
        padding: 15px;
        border: none;
        border-radius: 8px;
        font-size: 1.2em;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.1s, opacity 0.1s;
        outline: none;
    }

    #xtreamConnectBtn {
        background: #6246B8;
        color: #fff;
    }

    #xtreamClearBtn {
        background: #4a4a4a;
        color: #fff;
    }

    .form-actions button:focus, .form-actions button.focused {
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    
    #xtreamMessage {
        color: #ff4d4f; 
        font-weight: 500;
        text-align: center;
        margin-top: 20px;
        display: none;
    }

    /* Shtojmë stilin e kategorisë XTREAM, nëse do të shfaqet e lidhur */
    .cat-btn[data-cat="XTREAM LOGIN"].linked {
        border-bottom: 4px solid #4CAF50; /* Gjelbër për të treguar lidhjen */
    }
</style>
</head>

    <div id="xtreamLoginForm">

            <div id="xtreamMessage"></div>
            <div class="input-group">
                <label for="xtreamHost">URL e Hostit (p.sh. http://tv.example.com:8080)</label>

            </div>
            <div class="input-group">

                <input type="text" id="xtreamUsername" placeholder="Username" tabindex="2">
            </div>
            <div class="input-group">
                <label for="xtreamPassword">Fjalëkalimi (Password)</label>
                <input type="password" id="xtreamPassword" placeholder="Password" tabindex="3">
            </div>
            <div class="form-actions">
                <button id="xtreamConnectBtn" tabindex="4">Lidhu</button>
                <button id="xtreamClearBtn" tabindex="5">Fshij Të Dhënat</button>
            </div>
        </div>
    </div>

    <div id="playerContainer">
        <div id="loadingOverlay">
            <div class="spinner"></div>
            <div class="message">Po ngarkohet...</div>
        </div> 

        <div id="infoBar">

        </div> 
    </div>

function loadXtreamData() {
    try {
        const data = localStorage.getItem('xtream_login_data');
        if (data) {
            xtreamData = JSON.parse(data);
            if (xtreamData.host && xtreamData.username && xtreamData.password) {
                connectToXtream(true); // Lidhja automatike
            }
        }
    } catch (e) {
        console.error("Gabim në ngarkimin e të dhënave të XTREAM:", e);
        clearXtreamData(false);
    }
}

function saveXtreamData() {
    localStorage.setItem('xtream_login_data', JSON.stringify(xtreamData));
}

function clearXtreamData(reload = true) {
    localStorage.removeItem('xtream_login_data');
    xtreamData = { host: null, username: null, password: null };
    xtreamChannels = [];
    channelsByCategory["XTREAM LOGIN"] = [];
    
    // Përditëso UI
    const xtreamCatBtn = document.querySelector('.cat-btn[data-cat="XTREAM LOGIN"]');
    if (xtreamCatBtn) {
        xtreamCatBtn.classList.remove('linked');
    }
    
    if (currentCategory === "XTREAM LOGIN") {
        loadCategory("XTREAM LOGIN");
    }
    
    if (reload) {
         alert("Të dhënat e XTREAM u fshinë. Ju lutemi, rifreskoni kategorinë.");
    }
    
    updateAllChannelsList();
}

function generateM3UUrl(host, username, password) {
    if (!host || !username || !password) return null;
    
    let baseUrl = host.trim();
    if (!baseUrl.startsWith('http')) {
        baseUrl = 'http://' + baseUrl;
    }
    
    if (baseUrl.endsWith('/')) {
        baseUrl = baseUrl.slice(0, -1);
    }
    
    const url = `${baseUrl}/get.php?username=${username}&password=${password}&type=m3u_plus&output=ts`;
    
    return url;
}

async function connectToXtream(isAuto = false) {
    const host = xtreamHostInput.value.trim();
    const username = xtreamUsernameInput.value.trim();
    const password = xtreamPasswordInput.value.trim();
    
    if (!isAuto && (!host || !username || !password)) {
        xtreamMessage.textContent = "Ju lutemi, plotësoni të gjitha fushat.";
        xtreamMessage.style.display = 'block';
        return;
    }
    
    if (!isAuto) {
        xtreamData.host = host;
        xtreamData.username = username;
        xtreamData.password = password;
        saveXtreamData();
        
        xtreamMessage.textContent = "Po provohet lidhja...";
        xtreamMessage.style.display = 'block';
        xtreamConnectBtn.disabled = true;
    }
    
    const url = generateM3UUrl(xtreamData.host, xtreamData.username, xtreamData.password);
    
    try {
        const response = await fetch(url);
        if (!response.ok) {
             throw new Error("Përgjigje e gabuar nga hosti. Kod: " + response.status);
        }
        
        const m3uContent = await response.text();
        
        xtreamChannels = parseM3U(m3uContent, xtreamData.host, xtreamData.username, xtreamData.password);
        
        channelsByCategory["XTREAM LOGIN"] = xtreamChannels;
        
        const xtreamCatBtn = document.querySelector('.cat-btn[data-cat="XTREAM LOGIN"]');
        if (xtreamCatBtn) {
            xtreamCatBtn.classList.add('linked');
        }
        
        updateAllChannelsList(); 
        
        if (!isAuto) {
            xtreamMessage.textContent = `Lidhja u realizua me sukses! U gjetën ${xtreamChannels.length} kanale.`;
            xtreamMessage.style.color = '#4CAF50';
            setTimeout(() => {
                xtreamLoginForm.classList.remove('visible');
                xtreamMessage.style.display = 'none';
                xtreamMessage.style.color = '#ff4d4f';
                loadCategory("XTREAM LOGIN");
            }, 1000);
        } else {
            console.log(`Lidhja automatike XTREAM sukses. U gjetën ${xtreamChannels.length} kanale.`);
        }
        
    } catch (error) {
        console.error("Gabim në lidhjen e XTREAM:", error);
        clearXtreamData(false); 
        if (!isAuto) {
            xtreamMessage.textContent = "Gabim në lidhje. Kontrolloni të dhënat dhe URL.";
            xtreamMessage.style.display = 'block';
        }
    } finally {
        if (!isAuto) {
            xtreamConnectBtn.disabled = false;
        }
    }
}

function parseM3U(m3uContent, host, username, password) {
    const lines = m3uContent.split('\n');
    const channels = [];
    let currentChannel = null;
    let channelNumber = 0; 
    
    let baseUrl = host.trim();
    if (!baseUrl.startsWith('http')) {
        baseUrl = 'http://' + baseUrl;
    }
    if (baseUrl.endsWith('/')) {
        baseUrl = baseUrl.slice(0, -1);
    }

    for (const line of lines) {
        const trimmedLine = line.trim();
        
        if (trimmedLine.startsWith('#EXTINF:')) {
            currentChannel = {};
            const logoMatch = trimmedLine.match(/tvg-logo="([^"]+)"/i);
            const nameMatch = trimmedLine.match(/,(.*)/);
            
            currentChannel.name = nameMatch ? nameMatch[1].trim() : "Kanal i Panjohur";
            currentChannel.logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/120x120?text=XTREAM';
            currentChannel.category = "XTREAM LOGIN";
            
        } else if (currentChannel && trimmedLine.startsWith('http')) {
             if(trimmedLine.includes('/live/') || trimmedLine.includes('/movie/') || trimmedLine.includes('/series/')) {
                 currentChannel.url = trimmedLine;
             } else {
                 currentChannel.url = trimmedLine;
             }
             
             channelNumber++;
             currentChannel.number = channelNumber;
             channels.push(currentChannel);
             currentChannel = null;
        }
    }
    return channels;
}

function updateAllChannelsList() {
    allChannelsList.length = 0; 
    let counter = 0;
    
    // Shto kanalet statike
    categories.filter(c => c !== "XTREAM LOGIN").forEach(categoryName => {
        const list = channelsByCategory[categoryName] || [];
        list.forEach(channel => {
            channel.fullIndex = counter;
            channel.number = counter + 1;
            channel.category = categoryName;
            allChannelsList.push(channel);
            counter++;
        });
    });
    
    // Shto kanalet e XTREAM
    channelsByCategory["XTREAM LOGIN"].forEach(channel => {
        channel.fullIndex = counter;
        channel.number = counter + 1;
        channel.category = "XTREAM LOGIN";
        allChannelsList.push(channel);
        counter++;
    });
    
    MAX_CHANNEL_INDEX = allChannelsList.length - 1;
}

function loadCategory(cat){
    currentCategory = cat;
    grid.innerHTML = '';
    
    // LOGJIKA E RE PËR XTREAM LOGIN
    if (cat === 'XTREAM LOGIN') {
        if (!xtreamData.host || channelsByCategory[cat].length === 0) {
            toggleXtreamForm();
            return;
        }
    }
    
    const list = channelsByCategory[cat] || [];
    list.forEach((ch,idx)=>{
        const box = document.createElement('button');
        box.className = 'channel';
        box.tabIndex = 0;
        box.setAttribute('data-idx', idx);
        
        const logo = document.createElement('img');
        logo.src = ch.logo;
        logo.alt = ch.name;
        box.appendChild(logo);
        
        const indicator = document.createElement('div');
        indicator.className = 'channel-indicator';
        box.appendChild(indicator);

        box.onclick = ()=> openPlayerForChannel(ch);
        box.onfocus = ()=> { focusedArea = 'grid'; gridFocus = idx; } 
        grid.appendChild(box);
    });
    
    catFocus = categories.indexOf(cat) >= 0 ? categories.indexOf(cat) : 0;
    gridFocus = 0;
    focusedArea = 'cats';
    focusCurrent();
} 

function focusCurrent(){
    if (currentFocusedElement) {
        currentFocusedElement.classList.remove('focused');
    }

    let targetElement = null;
    
    if(focusedArea === 'cats'){
        const cats = catWrap.querySelectorAll('.cat-btn');
        if (cats[catFocus]) {
            targetElement = cats[catFocus];
        }
    } else if (focusedArea === 'grid') {
        const items = grid.querySelectorAll('.channel');
        if (items[gridFocus]) {
            targetElement = items[gridFocus];
        }
    }
    
    if (targetElement) {
        targetElement.classList.add('focused');
        targetElement.focus(); 
        currentFocusedElement = targetElement;
    }
}

function getWeatherDescription(code) {
    if (code === 0) return { description: "Diell i pastër", emoji: "☀️" };
    if (code === 1) return { description: "Kryesisht diell", emoji: "🌤️" };
    if (code === 2) return { description: "Pjesërisht i vranët", emoji: "⛅️" };
    if (code === 3) return { description: "Moti i vranët", emoji: "☁️" };
    if (code === 45 || code === 48) return { description: "Mjegull", emoji: "🌫️" };
    if (code >= 51 && code <= 55) return { description: "Shi i lehtë", emoji: "🌦️" };
    if (code >= 61 && code <= 65) return { description: "Shi i fortë", emoji: "🌧️" };
    if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86) || code === 66 || code === 67) {
        return { description: "Borë", emoji: "❄️" };
    }
    if (code >= 80 && code <= 82) return { description: "Stuhi me shi", emoji: "⛈️" };
    if (code >= 95 && code <= 99) return { description: "Stuhi", emoji: "🌩️" };
    if (code >= 50 && code <= 89) {
        return { description: "I Lagësht/Shi", emoji: "💧" }; 
    }
    return { description: "Moti i Panjohur", emoji: "❓" }; 
} 

function updateClock() {
    const now = new Date();
    const timeString = now.toLocaleTimeString('sq-AL', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    const dateString = now.toLocaleDateString('sq-AL', { weekday: 'long', day: 'numeric', month: 'long' });
    
    document.getElementById('currentTime').textContent = timeString;
    document.getElementById('currentDate').textContent = dateString;
} 

async function fetchWeather(lat, lon, cityName) {
    const weatherSummary = document.getElementById('weatherSummary');
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`; 

    try {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`Gabim HTTP: ${response.status}`);
        }
        const data = await response.json(); 

        const currentTemp = Math.round(data.current.temperature_2m);
        const currentCode = data.current.weather_code;
        const currentWeatherDesc = getWeatherDescription(currentCode);
        
        weatherSummary.innerHTML = `${currentWeatherDesc.emoji} ${currentTemp}°C`; 
        
    } catch (error) {
        console.error("Gabim në marrjen e motit:", error);
        weatherSummary.innerHTML = `❓ --°C`;
    }
}

function updateLoadingState(state, channelName = null) {
    const overlay = document.getElementById('loadingOverlay');
    const spinner = overlay.querySelector('.spinner');
    const message = overlay.querySelector('.message'); 

    if (!overlay) return; 

    if (state === 'loading') {
        spinner.style.display = 'block';
        message.classList.remove('error-text');
        message.textContent = 'Po ngarkohet...';
        overlay.style.display = 'flex';
    } else if (state === 'error') {
        spinner.style.display = 'none';
        message.classList.add('error-text');
        message.textContent = `Kanali nuk punon: ${channelName || 'Pritet lidhja'}`;
        overlay.style.display = 'flex';
    } else if (state === 'hidden') {
        overlay.style.display = 'none';
    }
} 

function centerMenuFocus(menuItems, index) {
    const channelMenu = document.getElementById('channelMenu');
    const focusedItem = menuItems[index]; 

    if (!focusedItem || !channelMenu) return; 

    const itemHeight = focusedItem.offsetHeight; 
    const menuHeight = channelMenu.clientHeight; 
    const targetScrollTop = focusedItem.offsetTop - (menuHeight / 2) + (itemHeight / 2); 

    channelMenu.scrollTo({ 
        top: targetScrollTop, 
        behavior: 'auto' 
    });
} 

function toggleChannelMenu(){
    const channelMenu = document.getElementById('channelMenu');
    if (!channelMenu) return; 

    isMenuVisible = !isMenuVisible;
    
    if(isMenuVisible) {
        channelMenu.classList.add('active'); 
        channelMenu.style.display = 'block';
    } else {
        channelMenu.classList.remove('active');
        channelMenu.style.display = 'none';
    }
    
    if (isMenuVisible) {
        const items = channelMenu.querySelectorAll('.menu-channel-item');
        if(items.length > 0) {
            items.forEach(i => i.classList.remove('focused')); 
            menuFocusIndex = Math.min(Math.max(0, currentChannelIndex), items.length - 1); 
            items[menuFocusIndex].classList.add('focused');
            centerMenuFocus(items, menuFocusIndex); 
        }
    }
} 

function switchChannel(ch){
    if(!ch.url) return;
    
    if (ch.fullIndex === currentChannelIndex && isMenuVisible) {
        toggleChannelMenu(); 
        return; 
    }
    
    if (isMenuVisible) {
        toggleChannelMenu(); 
    }
    
    currentChannelIndex = ch.fullIndex; 
    menuFocusIndex = ch.fullIndex; 

    openPlayerForChannel(ch, true);
}


function openPlayerForChannel(ch, isSwitching = false){
    const url = ch.url;
    if(!url) {
        if (!isSwitching) {
            alert(`Kanali "${ch.name}" nuk ka një URL aktive.`);
        } else {
            updateLoadingState('error', ch.name);
        }
        return;
    }
    
    updateLoadingState('loading');
    showInfoBar(ch); 

    if (ch.fullIndex !== undefined) {
        currentChannelIndex = ch.fullIndex;
        menuFocusIndex = ch.fullIndex;
    } else {
        const foundIndex = allChannelsList.findIndex(channel => channel.url === url);
        if (foundIndex !== -1) {
            currentChannelIndex = foundIndex;
            menuFocusIndex = foundIndex;
        }
    }

    if (!isSwitching) {
        document.body.style.padding = '0';
        document.body.style.overflow = 'hidden';
        document.getElementById('mainContent').style.display = 'none'; 
        history.pushState({player:true}, 'player');
        playerContainer.style.display = 'flex';
    }
    
    if(hls){ try{ hls.destroy(); }catch(e){} hls = null; } 

    let video = document.getElementById('tvplayer');
    let channelMenu = document.getElementById('channelMenu');
    
    if (!video) {
        video = document.createElement('video');
        video.id = 'tvplayer';
        video.autoplay = true;
        video.controls = false; 
        video.muted = false;
        video.setAttribute('playsinline','');
        playerContainer.insertBefore(video, document.getElementById('infoBar')); 

        channelMenu = document.createElement('div');
        channelMenu.id = 'channelMenu';
        playerContainer.appendChild(channelMenu);
        
        updateOrientationClass(); 
    }

    // POPULLO DHE FSHEH MENYNË ANËSORE
    if (!channelMenu) channelMenu = document.getElementById('channelMenu');
    channelMenu.innerHTML = '';
    allChannelsList.forEach((channelData, index) => {
        const item = document.createElement('div');
        item.className = 'menu-channel-item';
        
        const channelNumber = document.createElement('span');
        channelNumber.className = 'menu-channel-number';
        channelNumber.textContent = channelData.number;
        
        const channelName = document.createElement('span');
        channelName.textContent = channelData.name;
        
        item.appendChild(channelNumber);
        item.appendChild(channelName);
        
        item.setAttribute('data-url', channelData.url);
        item.setAttribute('data-index', index);
        item.tabIndex = 0; 
        
        if (index === currentChannelIndex) {
            item.classList.add('focused');
        }
        
        item.onclick = () => switchChannel(channelData); 
        channelMenu.appendChild(item);
    });
    isMenuVisible = false;
    channelMenu.classList.remove('active'); 
    channelMenu.style.display = 'none';


    // Luaj me hls.js
    if(Hls && Hls.isSupported()){
        hls = new Hls({ maxBufferLength: 10 }); 
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function(){ 
            video.play().catch(()=>{}); 
        });
        
        hls.on(Hls.Events.ERROR, function(event, data){
            if (data.fatal) {
                updateLoadingState('error', ch.name);
                console.error('HLS Fatal Error:', data.details);
            }
        });
    } else {
        video.src = url;
        video.play().catch(()=>{});
    } 

    video.onplaying = () => {
        updateLoadingState('hidden');
    };
    video.onerror = () => {
        updateLoadingState('error', ch.name);
    } 

    try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape'); }catch(e){} 
    const req = video.requestFullscreen || video.webkitRequestFullscreen || video.msRequestFullscreen;
    try{ req && req.call(video).catch(()=>{}); }catch(e){}
} 

function closePlayer(){
    document.body.style.padding = '40px';
    document.body.style.overflow = 'auto'; 
    document.getElementById('mainContent').style.display = 'flex'; 
    isMenuVisible = false; 
    
    if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
    const video = document.getElementById('tvplayer');
    if (video) video.remove(); 
    
    const menu = document.getElementById('channelMenu');
    if (menu) {
        menu.classList.remove('active'); 
        menu.style.display = 'none';
    }

    updateLoadingState('hidden'); 
    if (infoBarTimer) {
        clearTimeout(infoBarTimer); 
        document.getElementById('infoBar').classList.remove('visible');
    }
    if (digitTimer) clearTimeout(digitTimer); 
    digitBuffer = '';
    
    playerContainer.style.display = 'none';
    
    try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
    
    focusCurrent();
} 

// handle remote arrows / enter / digits
document.addEventListener('keydown', (e)=>{
    
    // KONTROLLAT E NAVIGIMIT TË FORMËS SË XTREAM
    if(xtreamLoginForm.classList.contains('visible')){
        e.preventDefault(); 
        const formInputs = [xtreamHostInput, xtreamUsernameInput, xtreamPasswordInput, xtreamConnectBtn, xtreamClearBtn];
        const currentElement = formInputs[xtreamFormFocusIndex - 1];
        
        currentElement.classList.remove('focused');
        if (currentElement.tagName === 'INPUT') {
            currentElement.blur();
        }

        if(e.key === 'ArrowDown' || e.key === 'ArrowRight'){
            xtreamFormFocusIndex = Math.min(xtreamFormFocusIndex + 1, formInputs.length);
        } else if(e.key === 'ArrowUp' || e.key === 'ArrowLeft'){
            xtreamFormFocusIndex = Math.max(xtreamFormFocusIndex - 1, 1);
        } else if(e.key === 'Enter'){
            formInputs[xtreamFormFocusIndex - 1].click();
            return;
        } else if(e.key === 'Backspace' || e.key === 'Escape'){
            toggleXtreamForm();
            return;
        }
        
        const nextElement = formInputs[xtreamFormFocusIndex - 1];
        nextElement.classList.add('focused');
        nextElement.focus();
        return;
    } 

    if(playerContainer.style.display === 'flex'){
        
        const channelMenu = document.getElementById('channelMenu');
        const menuItems = channelMenu ? channelMenu.querySelectorAll('.menu-channel-item') : [];
        const maxChannelIndex = allChannelsList.length - 1; 

        // LOGJIKA E NDËRRIMIT ME NUMRA
        if (e.key >= '0' && e.key <= '9') {
            e.preventDefault();
            
            if (digitTimer) clearTimeout(digitTimer);
            
            if (digitBuffer.length < 3) {
                digitBuffer += e.key;
            } else {
                digitBuffer = e.key;
            }
            
            const infoBar = document.getElementById('infoBar');
            const title = infoBar.querySelector('.channel-title');

            title.textContent = `Kanali: ${digitBuffer}`;
            infoBar.classList.add('visible'); 

            if (infoBarTimer) clearTimeout(infoBarTimer);
            
            digitTimer = setTimeout(() => {
                let targetNumber = parseInt(digitBuffer);
                
                if (targetNumber > 0 && targetNumber <= allChannelsList.length) {
                    const targetChannel = allChannelsList[targetNumber - 1];
                    switchChannel(targetChannel); 
                }
                
                digitBuffer = '';
                
                if (allChannelsList[currentChannelIndex]) {
                    showInfoBar(allChannelsList[currentChannelIndex]); 
                } else {
                    infoBar.classList.remove('visible');
                }
            }, 1000); 
            
            return; 
        }
        
        // KONTROLLA E MENYSË (Kur menuja është hapur)
        if(isMenuVisible){
            if(e.key === 'ArrowUp'){
                menuItems[menuFocusIndex]?.classList.remove('focused');
                menuFocusIndex = Math.max(0, menuFocusIndex - 1);
                menuItems[menuFocusIndex]?.classList.add('focused');
                centerMenuFocus(menuItems, menuFocusIndex); 
            } else if(e.key === 'ArrowDown'){
                menuItems[menuFocusIndex]?.classList.remove('focused');
                menuFocusIndex = Math.min(maxChannelIndex, menuFocusIndex + 1);
                menuItems[menuFocusIndex]?.classList.add('focused');
                centerMenuFocus(menuItems, menuFocusIndex); 
            } else if(e.key === 'Enter'){
                const channel = allChannelsList[menuFocusIndex];
                switchChannel(channel);
            }
            return; 
        } 

        // NDËRRIMI SEKUENCIAL ME UP/DOWN
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
            
            if (digitTimer) clearTimeout(digitTimer);
            digitBuffer = '';
            
            let newIndex = currentChannelIndex;
            
            if (e.key === 'ArrowUp') {
                newIndex = currentChannelIndex > 0 ? currentChannelIndex - 1 : maxChannelIndex;
            } else if (e.key === 'ArrowDown') {
                newIndex = currentChannelIndex < maxChannelIndex ? currentChannelIndex + 1 : 0;
            }
            
            const nextChannel = allChannelsList[newIndex];
            currentChannelIndex = newIndex; 
            openPlayerForChannel(nextChannel, true); 
            return;
        }


        // OK/ENTER: HAP MENUNË E KANALIT dhe shfaq Info Bar
        if(e.key === 'Enter'){
            if (digitBuffer.length > 0) {
                let targetNumber = parseInt(digitBuffer);
                if (targetNumber > 0 && targetNumber <= allChannelsList.length) {
                    const targetChannel = allChannelsList[targetNumber - 1];
                    switchChannel(targetChannel); 
                }
                if (digitTimer) clearTimeout(digitTimer);
                digitBuffer = '';
            } else {
                const currentChannel = allChannelsList[currentChannelIndex];
                showInfoBar(currentChannel);
                toggleChannelMenu();
            }
        } 

        // BACKSPACE/ESCAPE: Mbyll player-in
        if(e.key === 'Backspace' || e.key === 'Escape'){ 
            if (digitTimer) clearTimeout(digitTimer); 
            digitBuffer = '';
            closePlayer(); 
            history.back(); 
        }
        
        return; 
    } 

    // KONTROLLAT E NAVIGIMIT TË UI-SË (jashtë player-it)
    if(e.key === 'ArrowRight'){
        if(focusedArea === 'cats') { catFocus = Math.min(catFocus + 1, categories.length - 1); }
        else { 
            const gridItems = grid.querySelectorAll('.channel');
            if (gridFocus < gridItems.length - 1) {
                gridFocus = gridFocus + 1;
            } else {
                // ...
            }
        }
    }
    if(e.key === 'ArrowLeft'){
        if(focusedArea === 'cats') { catFocus = Math.max(catFocus - 1, 0); }
        else { gridFocus = Math.max(gridFocus - 1, 0); }
    }
    if(e.key === 'ArrowDown'){
        if(focusedArea === 'cats'){
            focusedArea = 'grid';
            gridFocus = Math.min(catFocus, grid.querySelectorAll('.channel').length - 1); 
        } else {
            const currentItems = grid.querySelectorAll('.channel');
            const newIndex = gridFocus + GRID_COLS;
            if (newIndex < currentItems.length) {
                gridFocus = newIndex;
            }
        }
    }
    if(e.key === 'ArrowUp'){
        if(focusedArea === 'grid'){
            if(gridFocus < GRID_COLS){ 
                focusedArea = 'cats';
                catFocus = Math.min(gridFocus, categories.length - 1);
            } else {
                gridFocus = gridFocus - GRID_COLS;
            }
        }
    } 

    const gridItems = grid.querySelectorAll('.channel');
    if(gridFocus >= gridItems.length) gridFocus = gridItems.length - 1;
    if(gridFocus < 0) gridFocus = 0; 
    
    if(e.key === 'Enter'){
        if(focusedArea === 'cats'){
             const catName = categories[catFocus];
             if (catName === "XTREAM LOGIN" && !xtreamData.host) {
                 toggleXtreamForm();
             } else {
                 loadCategory(catName);
             }
        } else {
            grid.querySelectorAll('.channel')[gridFocus]?.click();
        }
    }
    
    // BACKSPACE/ESCAPE: KTHEHU NË FAQEN KRYESORE NGA GRIDI
    if(e.key === 'Escape' || e.key === 'Backspace'){
        e.preventDefault();
        return;
    }


    focusCurrent();
}); 

// handle history/back
window.addEventListener('popstate', (e)=>{
    if(playerContainer.style.display === 'flex'){
        closePlayer();
    }
}); 

window.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' || e.key === 'Backspace'){
        if(playerContainer.style.display === 'flex' && !isMenuVisible){
            if(window.history.state && window.history.state.player){
                 history.back(); 
            } else {
                closePlayer();
            }
        }
    }
}); 

function updateOrientationClass(){
    const w = window.innerWidth, h = window.innerHeight;
    if(w>h) { playerContainer.classList.add('video-landscape'); playerContainer.classList.remove('video-portrait'); }
    else { playerContainer.classList.add('video-portrait'); playerContainer.classList.remove('video-landscape'); }
}
window.addEventListener('resize', updateOrientationClass);
window.addEventListener('orientationchange', updateOrientationClass); 

// Ngarkimi i gjendjes fillestare
function loadInitialState() {
    loadXtreamData(); 
    updateAllChannelsList(); 
    
    catWrap.innerHTML = '';
    categories.forEach((cat, ci) => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn';
        if (cat === "XTREAM LOGIN" && xtreamData.host) {
             btn.classList.add('linked');
        }
        btn.textContent = cat;
        btn.setAttribute('data-cat', cat);
        btn.tabIndex = 0;
        
        btn.onclick = () => {
            if (cat === "XTREAM LOGIN" && !xtreamData.host) {
                 toggleXtreamForm(); 
            } else {
                 loadCategory(cat);
            }
        };
        btn.onfocus = () => { focusedArea = 'cats'; catFocus = ci; };
        catWrap.appendChild(btn);
    });

    loadCategory(currentCategory);
    
    updateClock();
    loadSuharekeWeather();
}

loadInitialState(); 

// Përditësojmë Orën çdo minutë (60000ms)
setInterval(updateClock, 60000); 
// Përditësojmë Motin çdo 10 minuta (600000ms)
setInterval(loadSuharekeWeather, 600000); 

</script>
